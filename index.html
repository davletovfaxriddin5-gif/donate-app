<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>minatoh</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   minatoh — dizayn tokenlari (navy + ko'k) — ixcham o'lcham
   ========================================================= */
:root{
  --bg:#0B1120;
  --bg-t:rgba(11,17,32,0);
  --bg-2:#0D1626;
  --card:#141D31;
  --card-2:#18223A;
  --stroke:rgba(255,255,255,.06);
  --stroke-2:rgba(255,255,255,.12);
  --text:#EEF2FB;
  --dim:#8B94AC;
  --faint:#5C6580;
  --blue:#3B4DF0;
  --blue-grad:linear-gradient(135deg,#3F55F6 0%,#5A43F2 100%);
  --blue-soft:rgba(63,85,246,.16);
  --gold:#F0A93C;
  --green:#2FB574;
  --green-soft:rgba(47,181,116,.15);
  --nav-h:66px;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{ overflow-x:hidden; max-width:100%;
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
}
.reduce-motion *{animation:none!important;transition:none!important}
.wrap{max-width:460px;margin:0 auto;position:relative;min-height:100dvh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + var(--tg-top, 46px)) 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::-webkit-scrollbar{display:none}

.profile{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.profile .who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--blue-grad);
  display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.who .nm{font-weight:800;font-size:15px;font-style:italic;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .un{color:var(--dim);font-size:12px;margin-top:1px}
.coin{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--stroke);
  padding:6px 12px;border-radius:999px;font-weight:700;font-size:13.5px}
.coin .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE07A,#F0B429)}

.balance{background:linear-gradient(150deg,#2B2FE8 0%,#3D33EE 55%,#4A3BF2 100%);
  border-radius:22px;padding:15px 17px 14px;margin-bottom:20px;
  box-shadow:0 14px 34px -14px rgba(43,47,232,.65);position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;
  background:rgba(255,255,255,.07)}
/* iPhone'ning o'z shrifti (SF Pro) — raqamlar shu bilan chiroyli chiqadi */
.balance .lbl{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-size:13px;color:rgba(255,255,255,.6);font-weight:400;letter-spacing:-.1px}
.balance .amt{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  font-weight:600;font-size:30px;letter-spacing:-.7px;line-height:1.1;margin:1px 0 13px;color:#fff;
  font-variant-numeric:proportional-nums}
.balance .amt small{font-size:15px;font-weight:500;color:rgba(255,255,255,.6);margin-left:5px;letter-spacing:0}
.bal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;position:relative;z-index:1}
.bal-btn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.17);
  border-radius:17px;padding:11px 6px;display:flex;flex-direction:column;
  align-items:center;gap:7px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-size:12px;font-weight:400;color:#fff;line-height:1.25;text-align:center;transition:.15s}
.bal-btn:active{transform:scale(.992);background:rgba(255,255,255,.10)}
.bal-btn svg{width:21px;height:21px;fill:#fff;stroke:none}

.sec-lbl{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;margin:18px 2px 10px}

.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game{position:relative;min-width:0}
.game .tile{position:relative;width:100%;aspect-ratio:1;border-radius:15px;overflow:hidden;
  background:var(--card);display:grid;place-items:center;transition:transform .12s}
.game:active .tile{transform:scale(.991)}
.game .tile img{width:100%;height:100%;object-fit:cover}
.game .glyph{font-size:26px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.game .star{position:absolute;top:0;left:0;width:25px;height:25px;border-radius:15px 0 12px 0;
  display:grid;place-items:center;font-size:11px;z-index:2}
.game .star.on{background:var(--gold)}
.game .star.off{background:#4A5266}
.game .badge{position:absolute;top:6px;right:6px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;
  padding:2px 6px;border-radius:7px;z-index:2;letter-spacing:.2px}
.game .maint{position:absolute;inset:0;background:rgba(8,12,22,.55);display:grid;place-items:center;z-index:1}
.game .maint span{background:var(--gold);color:#1a1200;font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:8px}
.game .nm{text-align:center;font-size:10.5px;font-weight:600;color:var(--dim);margin-top:7px;
  letter-spacing:.2px;text-transform:uppercase;line-height:1.25;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.back-row{display:flex;align-items:center;margin-bottom:14px}
.back-btn{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--stroke);
  padding:9px 13px 9px 10px;border-radius:12px;font-weight:700;font-size:13.5px}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.gd-head{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--stroke);
  border-radius:var(--radius);padding:14px;margin-bottom:16px}
.gd-head .ic{width:60px;height:60px;border-radius:15px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;
  background:var(--card-2);font-size:28px}
.gd-head .ic img{width:100%;height:100%;object-fit:cover}
.gd-head .nm{font-weight:800;font-size:19px;letter-spacing:-.4px;line-height:1.1;text-transform:uppercase}
.gd-head .cur{font-size:17px;margin-top:3px}
/* Chetda yashiringan qahramon \u2014 o'lchamlarni shu yerdan sozlanadi */
:root{ --peek-h:124px; --peek-right:-12px; --peek-top:336px }
.gd-head.hasbg{background-size:cover;background-position:center;overflow:hidden;position:relative;
  background-clip:padding-box;border-color:rgba(11,17,32,.85)}
.gd-head.hasbg>*{position:relative;z-index:2}
.gd-head.hasbg:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(11,17,32,.86),rgba(11,17,32,.62) 55%,rgba(11,17,32,.30))}
.peek-side{position:absolute;right:var(--peek-right);top:var(--peek-top);height:var(--peek-h);width:auto;z-index:5;pointer-events:none;filter:drop-shadow(-6px 6px 14px rgba(0,0,0,.5))}
.gd-hero{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;margin-bottom:16px;border:1px solid var(--stroke);background:var(--card-2)}
.gd-hero video,.gd-hero>img{width:100%;height:100%;object-fit:cover;display:block}
.gd-hero:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.15) 45%,transparent 70%)}
.gd-hero .ht{position:absolute;left:15px;right:15px;bottom:13px;z-index:2;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.4px;line-height:1.1;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.saved-ids{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;margin-bottom:16px}
.saved-ids .chip{background:var(--card);border:1px solid var(--stroke);border-radius:12px;padding:10px 14px;
  white-space:nowrap;font-size:12.5px;color:var(--dim);flex-shrink:0}
.form-card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:15px;margin-bottom:18px}
.form-card .lbl{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.inp-wrap{position:relative;margin-bottom:14px}
.inp-wrap:last-child{margin-bottom:0}
.inp{width:100%;background:var(--bg-2);border:1px solid var(--stroke-2);border-radius:12px;
  padding:13px 46px 13px 15px;color:var(--text);font-size:13.5px}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--blue)}
.info-i{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
  background:var(--blue-soft);color:#7E93FF;display:grid;place-items:center;font-size:11.5px;font-weight:700;font-style:italic}
.row-inp{display:flex;gap:10px;align-items:stretch}
.row-inp .inp-wrap{flex:1;margin-bottom:0}
.check-btn{background:linear-gradient(135deg,#4F46F5 0%,#5B4BF7 100%);border-radius:999px;padding:0 20px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-weight:500;font-size:14px;color:#fff;letter-spacing:-.1px;
  white-space:nowrap;box-shadow:0 10px 26px -10px rgba(79,70,245,.85)}
.check-btn:active{transform:scale(.994)}
.region-tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.region-tabs .rt{background:var(--card);border:1px solid var(--stroke);border-radius:12px;padding:10px 14px;
/* === Ixchamroq: region tablari, saqlangan ID, ID formasi === */
.region-tabs{ gap:7px; margin-bottom:13px }
.region-tabs .rt{ padding:7px 13px; font-size:11px; border-radius:999px }
.saved-ids{ gap:7px; margin-bottom:13px }
.saved-ids .chip{ padding:4px 10px; font-size:11px; border-radius:999px }
.region-tabs .rt{ padding:4px 10px !important; font-size:11px !important; line-height:1.1 !important }
.saved-ids .chip{ padding:4px 10px !important; font-size:11px !important; line-height:1.1 !important }
.form-card{ padding:13px }
...
  font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--dim);transition:.15s}
.region-tabs .rt.on{background:var(--blue);color:#fff;border-color:transparent}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:8px}
.pkg-sec{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;margin:12px 2px 2px}
.pkg{position:relative;background:var(--card);border:1.5px solid rgba(240,169,60,.45);border-radius:14px;
  padding:13px 11px;display:flex;align-items:center;gap:10px;transition:.14s;text-align:left;overflow:hidden}
.pkg:active{transform:scale(.994)}
.pkg.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 26px -12px rgba(240,169,60,.5)}
.pkg .pic{position:relative;flex-shrink:0}
.pkg .pic .em{font-size:24px}
.pkg .pic .x2{position:absolute;top:-7px;left:-6px;background:var(--gold);color:#1a1200;font-size:9px;
  font-weight:800;padding:1px 5px;border-radius:6px;font-style:italic}
.pkg .info{min-width:0}
.pkg .info .a{font-weight:800;font-size:15.5px;letter-spacing:-.3px;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pkg .info .p{color:var(--gold);font-weight:700;font-size:12.5px;margin-top:3px}
.pkg .hit{position:absolute;top:9px;right:9px;background:var(--gold);color:#1a1200;font-size:9px;font-weight:800;
  padding:2px 7px;border-radius:7px;letter-spacing:.3px}
.pkg .info .a.small{font-size:13px;white-space:normal;max-width:100%}

.buy-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
  width:calc(100% - 28px);max-width:432px;z-index:60}
.buy-btn{width:100%;background:var(--blue-grad);border-radius:15px;padding:15px;font-weight:800;font-size:15px;
  color:#fff;box-shadow:0 14px 34px -10px rgba(63,85,246,.7)}
.buy-btn:active{transform:scale(.996)}
.buy-btn:disabled{opacity:.5;box-shadow:none}

.page-title{font-weight:800;font-size:23px;letter-spacing:-.6px;margin:4px 2px 14px}

.seg{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:15px;padding:5px;margin-bottom:14px}
.seg button{flex:1;padding:11px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim);transition:.15s}
.seg button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chips .c{background:var(--card);border:1px solid var(--stroke);border-radius:999px;padding:9px 16px;
  font-weight:700;font-size:13.5px;color:var(--dim);white-space:nowrap;transition:.15s}
.chips .c.on{background:var(--blue);color:#fff;border-color:transparent}
.refresh-btn{width:100%;background:var(--blue-soft);border:1px solid rgba(63,85,246,.3);border-radius:14px;
  padding:13px;font-weight:700;font-size:14px;color:#9CA9FF;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:16px}
.refresh-btn:active{transform:scale(.996)}
.refresh-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes mtspin{to{transform:rotate(360deg)}}
.refresh-btn.busy svg{animation:mtspin .8s linear infinite;transform-origin:50% 50%}
.refresh-btn.busy{opacity:.85}

.order{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.order .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.order .g{display:flex;align-items:center;gap:10px}
.order .g .ic{width:46px;height:46px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;
  font-size:20px;flex-shrink:0;overflow:hidden}
.order .g .ic img{width:100%;height:100%;object-fit:cover}
.order .g .nm{font-weight:800;font-size:15px}
.order .g .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
.order .price{font-weight:800;font-size:16.5px;white-space:nowrap}
.order .price small{color:var(--dim);font-weight:600;font-size:12px;margin-left:3px}
.order .sep{height:1px;background:var(--stroke);margin:12px 0}
.order .kv{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}
.order .kv:last-of-type{margin-bottom:0}
.order .kv .k{color:var(--dim)}
.order .kv .v{font-weight:600}
.badge-st{font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px}
.badge-st.done{color:#4FE0A0;background:var(--green-soft)}
.badge-st.wait{color:var(--gold);background:rgba(240,169,60,.14)}
.order .date{color:var(--faint);font-size:12px;margin-top:10px}

.empty{text-align:center;padding:50px 24px;color:var(--dim)}
.empty .em{font-size:40px;margin-bottom:14px}
.empty h3{font-weight:800;font-size:16px;color:var(--text);margin:0 0 6px}
.empty p{font-size:12.5px;margin:0}

.set-profile{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:15px;margin-bottom:18px}
.set-profile .top{display:flex;align-items:center;gap:12px}
.set-profile .nm{font-weight:800;font-size:16.5px;font-style:italic}
.set-profile .un{color:#7E93FF;font-size:12.5px;margin-top:1px}
.id-chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg-2);border:1px solid var(--stroke);
  border-radius:10px;padding:5px 11px;margin-top:8px;font-size:12.5px;color:var(--dim);font-weight:600}
.id-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg-2);border:1px solid var(--stroke);border-radius:14px;padding:12px 14px}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.stat .v{font-weight:800;font-size:18px;margin-top:4px}
.stat .v.gold{color:var(--gold)}
.stat .v small{font-size:12px;font-weight:600;color:var(--dim);margin-left:4px}
.big-btn{width:100%;background:var(--blue-soft);border:1px solid rgba(63,85,246,.35);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;margin-bottom:8px;transition:.15s}
.big-btn:active{transform:scale(.996)}
.big-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;flex-shrink:0}
.big-btn .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lang-toggle{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:15px;padding:5px;margin-bottom:8px}
.lang-toggle button{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim);transition:.15s}
.lang-toggle button.on{background:var(--blue);color:#fff}
.svc-list{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);overflow:hidden}
.svc{display:flex;align-items:center;gap:12px;padding:14px 16px;transition:.12s;width:100%;text-align:left}
.svc:active{background:transparent}
/* Butun qator oqarib ketmasin — bosilish faqat ikonkada sezilsin */
.svc:active .ic{ transform:scale(.985); filter:brightness(1.03) }
.svc .ic{ transition:transform .14s, filter .14s }
.svc + .svc{border-top:1px solid var(--stroke)}
.svc .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.svc .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.svc .t{font-weight:700;font-size:14px}
.svc .s{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.4}
.svc .arw{color:var(--faint);font-size:20px;margin-left:auto;flex-shrink:0}
.svc .txt{min-width:0}
.switch{width:44px;height:26px;border-radius:999px;background:var(--stroke-2);margin-left:auto;flex-shrink:0;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--blue)}
.switch.on::after{left:21px}

.guide-btn{width:100%;background:var(--blue-soft);border:1px solid rgba(63,85,246,.35);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:18px;transition:.15s}
.guide-btn:active{transform:scale(.996)}
.guide-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.guide-btn .t{font-weight:700;font-size:15px;color:#9CA9FF}
.guide-btn .r{margin-left:auto;color:#7E93FF;font-size:13px;font-weight:600}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.check-btn:disabled{opacity:.45}
.pay{background:#fff;border-radius:13px;padding:11px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.14s}
.pay:active{transform:scale(.992)}
.pay .box{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.pay .nm{font-size:12.5px;font-weight:700;color:#1a2236;text-align:center}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:70;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);
  display:flex;align-items:center;gap:8px}
.nav-inner{flex:1;display:flex;background:rgba(15,22,38,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--stroke);border-radius:18px;padding:7px 4px;height:54px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--faint);font-size:10.5px;font-weight:600;border-radius:14px;transition:.15s}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.on{background:var(--blue);color:#fff}
.rent{width:58px;height:54px;border-radius:18px;border:1px solid var(--stroke);background:rgba(15,22,38,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;flex-shrink:0;color:var(--gold);font-size:10px;font-weight:700}
.rent:active{transform:scale(.991)}
.rent .g{display:flex;align-items:center;gap:4px}
.rent .g svg{width:18px;height:18px}

.ref-list{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:14px 14px 16px;overflow:hidden}
.ref-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px;
  font-weight:700;font-size:14px}
.ref-head span{background:var(--blue-soft);color:#8CA0FF;border-radius:99px;padding:2px 10px;font-size:12.5px}
.ref-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-2);
  border:1px solid var(--stroke-2);border-radius:16px;margin-bottom:10px}
.ref-row:last-child{margin-bottom:0}
.ref-av{width:42px;height:42px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;
  font-weight:700;font-size:15px;color:var(--dim);flex-shrink:0;position:relative;overflow:hidden}
.ref-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.ref-row.tap{cursor:pointer;transition:background .15s,transform .15s}
.ref-row.tap:active{transform:scale(.995)}
.ref-nm{flex:1;min-width:0}
.ref-nm .a{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-nm .b{color:var(--dim);font-size:12px;margin-top:3px}
.ref-c{color:var(--dim);font-size:12.5px;flex-shrink:0;background:var(--card-2);border-radius:99px;padding:3px 9px}
.ref-head.gone-h{border-top:1px solid var(--stroke);margin-top:4px;padding-top:14px;color:var(--dim);font-size:13px}
.ref-head.gone-h span{background:rgba(255,255,255,.06);color:var(--faint)}
.ref-row.gone{opacity:.45}
.ref-row.gone .ref-nm .a{text-decoration:line-through}
.ttl-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl-row .page-title{margin-bottom:0}
.chg-btn{background:none;border:none;padding:4px 2px;color:#7E93FF;font-size:12.5px;font-weight:500;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;white-space:nowrap}
.chg-btn:active{opacity:.55}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + var(--tg-top, 46px) + 6px);transform:translateX(-50%) translateY(-20px);
  background:var(--card-2);border:1px solid var(--stroke-2);color:#fff;padding:12px 18px;border-radius:13px;
  font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.5);
  pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Karta chizig'idan chetga chiqib turadigan banner rasmi.
   Rasm karta ustiga qo'yiladi va har tomondan --pop-x / --pop-y ga
   kengaytiriladi; shaffof PNG ning chetdagi qismlari (mashina, mototsikl)
   shu qo'shimcha joyga tushib, kartadan chiqib turgandek ko'rinadi. */
/* Foizlar pubg-x21.webp dan O'LCHAB olingan:
   rasm 2172x724, ichki ramka 1733x416, chapdan 163 / tepadan 193 px.
   left = 163/1733, width = 2172/1733, top = 193/416, height = 724/416.
   DIQQAT: boshqa rasm qo'yilsa bu foizlar ham qayta hisoblanishi kerak. */
.gd-head.haspop{position:relative;overflow:visible}
.gd-head.haspop .pop{position:absolute;
  left:-9.406%; width:125.332%;
  top:-46.394%; height:174.038%;
  max-width:none;object-fit:fill;
  pointer-events:none;z-index:1;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
/* Qatlam yengil: rasm ko'rinib tursin. Matn o'qilishini quyidagi soya ta'minlaydi. */
.gd-head.haspop:after{content:'';position:absolute;inset:0;z-index:2;
  border-radius:var(--radius);
  background:linear-gradient(90deg,rgba(11,17,32,.62),rgba(11,17,32,.26) 38%,rgba(11,17,32,0) 66%)}
.gd-head.haspop>*{position:relative;z-index:3}
.gd-head.haspop .nm,.gd-head.haspop .cur{
  text-shadow:0 1px 2px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.8)}
body.light .gd-head.haspop:after{
  background:linear-gradient(90deg,rgba(255,255,255,.66),rgba(255,255,255,.28) 38%,rgba(255,255,255,0) 66%)}
body.light .gd-head.haspop .nm,body.light .gd-head.haspop .cur{
  text-shadow:0 1px 2px rgba(255,255,255,.95), 0 2px 10px rgba(255,255,255,.85)}

/* Rejim almashganda silliq o'tish. .theming faqat almashish paytida turadi,
   shuning uchun qolgan animatsiyalarga xalaqit bermaydi. */
body.theming, body.theming *{
  /* matn va ikonka rangi DARROV almashadi (0s) — kulrang oraliq bosqichlar bo'lmaydi.
     Fon va soya esa avvalgidek silliq o'tadi. */
  transition: background-color .4s ease, color 0s, fill 0s,
              border-color .28s ease, box-shadow .4s ease !important;
}
body.theming, body.theming *{ text-shadow:none !important }
body.reduce-motion.theming, body.reduce-motion.theming *{ transition:none !important; }

/* === Pastki panel: suyuq kapsula === */
.nav-inner{ position:relative }
.nav-goo{ position:absolute; left:0; right:0; top:7px; bottom:7px; z-index:0; opacity:0;
  pointer-events:none }
.nav-goo i{ position:absolute; left:0; top:0; bottom:0; width:0; display:block;
  border-radius:999px; background:var(--blue) }
.nav-goo .nav-tail{ display:none }
.nav-pill{ position:absolute; left:0; top:7px; bottom:7px; width:0; border-radius:999px;
  z-index:1; opacity:0; pointer-events:none;
  border:1px solid rgba(255,255,255,.42);
  background:linear-gradient(100deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.08) 36%, rgba(255,255,255,0) 62%);
  background-size:220% 100%; background-position:50% 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.58),
             inset 0 -7px 14px -9px rgba(255,255,255,.40),
             0 8px 22px -10px rgba(59,77,240,.95);
  transform-origin:center center; will-change:transform }
.nav-inner .nav-item{ position:relative; z-index:2; transition:color .2s ease, transform .16s ease }
.nav-inner .nav-item.on{ background:transparent; border:0; color:#fff }
.nav-item svg{ transition:transform .22s cubic-bezier(.34,1.4,.5,1) }
.nav-inner .nav-item.on svg{ transform:scale(1.08) }
.nav-inner .nav-item:active{ transform:scale(.99) }
.reduce-motion .nav-goo{ filter:none; -webkit-filter:none }
/* === Tanlov tugmalari: suyuq kapsula === */
.fx-host{ position:relative }
.fx-goo{ position:absolute; left:0; right:0; top:4px; bottom:4px; z-index:0; opacity:0;
  pointer-events:none }
.fx-goo i{ position:absolute; left:0; top:0; bottom:0; width:0; display:block;
  border-radius:999px; background:var(--blue) }
.fx-goo .fx-tail{ display:none }
.fx-rim{ position:absolute; left:0; top:4px; bottom:4px; width:0; border-radius:999px;
  z-index:1; opacity:0; pointer-events:none;
  border:1px solid rgba(255,255,255,.42);
  background:linear-gradient(100deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.08) 36%, rgba(255,255,255,0) 62%);
  background-size:220% 100%; background-position:50% 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.58),
             inset 0 -7px 14px -9px rgba(255,255,255,.40),
             0 8px 22px -10px rgba(59,77,240,.95);
  transform-origin:center center; will-change:transform }
.fx-host button{ position:relative; z-index:2 }
.fx-host button.on{ background:transparent; border:0; box-shadow:none; color:#fff }
.reduce-motion .fx-goo{ filter:none; -webkit-filter:none }
/* === Ochilish ekrani === */
#splash{ position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  transition:opacity .5s ease, visibility .5s, transform .5s ease }
#splash.gone{ opacity:0; visibility:hidden; pointer-events:none; transform:scale(1.06) }

.sp-stage{ position:relative; width:150px; height:150px; display:grid; place-items:center;
  animation:spIn .78s cubic-bezier(.22,1.35,.36,1) both }
.sp-stage::before{ content:""; position:absolute; inset:-90px; border-radius:50%;
  background:radial-gradient(circle, rgba(63,85,246,.22), rgba(63,85,246,0) 70%);
  animation:spGlow 3.4s ease-in-out infinite }
@keyframes spIn{
  0%  { transform:scale(.55) rotate(-22deg); opacity:0 }
  55% { opacity:1 }
  100%{ transform:scale(1) rotate(0deg); opacity:1 }
}
@keyframes spGlow{
  0%,100%{ transform:scale(.9);  opacity:.65 }
  50%    { transform:scale(1.08); opacity:1 }
}

.sp-ring{ position:absolute; width:118px; height:118px; border-radius:50%;
  border:2px solid rgba(150,168,255,.9); opacity:0;
  animation:spRing 1.6s ease-out .3s both }
@keyframes spRing{
  0%  { transform:scale(.35); opacity:0 }
  16% { opacity:.95 }
  100%{ transform:scale(2.4); opacity:0 }
}

.sp-mark{ position:relative; width:128px; height:128px; display:block;
  filter:drop-shadow(0 12px 30px rgba(59,77,240,.55));
  animation:spFloat 3s ease-in-out .5s infinite }
@keyframes spFloat{
  0%,100%{ transform:translateY(0)     rotate(0deg) }
  25%    { transform:translateY(-9px)  rotate(-4deg) }
  75%    { transform:translateY(9px)   rotate(4deg) }
}

.sp-name{ font-size:14px; font-weight:600; text-transform:uppercase; color:var(--dim);
  text-indent:6px; opacity:0; animation:spName .85s ease-out .36s both }
@keyframes spName{
  0%  { opacity:0; letter-spacing:.5px; transform:translateY(7px) }
  100%{ opacity:1; letter-spacing:6px;  transform:translateY(0) }
}

.sp-bar{ width:148px; height:4px; border-radius:999px; background:rgba(255,255,255,.10);
  overflow:hidden; opacity:0; animation:spFade .6s ease-out .52s both }
.sp-bar i{ display:block; height:100%; width:0; border-radius:999px; background:var(--blue-grad);
  animation:spFill 1.7s cubic-bezier(.25,.8,.3,1) .52s both }
@keyframes spFill{ 0%{ width:0 } 100%{ width:92% } }
@keyframes spFade{ to{ opacity:1 } }
#splash.gone .sp-bar i{ animation:none; width:100%; transition:width .3s ease }

body.light .sp-bar{ background:rgba(16,24,40,.12) }
body.light .sp-stage::before{ background:radial-gradient(circle, rgba(63,85,246,.14), rgba(63,85,246,0) 70%) }
body.light .sp-ring{ border-color:rgba(59,77,240,.55) }

            animation:promoGlow 3.2s ease-in-out infinite }
/* Tanlangan payt sariq yonish TO'XTAYDI va ko'k tanlov ustiga chiqadi.
   Aks holda ikkovi navbatma-navbat chiqib, rang o'ynab ko'rinardi.
   Boshqa paket tanlansa sariq o'z holiga qaytadi. */
.pkg.promo.sel{ animation:none !important;
  border-color:rgba(110,130,255,.9) !important;
  box-shadow:0 0 0 1px rgba(110,130,255,.45), 0 0 24px rgba(110,130,255,.30) !important }
.pkg.promo.sel .hit{ animation:none !important; box-shadow:none !important }
@keyframes promoGlow{
  0%,100%{ box-shadow:0 0 0 1px rgba(245,179,1,.22), 0 0 10px rgba(245,179,1,.12) }
  50%    { box-shadow:0 0 0 1px rgba(245,179,1,.50), 0 0 20px rgba(245,179,1,.30) }
}
.pkg .hit{ animation:hitGlow 3.2s ease-in-out infinite }
@keyframes hitGlow{
  0%,100%{ box-shadow:0 0 4px rgba(245,179,1,.25) }
  50%    { box-shadow:0 0 12px rgba(245,179,1,.60) }
}
.buy-bar .check-btn, .buy-btn{ box-shadow:0 8px 26px -8px rgba(63,85,246,.75) !important }
.lang-page{ display:flex; flex-direction:column; gap:8px; padding-bottom:20px }
.lang-page .lrow{ display:flex; align-items:center; gap:12px; width:100%; background:var(--card);
                  border:1px solid var(--stroke); border-radius:14px; padding:13px 15px; font-size:14px; color:var(--text) }
.lang-page .lrow.on{ border-color:var(--blue); background:rgba(63,85,246,.14) }
.lang-page .lf{ font-size:20px; line-height:1 }
.lang-page .ln{ flex:1; text-align:left }
.lang-page .lc{ color:#4FE0A0; font-weight:800 }
/* === Bildirishnoma: nozik, tinch, orqasi ko'rinmaydi === */
.toast{ left:14px !important; right:14px !important; width:auto !important; max-width:none !important;
        transform:translateY(-30px) scale(.97) !important; text-align:left;
        padding:12px 18px !important; font-size:14.5px !important; font-weight:500 !important;
        font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif !important;
        letter-spacing:-.2px !important;
        line-height:1.3 !important; border-radius:16px !important;
        background:rgba(20,26,42,.55) !important;
        backdrop-filter:blur(34px) saturate(170%) !important;
        -webkit-backdrop-filter:blur(34px) saturate(170%) !important;
        border:1px solid rgba(255,255,255,.09) !important;
        box-shadow:0 16px 40px -18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06) !important;
        transition:opacity .38s cubic-bezier(.22,1,.36,1), transform .38s cubic-bezier(.22,1,.36,1) !important }
.toast.show{ transform:translateY(0) scale(1) !important }
.toast.t-ok { border-color:rgba(80,225,160,.34) !important; color:#63E5AE !important;
              box-shadow:0 0 26px -6px rgba(60,210,145,.28),
                         0 16px 40px -18px rgba(0,0,0,.6),
                         inset 0 1px 0 rgba(255,255,255,.06) !important }
.toast.t-err{ border-color:rgba(255,110,125,.34) !important; color:#FF8F9B !important;
              box-shadow:0 0 26px -6px rgba(215,80,140,.30),
                         0 16px 40px -18px rgba(0,0,0,.6),
                         inset 0 1px 0 rgba(255,255,255,.06) !important }
body.light .toast{ background:rgba(252,252,254,.98) !important; border-color:rgba(0,0,0,.08) !important;
                   box-shadow:0 16px 44px -14px rgba(0,0,0,.22) !important }
body.light .toast.t-ok { color:#0f8a58 !important }
body.light .toast.t-err{ color:#cc2a30 !important }
/* ===== Tarix bo'limida bosilganda ozgina ichkariga kirish ===== */
.refresh-btn, .order[onclick], .sheet .sh-close{
  transition: transform .13s cubic-bezier(.2,.85,.3,1);
}
.refresh-btn.tapped, .chips .c.tapped, .seg button.tapped{ transform: scale(.975) !important }
.order.tapped{ transform: scale(.99) !important }
.sheet .sh-close.tapped{ transform: scale(.99) !important }
/* Nusxalash / Ulashish / Qo'llanma / Tekshirish tugmalari ham bosilganda kirsin */
.rlk-b, .guide-btn, .check-btn{ transition: transform .13s cubic-bezier(.2,.85,.3,1) !important }
.rlk-b.tapped, .guide-btn.tapped{ transform: scale(.978) !important }
.check-btn.tapped{ transform: scale(.982) !important }

/* ===== Buyurtma tafsilotlari (pastdan chiquvchi oyna) ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);z-index:200;opacity:0;transition:opacity .22s ease}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--card);
  border-radius:24px 24px 0 0;border-top:1px solid var(--stroke-2);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.9,.3,1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:460px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet{transform:translateY(calc(100% + 14px))}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--stroke-2);margin:0 auto 15px}
.sheet .sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.sheet .sh-g{display:flex;align-items:center;gap:11px;min-width:0}
.sheet .sh-ic{width:52px;height:52px;border-radius:14px;background:var(--card-2);display:grid;
  place-items:center;font-size:22px;flex-shrink:0;overflow:hidden}
.sheet .sh-ic img{width:100%;height:100%;object-fit:cover}
.sheet .sh-nm{font-weight:700;font-size:17px;letter-spacing:-.3px}
.sheet .sh-sub{color:var(--dim);font-size:13px;margin-top:2px}
.sheet .sh-box{background:var(--card-2);border-radius:16px;overflow:hidden;margin-bottom:14px}
.sheet .sh-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 15px;font-size:13.5px}
.sheet .sh-row + .sh-row{border-top:1px solid var(--stroke)}
.sheet .sh-row .k{color:var(--dim);flex-shrink:0}
.sheet .sh-row .v{font-weight:600;text-align:right;word-break:break-word}
.sheet .sh-close{width:100%;background:var(--card-2);border:1px solid var(--stroke-2);border-radius:16px;
  padding:15px;font-weight:600;font-size:15px;color:var(--text)}
body.light .sheet-bg{background:rgba(0,0,0,.35)}

/* ===== Yorug' rejim: rasm ustidagi matn ham o'qilsin =====
   Banner ikki xil: hasbg (butun fon rasmi) va haspop (yon personaj). Ikkalasi ham. */
body.light .gd-head.hasbg:before{
  background:linear-gradient(90deg,rgba(11,17,32,.86),rgba(11,17,32,.62) 55%,rgba(11,17,32,.30)) !important }
body.light .gd-head.hasbg,
body.light .gd-head.hasbg .nm,
body.light .gd-head.hasbg .cur,
body.light .gd-head.hasbg .sub{
  color:#fff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.8) !important }
body.light .gd-head.hasbg{ border-color:rgba(11,17,32,.85) !important }
body.light .gd-head.haspop:after{
  background:linear-gradient(90deg,rgba(11,17,32,.66),rgba(11,17,32,.30) 40%,rgba(11,17,32,0) 68%) !important }
body.light .gd-head.haspop .nm,
body.light .gd-head.haspop .cur,
body.light .gd-head.haspop .sub{
  color:#fff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.8) !important }

/* ===== O'yin sahifasi: tepadagi rasm ham xuddi shunday ===== */
.gd-head .ic{ border-radius:15px !important;
  box-shadow:0 0 0 1.5px var(--card), 0 0 0 2.5px rgba(255,255,255,.12) !important }
body.light .gd-head .ic{ box-shadow:0 0 0 1.5px var(--card), 0 0 0 2.5px rgba(16,24,40,.14) !important }
.gd-head{ gap:15px !important }   /* halqa uchun joy */

/* ===== O'yin plitkalari: chetida nozik halqa (avatarnikiga o'xshash) ===== */
.game .tile{ box-shadow:0 0 0 1.5px var(--bg), 0 0 0 2.5px rgba(255,255,255,.12) !important }
body.light .game .tile{ box-shadow:0 0 0 1.5px var(--bg), 0 0 0 2.5px rgba(16,24,40,.14) !important }
.games{ gap:13px !important }   /* halqa uchun joy: plitkalar bir-biriga tegib qolmasin */

/* ===== SINOV: uchta shrift — faqat bitta sarlavhada =====
   Almashtirish uchun pastdagi oxirgi qatorda 'FSElliot' o'rniga
   'Sispectly' yoki 'Amoun' deb yozing. Boshqa hech nimaga tegmang. */
@font-face{ font-family:'FSElliot';  src:url('/fselliot.woff')  format('woff'); font-weight:400; font-display:swap }
@font-face{ font-family:'Sispectly'; src:url('/sispectly.woff') format('woff'); font-weight:400; font-display:swap }
@font-face{ font-family:'Amoun';     src:url('/amoun.woff')     format('woff'); font-weight:400; font-display:swap }
/* SINOV: shrift faqat telefon raqami qatorida.
   Almashtirish uchun font-family dagi birinchi nomni o'zgartiring:
   -apple-system  = iPhone ning o'z SF Pro si (fayl kerak emas)
   'FSElliot'     = FS Elliot Pro
   'Sispectly'    = Sispectly Harmonies */
.ph-line{ font-size:13px !important; font-weight:500 !important; letter-spacing:-.2px !important;
  line-height:1.25 !important; margin-top:3px !important;
  font-variant-numeric:tabular-nums !important; font-feature-settings:"tnum" 1 !important }

/* ===== Sozlamalar profili: ixchamroq, telefon qutisiz ===== */
.set-profile{ padding:13px !important; border-radius:20px !important; margin-bottom:15px !important }
.set-profile .top{ gap:11px !important }
.set-profile .avatar{ width:46px !important; height:46px !important; font-size:17px !important;
  /* rasm atrofida nozik halqa: avval karta rangida kichik bo'shliq, keyin ingichka yorug' chiziq */
  box-shadow:0 0 0 2px var(--card), 0 0 0 3px rgba(255,255,255,.13) !important }
body.light .set-profile .avatar{ box-shadow:0 0 0 2px var(--card), 0 0 0 3px rgba(16,24,40,.13) !important }
.set-profile .stat-row{ margin-top:11px !important; gap:9px !important }
.set-profile .stat{ padding:9px 12px !important; border-radius:12px !important }
.set-profile .stat .k{ font-size:9.5px !important; letter-spacing:.8px !important }
.set-profile .stat .v{ font-size:16px !important; font-weight:700 !important; margin-top:2px !important }
.set-profile .stat .v small{ font-size:11px !important }
.set-profile .top > div:last-child{ min-width:0 }
.set-profile .nm{ font-size:15.5px !important; font-weight:700 !important; font-style:normal !important;
  letter-spacing:-.3px !important }
.set-profile .un{ font-size:13px !important; font-weight:500 !important; letter-spacing:-.2px !important }
.ph-line{ color:#7E93FF; font-size:13.5px; font-weight:500; letter-spacing:-.2px; margin-top:2px }
.id-chip{ font-size:13px !important; padding:3px 9px !important; margin-top:6px !important;
  border-radius:8px !important; font-weight:500 !important; letter-spacing:-.2px !important;
  gap:6px !important; transition:transform .12s, background .12s !important }
.id-chip:active{ transform:scale(.988) !important; background:var(--card-2) !important;
  filter:brightness(.88) !important }
.id-chip svg{ width:12px !important; height:12px !important; transition:.2s }
.id-chip svg.idok{ stroke:#4FE0A0 !important; stroke-width:2.6 !important }

/* ===== Referal kartasi ===== */
.rlk-card{ background:var(--card); border:1px solid rgba(255,255,255,.055); border-radius:26px;
  padding:18px; margin-bottom:14px }
body.light .rlk-card{ border-color:rgba(16,24,40,.08) }
.rlk-head{ display:flex; align-items:center; gap:10px; margin-bottom:9px }
.rlk-head span{ font-weight:600; font-size:17px; letter-spacing:-.3px }
.rlk-desc{ color:var(--dim); font-size:14px; line-height:1.45; margin:0 0 16px; letter-spacing:-.2px }
.rlk-box{ display:flex; align-items:center; gap:12px; background:rgba(0,0,0,.30);
  border-radius:14px; padding:11px 14px; margin-bottom:12px; cursor:pointer; transition:.15s }
.rlk-ic{ display:flex; flex-shrink:0 }
.rlk-ic svg{ width:19px; height:19px; stroke:var(--faint); fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; transition:.2s }
.rlk-ic.ok svg{ stroke:#4FE0A0; stroke-width:2.4 }
.rlk-box:active{ transform:scale(.995) }
body.light .rlk-box{ background:rgba(16,24,40,.05) }
.rlk-box .rlk-url{ flex:1; min-width:0; font-size:13.5px; color:var(--text); letter-spacing:-.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.rlk-box > svg{ width:19px; height:19px; stroke:var(--faint); fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }
.rlk-acts{ display:grid; grid-template-columns:1fr 1fr; gap:11px }
.rlk-b{ display:flex; align-items:center; justify-content:center; gap:9px; border:0; border-radius:14px;
  padding:11px 8px; font-size:14.5px; font-weight:500; letter-spacing:-.3px; transition:.15s;
  min-height:38px }
.rlk-b:active{ transform:scale(.995) }
.rlk-b svg{ width:17px; height:17px; fill:none; stroke-width:1.9; stroke-linecap:round;
  stroke-linejoin:round; flex-shrink:0 }
.rlk-b2{ background:rgba(0,0,0,.30); color:var(--text) } .rlk-b2 svg{ stroke:var(--text) }
body.light .rlk-b2{ background:rgba(16,24,40,.06) }
.rlk-b1{ background:#2B39F5; color:#fff } .rlk-b1 svg{ stroke:#fff }

/* ===== Tarix: karta va buyurtma oynasi sayqali ===== */
.order{ border-radius:20px !important; padding:16px 16px 14px !important;
        border:1px solid rgba(255,255,255,.05) !important;
        background:linear-gradient(180deg, rgba(255,255,255,.030), rgba(255,255,255,.010)), var(--card) !important;
        box-shadow:0 6px 18px -14px rgba(0,0,0,.75) !important; margin-bottom:11px !important }
body.light .order{ border-color:rgba(16,24,40,.07) !important;
        background:var(--card) !important; box-shadow:0 6px 18px -14px rgba(0,0,0,.18) !important }
.order .g .ic{ width:44px !important; height:44px !important; border-radius:13px !important }
.order .g .nm{ letter-spacing:-.25px }
.order .price{ letter-spacing:-.35px }
.order .price small{ color:var(--faint) !important; font-weight:500 !important;
        font-size:11.5px !important; margin-left:4px !important }
.order .sep{ margin:13px 0 12px !important; opacity:.7 }
.order .kv{ margin-bottom:9px !important }
.badge-st{ font-size:11.5px !important; padding:5px 11px !important; letter-spacing:-.1px }
.order .date{ font-size:11.5px !important; margin-top:12px !important }

/* --- buyurtma oynasi: Inter shrifti, o'lchovlar muvozanatli --- */
.sheet, .sheet *{ font-family:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif !important;
                  letter-spacing:-.3px !important }
/* Suzuvchi oyna: ekranga yopishmaydi — chap, o'ng va pastdan bo'shliq, hamma burchagi yumaloq */
.sheet{ left:12px !important; right:12px !important;
        bottom:calc(env(safe-area-inset-bottom) + 12px) !important;
        border-radius:32px !important;
        border:1px solid var(--stroke-2) !important;
        padding:18px 20px 20px !important;
        max-height:84vh !important;
        box-shadow:0 18px 50px -20px rgba(0,0,0,.75) !important }
body.light .sheet{ box-shadow:0 18px 50px -20px rgba(0,0,0,.28) !important }
/* o'rtadagi chiziqcha olib tashlandi */
.sheet .grab{ display:none !important }
/* orqa fon xiralashmaydi — tiniq qoladi (bosilganda yopilish ishlayveradi) */
.sheet-bg{ background:transparent !important; backdrop-filter:none !important;
           -webkit-backdrop-filter:none !important }
body.light .sheet-bg{ background:transparent !important }
.sheet .sh-top{ margin-bottom:16px !important }
.sheet .sh-ic{ width:37px !important; height:37px !important; border-radius:11px !important; font-size:17px !important }
.sheet .sh-nm{ font-size:18px !important; font-weight:500 !important }
.sheet .sh-sub{ font-size:13.5px !important; margin-top:3px !important; font-weight:400 !important }
/* holat belgisi: kapsula, shaffof fon, nozik chegara, keng ichki bo'shliq */
.sheet .sh-top .badge-st{ font-size:11.5px !important; font-weight:500 !important;
        padding:4px 11px !important; border-radius:999px !important;
        border:1px solid transparent !important; line-height:1.15 !important;
        text-align:center !important; letter-spacing:-.2px !important }
.order .badge-st{ font-size:11.5px !important; font-weight:500 !important;
        padding:4px 11px !important; line-height:1.15 !important; border-radius:999px !important;
        border:1px solid transparent !important; letter-spacing:-.2px !important }
.badge-st.done{ color:#4FE0A0 !important; background:rgba(79,224,160,.11) !important;
        border-color:rgba(79,224,160,.30) !important }
.badge-st.wait{ color:#F0A93C !important; background:rgba(240,169,60,.11) !important;
        border-color:rgba(240,169,60,.28) !important }
body.light .badge-st.done{ color:#0f8a58 !important; background:rgba(15,138,88,.10) !important;
        border-color:rgba(15,138,88,.28) !important }
body.light .badge-st.wait{ color:#a86a12 !important; background:rgba(200,140,40,.10) !important;
        border-color:rgba(200,140,40,.28) !important }
.sheet .sh-box{ margin-bottom:15px !important }
.sheet .sh-row{ padding:15px 16px !important; font-size:14.5px !important }
.sheet .sh-row .k{ font-weight:400 !important }
.sheet .sh-row .v{ font-weight:500 !important; font-size:14.5px !important }
.sheet .sh-close{ padding:12px !important; font-size:15px !important; font-weight:600 !important;
        line-height:1.2 !important }

                  letter-spacing:-.3px !important }

.order .price{ font-size:16px !important; font-weight:600 !important }
.order .price small{ font-size:12px !important; font-weight:400 !important }

.sheet .grab{ width:36px !important; height:5px !important; margin-bottom:16px !important;

body.light .sheet .grab{ background:rgba(16,24,40,.18) !important }
.sheet .sh-ic{ border-radius:11px !important }
.sheet .sh-box{ border-radius:18px !important; background:rgba(255,255,255,.035) !important }
body.light .sheet .sh-box{ background:rgba(16,24,40,.04) !important }

        border-color:rgba(16,24,40,.10) !important }

/* === Pastki panel: ixcham kapsula (chap va o'ng tomondan joy ochiladi) ===
   --nav-w        : kapsulaning eni. Kichraytirsang chap/o'ng bo'shliq kattayadi.
   --nav-pill-grow: ko'k kapsula tugmadan har tomonga necha px kengroq turishi. */
:root{
  --nav-w:68%;
  --nav-pill-grow:5px;
}
.nav{ justify-content:center }
.nav-inner{ flex:0 0 auto; width:var(--nav-w); max-width:100% }
.nav-item{ white-space:nowrap }
.nav-pill, .nav-goo i{ margin-left:calc((var(--nav-pill-grow) + 1px) * -1) }

/* === NFT tugmasi (panel tepasida) va NFT bo'limi navigatsiyasi === */
:root{ --nav-h:110px; --nav-top:30px }
.nav{ flex-direction:column; gap:8px }
.nav-nft{ display:flex; align-items:center; justify-content:center; gap:9px; flex:0 0 auto;
  height:var(--nav-top); padding:0 18px; border-radius:999px;
  background:rgba(15,22,38,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--stroke); color:var(--faint);
  font-size:11.5px; font-weight:600; letter-spacing:1px; transition:.16s }
.nav-nft .ln{ display:flex; flex-direction:column; gap:2.5px }
.nav-nft .ln i{ display:block; width:14px; height:1.6px; border-radius:2px; background:currentColor }
.nav-nft.on{ color:#fff; border-color:rgba(124,140,255,.55); background:rgba(59,77,240,.30) }
.nav-nft:active{ transform:scale(.988) }
body.light .nav-nft{ background:rgba(255,255,255,.92) }

.nav-item .lb{ display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.nav-item[data-grp="nft"]{ display:none }
body.nft-mode .nav-item[data-grp="main"]{ display:none }
body.nft-mode .nav-item[data-grp="nft"]{ display:flex }
body.nft-mode .nav-item{ font-size:9px }
/* NFT bo'limi ichida tepadagi NFT tugmasi kerak emas — qaytish uchun
   pastda "Bosh sahifa" turibdi. Panel balandligi ham qisqaradi. */
body.nft-mode{ --nav-h:74px }
body.nft-mode .nav-nft{ display:none }

/* === Sovg'alarim === */
.mg-bal{ display:flex; align-items:center; justify-content:flex-end; gap:7px; margin:0 0 7px }
.mg-bal .chip small{ font-size:10.5px; font-weight:600; color:var(--faint); margin-left:4px }
.mg-bal .chip{ display:inline-flex; align-items:center; height:30px; padding:0 12px; border-radius:999px;
  background:var(--card-2); border:1px solid var(--stroke-2); color:var(--text);
  font-size:12.5px; font-weight:600; letter-spacing:-.2px; white-space:nowrap }
/* Chap tarafdagi profil tugmasi */
.mg-bal .mg-pf{ margin-right:auto; width:32px; height:32px; border-radius:50%; overflow:hidden;
  flex-shrink:0; background:var(--card-2); border:1px solid var(--stroke-2);
  display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--text);
  transition:.14s }
.mg-bal .mg-pf img{ width:100%; height:100%; object-fit:cover; display:block }

.nav-row{ display:flex; align-items:center; justify-content:center; gap:10px; width:100% }

/* === Stars / Premium bo'limi === */
.sp-seg{ display:flex; position:relative; background:var(--card-2);
  border:1px solid var(--stroke-2); border-radius:999px; padding:3px; margin-bottom:2px }
/* Oq kapsula alohida qatlam — u sirg'alib o'tadi, tugmalar joyida turadi */
.sp-seg:before{ content:''; position:absolute; top:3px; left:3px;
  width:calc(50% - 3px); height:calc(100% - 6px); border-radius:999px; background:#fff;
  transition:transform .38s cubic-bezier(.34,.68,.16,1); z-index:0 }
body.light .sp-seg:before{ background:#0F1626 }
.sp-seg.r:before{ transform:translateX(100%) }
.sp-seg button{ flex:1; position:relative; z-index:1; height:33px; border-radius:999px;
  font-size:13px; font-weight:600; color:var(--faint); background:transparent;
  transition:color .38s cubic-bezier(.34,.68,.16,1) }
.sp-seg button.on{ color:#0F1626 }
body.light .sp-seg button.on{ color:#fff }
/* Uzun rasmning qaysi qismi ko'rinishi --sp-y bilan boshqariladi.
   0% = rasmning tepasi, 50% = o'rtasi, 100% = pasti.
   Belgi juda tepada qolsa raqamni kichraytiring, pastda qolsa kattalashtiring. */
:root{ --sp-y:19% }
/* Tepa burchaklari yumaloqlangan — aks holda rasm yopishtirilgandek ko'rinadi.
   Yon boshlari va pasti tegilmaydi. */
.sp-hero{ position:relative; margin:0 -14px 0; height:clamp(230px, 36vh, 320px);
  overflow:hidden; border-radius:22px 22px 0 0 }
.sp-hero img{ width:100%; height:100%; object-fit:cover; object-position:center var(--sp-y); display:block }
/* Faqat pastki chekka fonga singiydi. Yon boshlari va tepasi tegilmaydi —
   ortiqcha eritilsa rasm o'chirilgandek ko'rinadi. */
.sp-hero:after{ content:''; position:absolute; left:0; right:0; bottom:0; height:38%;
  pointer-events:none;
  background:linear-gradient(180deg, var(--bg-t), var(--bg)) }
.sp-card{ position:relative; z-index:1; margin-top:-86px;
  background:var(--card); border:1px solid var(--stroke); border-radius:20px; padding:14px }
.sp-card h3{ font-size:17px; font-weight:700; letter-spacing:-.4px; color:var(--text);
  text-align:center; margin:0 0 3px; text-shadow:0 1px 12px rgba(0,0,0,.55) }
body.light .sp-card h3{ text-shadow:none }
/* Quyidagilar faqat Stars/Premium kartochkasi ichida kichraytiriladi —
   ot-in, gr-quick va gr-go boshqa ekranlarda ham ishlatiladi, ularga tegilmaydi. */
.sp-card .ot-in{ height:42px; margin-bottom:9px; border-radius:13px }
.sp-card .ot-in input{ font-size:14px }
.sp-card .ot-in .act{ font-size:13px }
.sp-card .gr-quick{ gap:6px; margin-bottom:11px }
.sp-card .gr-quick button{ height:34px; padding:0 12px; font-size:13px; border-radius:11px }
.sp-card .gr-go{ height:44px; font-size:14.5px; border-radius:14px }
.sp-card .sub{ font-size:12.5px; color:var(--dim); text-align:center; margin:0 0 12px;
  text-shadow:0 1px 10px rgba(0,0,0,.5) }
body.light .sp-card .sub{ text-shadow:none; color:var(--faint) }
.sp-pay{ display:flex; gap:8px; margin-bottom:10px }
.sp-pay button{ flex:1; display:flex; align-items:center; gap:7px; padding:8px 10px;
  border-radius:12px; background:var(--card-2); border:1px solid var(--stroke-2);
  color:var(--text); font-size:13px; font-weight:600; transition:.14s }
.sp-rd{ width:16px; height:16px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--stroke-2); display:grid; place-items:center; transition:.14s }
.sp-rd i{ width:7px; height:7px; border-radius:50%; background:var(--blue); opacity:0; transition:.14s }
.on > .sp-rd, .on .sp-rd{ border-color:var(--blue) }
.on > .sp-rd i, .on .sp-rd i{ opacity:1 }
.sp-err{ color:#FF6B6B; font-size:12.5px; margin:-6px 4px 11px; line-height:1.4 }
.sp-prem{ display:flex; gap:7px; margin-bottom:11px }
.sp-prem button{ flex:1; min-width:0; padding:9px 8px; border-radius:13px; text-align:left;
  background:var(--card-2); border:1px solid var(--stroke-2); transition:.14s }
.sp-prem button.on{ border-color:var(--blue); background:var(--blue-soft) }
.sp-prem .m{ font-size:12.5px; font-weight:600; color:var(--text); margin-top:6px; white-space:nowrap }
.sp-prem .p{ font-size:12.5px; color:#7C8CFF; margin-top:3px; white-space:nowrap }

/* === Market filtrlari === */
.sheet-bg.dim{ background:rgba(0,0,0,.72) !important;
  backdrop-filter:blur(14px) !important; -webkit-backdrop-filter:blur(14px) !important }
.sheet.fs{ height:86vh; max-height:86vh; display:flex; flex-direction:column; overflow:hidden }
.sheet.fs .fs-list{ flex:1; max-height:none }
.sheet.fs .fs-btns{ flex-shrink:0 }
.fs-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:13px }
.fs-head h3{ font-size:24px; font-weight:700; letter-spacing:-.7px; color:var(--text); margin:0 }
.fs-head .x{ width:38px; height:38px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
  background:var(--card-2); color:var(--dim); font-size:15px }
.fs-sort{ display:flex; align-items:center; justify-content:space-between; gap:12px;

.fs-list{ max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -4px }
.fs-list::-webkit-scrollbar{ display:none }
.fs-it{ display:flex; align-items:center; gap:12px; width:100%; padding:9px 4px; text-align:left }
.fs-it .box{ width:22px; height:22px; border-radius:50%; flex-shrink:0;

.fs-it.on .box{ background:var(--blue); border-color:var(--blue) }
.fs-it .box svg{ width:12px; height:12px; stroke:#fff; fill:none; stroke-width:3;
  stroke-linecap:round; stroke-linejoin:round; opacity:0 }

.fs-it .pic{ width:44px; height:44px; border-radius:12px; flex-shrink:0; overflow:hidden;
  display:grid; place-items:center; background:var(--card-2); font-size:20px; position:relative }
.fs-it .pic img{ width:100%; height:100%; object-fit:cover }
.fs-it .pic .dot{ width:26px; height:26px; border-radius:50% }
.fs-it .tx{ flex:1; min-width:0 }
.fs-it .tx .n{ font-size:15px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.fs-it .tx .s{ font-size:12px; color:var(--faint); margin-top:2px }
.fs-it .pr{ text-align:right; flex-shrink:0 }
.fs-it .pr .a{ font-size:15px; font-weight:700; color:var(--text); white-space:nowrap }
.fs-it .pr .b{ font-size:11.5px; color:var(--faint); margin-top:2px; white-space:nowrap }
.fs-btns{ display:flex; gap:9px; margin-top:14px }
.fs-btns button{ flex:1; height:48px; border-radius:999px; font-size:15px; font-weight:600; transition:.14s }
.fs-btns .re{ background:var(--card-2); color:var(--dim) }
.fs-btns .ap{ background:var(--blue); color:#fff }
.fs-btns button:disabled{ opacity:.45 }
.fs-btns button:active{ transform:scale(.993) }
.nftm-fil button .cnt{ min-width:19px; height:19px; padding:0 5px; border-radius:999px;
  background:var(--blue); color:#fff; font-size:11px; font-weight:700;
  display:grid; place-items:center; margin-left:1px }

.nftm-rb.on{ background:#fff; border-color:#fff; color:#0F1626 }
.mkt-range{ display:flex; align-items:center; gap:10px; padding:5px 12px; margin-bottom:8px;
  background:var(--card-2); border:1px solid var(--stroke-2); border-radius:13px }
/* surgichning o'zi baland (barmoq bilan ushlash oson), chizig'i esa ingichka */
.mkt-range input{ flex:1; min-width:0; -webkit-appearance:none; appearance:none; height:30px;
  background:transparent; outline:none; margin:0 }
.mkt-range input::-webkit-slider-runnable-track{ height:4px; border-radius:99px; background:var(--stroke-2) }
.mkt-range input::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; margin-top:-9px;
  border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4) }
.mkt-range .v{ text-align:right; flex-shrink:0; border-left:1px solid var(--stroke-2); padding-left:10px }
.mkt-range .v .a{ font-size:14px; font-weight:700; color:var(--text); white-space:nowrap }
.mkt-range .v .b{ font-size:11px; color:var(--faint); margin-top:0; white-space:nowrap }

/* ro'yxat ko'rinishi */
.nftm-grid.list{ display:block }
.nftm-grid.list .nftm-card{ display:flex; align-items:center; gap:12px; padding:9px 11px; margin-bottom:9px }
.nftm-grid.list .nftm-pic{ width:52px; height:52px; flex:0 0 52px; aspect-ratio:auto; border-radius:13px }
.nftm-grid.list .nftm-pic .gl{ font-size:24px }
.nftm-grid.list .nftm-badges{ display:none }
.nftm-grid.list .tx{ flex:1; min-width:0 }
.nftm-grid.list .nm{ margin:0 }
.nftm-grid.list .no{ margin:1px 0 0 }
.nftm-grid.list .nftm-buy{ flex-shrink:0 }
.nftm-grid.list .nftm-buy .pr{ min-width:74px; flex:0 0 auto; padding:0 12px }

/* === Yechib olish ekranlari === */
.ot-in{ display:flex; align-items:center; gap:9px; padding:0 6px 0 14px; height:48px; margin-bottom:12px;
  background:var(--card-2); border:1px solid var(--stroke-2); border-radius:15px }
.ot-in input{ flex:1; min-width:0; background:transparent; border:0; outline:none; padding:0;
  color:var(--text); font-size:14.5px; font-family:inherit }
.ot-in input::placeholder{ color:var(--faint) }
.ot-in:has(input.err){ border-color:#FF6B6B }
.ot-in .act{ padding:0 10px; height:34px; border-radius:10px; background:transparent;
  color:#7C8CFF; font-size:13.5px; font-weight:600; flex-shrink:0 }
.ot-in .qr{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex-shrink:0 }
.ot-in .qr svg{ width:19px; height:19px; stroke:#7C8CFF; fill:none; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round }
.ot-row{ display:flex; gap:10px }
.ot-row .ot-in{ flex:1 }
.ot-hint{ font-size:12.5px; color:var(--faint); margin:-4px 4px 14px }

.st-to{ display:flex; align-items:center; gap:11px; padding:11px 13px;
  border-bottom:1px solid var(--stroke) }
.st-to .av{ width:34px; height:34px; border-radius:50%; overflow:hidden; position:relative;
  display:grid; place-items:center; background:var(--blue-grad); color:#fff;
  font-size:14px; font-weight:700; flex-shrink:0 }
.st-to .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.st-to .nm{ flex:1; min-width:0; font-size:15px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.st-to .x{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  background:var(--card-2); color:var(--faint); font-size:12px; flex-shrink:0 }
.st-amt{ display:flex; align-items:center; gap:11px; padding:13px }
.st-amt .ic{ font-size:20px }
.st-amt input{ flex:1; min-width:0; background:transparent; border:0; outline:none; padding:0;
  color:var(--text); font-size:16px; font-weight:600; font-family:inherit }
.st-amt input::placeholder{ color:var(--faint); font-weight:500 }
.st-box{ background:var(--card); border:1px solid var(--stroke); border-radius:18px; overflow:hidden }
.st-bal{ font-size:12.5px; color:var(--faint); margin:9px 4px 14px }

/* === GRAM to'ldirish ekrani === */
/* Raqam va tugmalar uchun tizim shrifti — iPhone'da SF Pro, Android'da Roboto.
   Ikkalasida ham tabiiy va tiniq chiqadi. */
:root{ --sys:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif }
.gr-card{ background:var(--card); border:1px solid var(--stroke); border-radius:20px;
  padding:15px 14px 14px; text-align:center }
.gr-card .lb{ font-size:12px; color:var(--faint); font-family:var(--sys); letter-spacing:.1px }
.gr-wal{ display:inline-flex; align-items:center; gap:7px; height:31px; padding:0 13px; margin-top:7px;
  border-radius:999px; background:var(--card-2); border:1px solid var(--stroke-2);
  color:var(--text); font-size:12.5px; font-weight:500; font-family:var(--sys); transition:.14s }
.gr-wal svg{ width:16px; height:16px; stroke:#5B8CFF; fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round }
.gr-wal:active{ transform:scale(.992) }
.gr-amt{ display:flex; align-items:baseline; justify-content:center; gap:8px; margin:18px 0 15px }
.gr-amt input{ background:transparent; border:0; outline:none; padding:0; min-width:1ch;
  color:var(--text); font-size:38px; font-weight:700; letter-spacing:-1.2px;
  font-family:var(--sys); text-align:right }

.gr-quick{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin-bottom:12px }
.gr-quick.scroll{ flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto;

.gr-quick.scroll::-webkit-scrollbar{ display:none }
.gr-quick.scroll button{ flex:0 0 auto }
.gr-quick button{ display:flex; align-items:center; gap:6px; height:33px; padding:0 12px;
  font-family:var(--sys); font-size:13px;
  border-radius:999px; background:var(--card-2); border:1px solid var(--stroke-2);
  color:var(--text); font-size:13.5px; font-weight:600; transition:.14s }
.gr-quick button .d{ width:18px; height:18px; border-radius:50%; background:var(--blue);
  display:grid; place-items:center; flex-shrink:0 }
.gr-quick button .d svg{ width:9px; height:9px; fill:#fff; stroke:none }
.gr-quick button:active{ transform:scale(.991) }
.gr-go{ width:100%; height:44px; border-radius:14px; background:var(--blue); color:#fff;
  font-size:14.5px; font-weight:600; font-family:var(--sys); letter-spacing:.1px; transition:.14s }
.gr-go:disabled{ opacity:.42 }
.gr-go:active{ transform:scale(.994) }

/* === Hamyon ekrani (balans tugmasi bosilganda) === */
.wl-top{ display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px; margin-bottom:10px;
  background:var(--card); border:1px solid var(--stroke); border-radius:16px;
  color:var(--text); font-size:13.5px; font-weight:500; text-align:left; transition:.14s }

.wl-card{ background:var(--blue-grad); border-radius:20px; padding:16px; margin-bottom:12px; color:#fff }

.wl-card .amt{ font-size:29px; font-weight:700; letter-spacing:-1px; line-height:1.15; margin-top:3px }
.wl-card .amt small{ font-size:14px; font-weight:600; opacity:.7; margin-left:5px }
.wl-card .sub{ font-size:13px; opacity:.78; margin-top:2px }
.wl-card .btns{ display:flex; gap:9px; margin-top:14px }
.wl-card .btns button{ flex:1; height:42px; border-radius:999px; font-size:14px; font-weight:600;

.wl-card .btns button svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round }
.wl-card .b1{ background:#fff; color:#0F1626 }
.wl-card .b2{ background:rgba(255,255,255,.22); color:#fff }

/* === NFT Market === */
.mkt-ban{ margin:0 0 12px }
.mkt-ban .rail{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain }
.mkt-ban .rail::-webkit-scrollbar{ display:none }
.mkt-ban img{ flex:0 0 100%; width:100%; aspect-ratio:36/13; object-fit:cover;

.nftm-top{ display:flex; align-items:center; gap:8px; margin-bottom:9px }
.nftm-search{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; height:37px; padding:0 13px;
  background:var(--card-2); border:1px solid var(--stroke-2); border-radius:999px }
.nftm-search > svg{ width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:2;
  stroke-linecap:round; flex-shrink:0 }
.nftm-search input{ flex:1; min-width:0; background:transparent; border:0; outline:none; padding:0;

.nftm-search input::placeholder{ color:var(--faint) }
.nftm-rb{ width:37px; height:37px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
  background:var(--card-2); border:1px solid var(--stroke-2); color:var(--dim); transition:.14s }
.nftm-rb svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round }
.nftm-rb:active{ transform:scale(.92) }

.nftm-fil{ display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding:1px 0 2px; margin-bottom:11px; scrollbar-width:none }
.nftm-fil::-webkit-scrollbar{ display:none }
.nftm-fil button{ flex:0 0 auto; display:flex; align-items:center; gap:6px; height:33px; padding:0 14px;
  border-radius:999px; background:var(--card-2); border:1px solid var(--stroke-2);

  stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }

/* ---- NFT bo'limiga o'tish pardasi ---- */
.dr-wrap{ position:fixed; inset:0; z-index:400; pointer-events:none }
.dr-wrap .dr{ position:absolute; left:0; right:0; height:52%;
  transition:transform .9s cubic-bezier(.34,.7,.18,1) }
/* Ranglar ilovaning ko'kidan boshqa — quyuq tunji va oltin chiziq */
/* Chetlari yupqa qora, o'rtaga borgan sari sariq kuchayadi */
.dr-wrap .dr.t{ top:0; transform:translateY(-101%);
  background:linear-gradient(180deg, #121219 0%, #1C1C23 7%, #4E4F54 27%, #8E8E90 54%, #C2C1BF 73%, #DAD8D4 85%, #E8E6E2 95%);
  box-shadow:0 10px 30px -8px rgba(228,230,238,.5) }
.dr-wrap .dr.b{ bottom:0; transform:translateY(101%);
  background:linear-gradient(0deg, #121219 0%, #1C1C23 7%, #4E4F54 27%, #8E8E90 54%, #C2C1BF 73%, #DAD8D4 85%, #E8E6E2 95%);
  box-shadow:0 -10px 30px -8px rgba(228,230,238,.5) }
/* Tutashgan joyda ingichka yorug' chiziq */
.dr-wrap .dr.t:after, .dr-wrap .dr.b:after{ content:''; position:absolute; left:0; right:0;
  height:2px; background:linear-gradient(90deg, #EDEBE7, #F5F4F1 22%, #FFFFFF 50%, #F5F4F1 78%, #EDEBE7);
  opacity:0; transition:opacity .2s .28s }
.dr-wrap .dr.t:after{ bottom:0 }
.dr-wrap .dr.b:after{ top:0 }
.dr-wrap.shut .dr.t, .dr-wrap.shut .dr.b{ transform:translateY(0) }
.dr-wrap.shut .dr.t:after, .dr-wrap.shut .dr.b:after{ opacity:1 }
body.light .dr-wrap .dr.t{ background:linear-gradient(180deg, #121219 0%, #1C1C23 7%, #4E4F54 27%, #8E8E90 54%, #C2C1BF 73%, #DAD8D4 85%, #E8E6E2 95%) }
body.light .dr-wrap .dr.b{ background:linear-gradient(0deg, #121219 0%, #1C1C23 7%, #4E4F54 27%, #8E8E90 54%, #C2C1BF 73%, #DAD8D4 85%, #E8E6E2 95%) }

/* ---- Parda ortidagi sahna ---- */
.dr-stage{ position:absolute; inset:0; opacity:0; transition:opacity .25s;
  pointer-events:none }
.dr-wrap.act .dr-stage{ opacity:1; pointer-events:auto }

/* ---- O'rtadagi logotip ----
   Rasm butunligicha jonlantiriladi: kichkinadan chiqib, yengil aylanib
   joyiga tushadi, yuzasidan yorug'lik o'tadi. Rasm topilmasa olmos qoladi. */
.dr-logo{ position:absolute; left:50%; top:50%; width:104px; height:104px;
  margin:-52px 0 0 -52px; border-radius:26px; overflow:hidden; z-index:5;
  opacity:0; transform:scale(.35) rotate(-14deg);
  box-shadow:0 14px 40px -10px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07) }
.dr-logo img{ width:100%; height:100%; object-fit:cover; display:block }
.dr-logo.off{ display:none }
.dr-wrap.act .dr-logo{ animation:logoIn .78s cubic-bezier(.2,1.5,.4,1) .1s forwards }
@keyframes logoIn{
  0%   { opacity:0; transform:scale(.35) rotate(-14deg) }
  55%  { opacity:1; transform:scale(1.12) rotate(4deg) }
  100% { opacity:1; transform:scale(1) rotate(0) }
}
/* Yuzasidan o'tadigan yorug'lik */
.dr-logo .gl{ position:absolute; top:-30%; left:-60%; width:42%; height:160%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  transform:rotate(18deg); opacity:0 }
.dr-wrap.act .dr-logo .gl{ animation:logoGl .8s ease-out .95s forwards }
@keyframes logoGl{
  0%  { opacity:0; left:-60% }
  20% { opacity:1 }
  100%{ opacity:0; left:130% }
}
/* Logotip bo'lsa olmos yashirinadi */

/* Tarqaladigan to'lqinlar */
.dr-core .rg{ position:absolute; left:50%; top:50%; width:118px; height:118px;
  margin:-59px 0 0 -59px; border-radius:50%; opacity:0;
  border:1.5px solid rgba(72,76,88,.42) }
.dr-wrap.act .dr-core .rg{ animation:ripple 1.25s cubic-bezier(.2,.7,.3,1) forwards }
.dr-wrap.act .dr-core .r1{ animation-delay:.60s }
.dr-wrap.act .dr-core .r2{ animation-delay:.74s }
.dr-wrap.act .dr-core .r3{ animation-delay:.88s }
@keyframes ripple{
  0%  { opacity:.75; transform:scale(.55) }
  100%{ opacity:0;   transform:scale(2.5) }
}
/* Uchqunlar */
.dr-core .sp{ position:absolute; left:50%; top:50%; width:5px; height:5px;
  margin:-2.5px 0 0 -2.5px; border-radius:50%; background:#FFFFFF; opacity:0;
  box-shadow:0 0 10px rgba(58,62,76,.9) }
.dr-wrap.act .dr-core .sp{ animation:spark .9s ease-out .68s forwards }
.dr-core .s1{ --x: 62px;  --y:-46px }
.dr-core .s2{ --x:-58px;  --y:-52px }
.dr-core .s3{ --x: 70px;  --y: 40px }
.dr-core .s4{ --x:-66px;  --y: 44px }
.dr-core .s5{ --x:  4px;  --y:-76px }
.dr-core .s6{ --x: -8px;  --y: 78px }
@keyframes spark{
  0%  { opacity:0; transform:translate(0,0) scale(.4) }
  22% { opacity:1; transform:translate(calc(var(--x)*.4), calc(var(--y)*.4)) scale(1.1) }
  100%{ opacity:0; transform:translate(var(--x), var(--y)) scale(.3) }
}
@media (prefers-reduced-motion: reduce){ .dr-core{ display:none } }

/* ---- "Sovg'alarni qanday qo'shish?" varag'i ---- */
/* Bu varaq umumiy qoidalardan chetda: o'z shrifti, o'z o'lchovlari.
   Yon bo'shliq tirnoqdek, pastga esa yopishadi. */
.hw-sh, .hw-sh *{ font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display",
                  sans-serif !important; letter-spacing:-.2px !important }
/* Ichki bo'shliq nolga tushdi — rasm chetgacha borsin.
   Qolgan tarkib o'z bo'shlig'ini .hw-pad dan oladi. */
/* Balandlik JS orqali beriladi: dvh Telegram oynasida ko'rinadigan
   haqiqiy joyni bilmaydi va varaq ekrandan baland bo'lib qolardi —
   o'shanda pastki qismi ekran ostiga tushib ketardi. */
.hw-sh{ text-align:left; height:88dvh; display:flex; flex-direction:column;
  left:4px !important; right:4px !important; bottom:0 !important;
  border-radius:26px 26px 0 0 !important; overflow:hidden;
  padding:0 0 calc(env(safe-area-inset-bottom) + 10px) !important }
/* Hamma narsa bir qarashda sig'sin — pastga surib qidirishga hojat qolmasin */
.hw-sh.drag{ transition:none !important }
/* Xabar (toast) varaq ostida qolib ketmasin */
body.sheet-lock .toast{ z-index:250 !important }
/* Varaq ochiq turganda orqadagi sahifa qimirlamaydi */
body.sheet-lock{ overflow:hidden; touch-action:none }
.hw-sh .hw-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch }
.hw-sh .hw-pad{ padding:0 12px }
.hw-sh .hw-foot{ padding-top:8px; flex-shrink:0 }
/* Rasm: chetdan chetga, o'z nisbatida, kesilmaydi */
.hw-sh .hw-img{ margin:0 0 12px; line-height:0; background:transparent }
.hw-sh .hw-img img{ width:100%; height:auto; display:block; border-radius:18px 18px 20px 20px }
/* Tutqich — barmoq bilan pastga surib yopish uchun */
/* Tutqich ixcham, rasm esa unga yaqin turadi. Varaq burchagida
   qirqilmasligi uchun rasmning o'z tepa burchaklari yumaloqlangan. */
.hw-sh .hw-grab{ padding:9px 0 7px; display:grid; place-items:center;
  flex-shrink:0; touch-action:none }
.hw-sh .hw-grab span{ width:40px; height:4px; border-radius:99px;
  background:var(--stroke-2); display:block }
.hw-sh .hw-box .s b{ color:var(--blue); font-weight:600; cursor:pointer }
.hw-sh .hw-box .s b:active{ opacity:.6 }
/* Kattaroq kutilar, tizim shrifti — iPhone'da SF Pro, Android'da Roboto */
/* Ikonka chapda, tepa qismida — o'rtada emas */
.hw-sh .hw-box{ padding:12px 15px; border-radius:17px; margin-bottom:8px;
  background:var(--card-2); border:1px solid var(--stroke-2);
  display:flex; align-items:flex-start; gap:11px }
.hw-sh .hw-box .bd{ flex:1; min-width:0 }
.hw-sh .hw-box .ic{ flex-shrink:0; width:22px; height:22px; margin-top:1px;
  display:block; line-height:0 }
.hw-sh .hw-box .ic svg{ width:100%; height:100% }
.hw-sh .hw-box .ic.tg{ color:#3FA0EA }
.hw-sh .hw-box .ic.gf{ color:#F5B301 }
.hw-sh .hw-box .ic.ok{ color:#4FE0A0 }
.hw-sh .hw-box .ic.wn{ width:20px; height:20px }
.hw-sh .hw-box.warn{ background:rgba(245,179,1,.07); border-color:rgba(245,179,1,.24) }
.hw-sh .hw-box .t{ font-size:15.5px; font-weight:600; color:var(--text); line-height:1.32;
  font-family:var(--sys); letter-spacing:-.2px }
.hw-sh .hw-box .s{ font-size:13px; color:var(--faint); margin-top:4px; line-height:1.4;

.pw-lock{ position:fixed; inset:0; z-index:400; display:none; place-items:center;

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let tgUser = null;
if(tg){
  tg.ready(); tg.expand();
  /* Biometriyani darrov tayyorlab qo'yamiz. Telegram requestAccess ni faqat
     bosish paytida qabul qiladi — tugma bosilganda init kutib turmasligi kerak. */
  try{
    if(tg.BiometricManager && tg.BiometricManager.init) tg.BiometricManager.init();
    tg.onEvent('biometricManagerUpdated', function(){
      if(typeof view !== 'undefined' && view === 'profile') renderProfile();
    });
  }catch(e){}
  [0,60,200,500,900,1500,2500].forEach(function(ms){ setTimeout(function(){ try{ tg.expand(); }catch(e){} }, ms); });
  /* Pastga surib yopishni to'samiz — ilova faqat tepadagi tugma bilan yopiladi.
     Bu bitta chaqiruv, hech qanday hodisaga ulanmaydi. */
  try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
  /* Hamyon ulanishini kutubxonaning o'zi tiklaydi. Shuning uchun uni ilova
     ochilgach tayyorlab qo'yamiz — aks holda oldin ulangan hamyon ko'rinmaydi
     va har safar qaytadan ulash so'raladi. */
  /* TON Connect og'ir kutubxona. Uni faqat ilgari hamyon ulagan odamda
     oldindan yuklaymiz — qolganlarda tugma bosilgandagina yuklanadi. */
  try{
    let had = false;
    for(let i = 0; i < localStorage.length; i++){
      if(String(localStorage.key(i)).indexOf('ton-connect') === 0){ had = true; break; }
    }
    if(had) setTimeout(function(){ tcLib().then(function(ok){ if(ok) tcInit(); }); }, 1200);
  }catch(e){}
  /* NFT ma'lumotlari bosh sahifada kerak emas — ular NFT bo'limiga
     kirilgandagina yuklanadi. Shunda ilova tezroq ochiladi. */

let RATES = { "so'm": 1, usd: 11500, rubl: 133 };
function payAmount(base, pay, cur){
  const r = RATES[cur] || 1;
  if(r === 1) return { txt: fmt(pay), raw: String(pay) };
  const step = Math.round((pay - base) / 100);      /* 1, 2, 3 ... */

  const t = v.toFixed(2);
  return { txt: t, raw: t };
}

const STAR_MIN = 50, STAR_MAX = 10000;
function starRate(n){ return n<=99 ? 250 : n<=249 ? 240 : n<=999 ? 230 : 220; }
function starPrice(n){ return n * starRate(n); }
/* balansga qancha yulduz sig'adi (bosqichlar tufayli oddiy bo'lish ishlamaydi) */
function maxStars(bal){
  const T = [[50,99,250],[100,249,240],[250,999,230],[1000,STAR_MAX,220]];
  let best = 0;
  T.forEach(function(t){
    const n = Math.min(t[1], Math.floor(bal / t[2]));
    if(n >= t[0] && n > best) best = n;
  });
  return best;
}
