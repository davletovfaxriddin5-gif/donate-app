/* --- Pastki panel: suyuq kapsula (blob + quyruq + prujina) --- */
const NAV = (function(){
  const inner=document.querySelector('.nav-inner');
  if(!inner) return { sync:function(){} };
  const goo=inner.querySelector('.nav-goo');
  const blob=inner.querySelector('.nav-blob');
  const tail=inner.querySelector('.nav-tail');
  const pillGrow = function(){ return parseFloat(getComputedStyle(inner).getPropertyValue('--nav-pill-grow')) || 0; };
  const rim=inner.querySelector('.nav-pill');
  function items(){
    const all=[].slice.call(inner.querySelectorAll('.nav-item'));
    const vis=all.filter(function(n){ return n.offsetParent!==null; });
    return vis.length ? vis : all;
  }
  if(!goo||!blob||!tail||!rim||!items().length) return { sync:function(){} };

  let w=0, minX=0, maxX=0, ir=null;
  let x=0, tx=0, v=0, targetX=0;
  let dragging=false, raf=0, startItem=null, target=null, ready=false;
  let pressed=false, moving=false, sx0=0, offs=0;

  function slow(){ return document.body.classList.contains('reduce-motion'); }
  function measure(){
    const host = inner.closest ? inner.closest('.nav') : inner.parentNode;
    if(host && getComputedStyle(host).display==='none') return false;
    ir=inner.getBoundingClientRect(); if(!ir.width) return false;
    const it=items(); if(!it.length) return false;
    const r0=it[0].getBoundingClientRect(), rl=it[it.length-1].getBoundingClientRect();
    if(!r0.width) return false;
    w=r0.width; minX=r0.left-ir.left; maxX=rl.left-ir.left;
    const pw=w+pillGrow()*2;
    blob.style.width=pw+'px'; tail.style.width=pw+'px'; rim.style.width=pw+'px';
    return true;
  }
  function xOf(el){ return el.getBoundingClientRect().left-ir.left; }
  function clamp(px){ return Math.max(minX, Math.min(maxX, px)); }
  function paint(){
    const d=x-tx, st=Math.min(Math.abs(d)/Math.max(w,1), 1);
    const tf='translateX('+x.toFixed(1)+'px) scaleX('+(1+st*0.14).toFixed(3)+') scaleY('+(1-st*0.08).toFixed(3)+')';
    blob.style.transform=tf;
    rim.style.transform=tf;
    rim.style.backgroundPosition=(50-d*1.8).toFixed(1)+'% 0%';
    goo.style.opacity='1'; rim.style.opacity='1';
  }
  function loop(){
    raf=0;
    if(!dragging){
      v+=(targetX-x)*0.17; v*=0.76; x+=v;
      if(Math.abs(v)<0.12 && Math.abs(targetX-x)<0.4){ x=targetX; v=0; }
    }
    tx+=(x-tx)*0.30;
    paint();
    if(!dragging && v===0 && Math.abs(x-tx)<0.4){ tx=x; paint(); return; }
    raf=requestAnimationFrame(loop);
  }
  function kick(){ if(!raf) raf=requestAnimationFrame(loop); }
  function nearest(cx){
    const it=items(); let b=it[0], bd=1e9;
    it.forEach(function(n){ const r=n.getBoundingClientRect(); const dd=Math.abs(r.left+r.width/2-cx); if(dd<bd){ bd=dd; b=n; } });
    return b;
  }
  function mark(el){ if(el===target) return; target=el; haptic(); items().forEach(function(n){ n.classList.toggle('on', n===el); }); }

  function sync(animate){
    if(!measure()) return;
    const on=items().filter(function(n){ return n.classList.contains('on'); })[0]; if(!on) return;
    target=on; targetX=xOf(on);
    if(animate===false || !ready || slow()){ x=targetX; tx=targetX; v=0; ready=true; paint(); return; }
    ready=true; kick();
  }

  inner.addEventListener('touchstart', function(e){
    if(!measure()) return;
    const t=e.touches[0];
    pressed=true; moving=false; dragging=false; sx0=t.clientX;
    startItem=nearest(t.clientX); target=null; mark(startItem);
    targetX=xOf(startItem); v=0; kick();
  }, {passive:true});

  inner.addEventListener('touchmove', function(e){
    if(!pressed) return;
    const t=e.touches[0];
    if(!moving){
      if(Math.abs(t.clientX-sx0) < 8) return;
      moving=true; dragging=true;
      offs = x - (t.clientX-ir.left-w/2);
    }
    x=clamp(t.clientX-ir.left-w/2+offs);
    mark(nearest(x+ir.left+w/2));
    kick();
    if(e.cancelable) e.preventDefault();
  }, {passive:false});

  function end(){
    if(!pressed) return;
    pressed=false;
    const wasDrag=moving;
    moving=false; dragging=false;
    if(target) targetX=xOf(target);
    v=0; kick();
    if(wasDrag && target && target!==startItem){
      navDragged=true;
      const _t = target.dataset.tab;

function liquidFx(host){
  if(!host || host._fx) return;
  const btns=[].slice.call(host.querySelectorAll('button'));
  if(btns.length<2) return;
  host.classList.add('fx-host');
  [].slice.call(host.querySelectorAll('.fx-goo, .fx-rim')).forEach(function(n){ n.parentNode.removeChild(n); });
  const goo=document.createElement('span'); goo.className='fx-goo';
  goo.innerHTML='<i class="fx-blob"></i><i class="fx-tail"></i>';
  const rim=document.createElement('span'); rim.className='fx-rim';
  host.insertBefore(rim, host.firstChild);
  host.insertBefore(goo, host.firstChild);
  const blob=goo.firstElementChild, tail=goo.lastElementChild;

  let w=0, minX=0, maxX=0, ir=null;
  let x=0, tx=0, v=0, targetX=0;
  let dragging=false, raf=0, origin=null, target=null, ready=false;
  let pressed=false, moving=false, sx0=0, offs=0;

  function slow(){ return document.body.classList.contains('reduce-motion'); }
  function measure(){
    if(!host.offsetWidth) return false;
    ir=host.getBoundingClientRect();
    const r0=btns[0].getBoundingClientRect(), rl=btns[btns.length-1].getBoundingClientRect();
    if(!r0.width) return false;
    w=r0.width; minX=r0.left-ir.left; maxX=rl.left-ir.left;
    blob.style.width=w+'px'; tail.style.width=w+'px'; rim.style.width=w+'px';
    return true;
  }
  function xOf(el){ return el.getBoundingClientRect().left-ir.left; }
  function clamp(px){ return Math.max(minX, Math.min(maxX, px)); }
  function paint(){
    const d=x-tx, st=Math.min(Math.abs(d)/Math.max(w,1), 1);
    const tf='translateX('+x.toFixed(1)+'px) scaleX('+(1+st*0.22).toFixed(3)+') scaleY('+(1-st*0.12).toFixed(3)+')';
    blob.style.transform=tf;
    rim.style.transform=tf;
    rim.style.backgroundPosition=(50-d*1.8).toFixed(1)+'% 0%';
    goo.style.opacity='1'; rim.style.opacity='1';
  }
  function loop(){
    raf=0;
    if(!dragging){
      v+=(targetX-x)*0.17; v*=0.76; x+=v;
      if(Math.abs(v)<0.12 && Math.abs(targetX-x)<0.4){ x=targetX; v=0; }
    }
    tx+=(x-tx)*0.30;
    paint();
    if(!dragging && v===0 && Math.abs(x-tx)<0.4){ tx=x; paint(); return; }
    raf=requestAnimationFrame(loop);
  }
  function kick(){ if(!raf) raf=requestAnimationFrame(loop); }
  function nearest(cx){
    let b=btns[0], bd=1e9;
    btns.forEach(function(n){ const r=n.getBoundingClientRect(); const dd=Math.abs(r.left+r.width/2-cx); if(dd<bd){ bd=dd; b=n; } });
    return b;
  }
  function mark(el){ if(el===target) return; target=el; haptic(); btns.forEach(function(n){ n.classList.toggle('on', n===el); }); }
  function sync(animate){
    if(!measure()) return;
    const on=host.querySelector('button.on'); if(!on) return;
    target=on; targetX=xOf(on);
    if(animate===false || !ready || slow()){ x=targetX; tx=targetX; v=0; ready=true; paint(); return; }
    ready=true; kick();
  }

  host.addEventListener('touchstart', function(e){
    if(!measure()) return;
    const t=e.touches[0];
    origin=host.querySelector('button.on');
    pressed=true; moving=false; dragging=false; sx0=t.clientX;
    target=null; mark(nearest(t.clientX));
    targetX=xOf(target); v=0; kick();
  }, {passive:true});

  host.addEventListener('touchmove', function(e){
    if(!pressed) return;
    const t=e.touches[0];
    if(!moving){
      if(Math.abs(t.clientX-sx0) < 8) return;
      moving=true; dragging=true;
      offs = x - (t.clientX-ir.left-w/2);
    }
    x=clamp(t.clientX-ir.left-w/2+offs);
    mark(nearest(x+ir.left+w/2));
    kick();
    if(e.cancelable) e.preventDefault();
  }, {passive:false});

  function end(e){
    if(!pressed) return;
    pressed=false; moving=false; dragging=false;
    if(target) targetX=xOf(target);
    v=0; kick();
    if(e && e.cancelable) e.preventDefault();
    if(target && target!==origin){
      const t=target;
      setTimeout(function(){ t.click(); setTimeout(function(){ sync(true); }, 40); }, 320);
    }
  }
  host.addEventListener('touchend', end);
  host.addEventListener('touchcancel', end);

  host._fx={ sync:sync };
  sync(false);
}

    const h=document.querySelector(sel); if(h) liquidFx(h);

  const sum = document.getElementById('starSum');
  if(sum) sum.value = n ? (money(price,true) + (somSub(price)?'  ('+somSub(price)+')':'')) : '—';

  const h = document.getElementById('starHint');
  if(h){
    const mx = maxStars(balance);
    let warn = '';
    if(n && n < STAR_MIN) warn = `<div style="color:var(--gold)">Eng kami ${STAR_MIN} ⭐</div>`;
    else if(n > STAR_MAX) warn = `<div style="color:var(--gold)">Eng ko'pi ${fmt(STAR_MAX)} ⭐</div>`;
    else if(n && price > balance) warn = `<div style="color:var(--gold)">Balans yetarli emas — ${money(balance,false)} bor</div>`;
    h.innerHTML = warn
      + `<div style="color:var(--dim)">1 ⭐ = ${fmt(starRate(n||STAR_MIN))} so'm</div>`
      + (mx >= STAR_MIN
          ? `<div style="color:var(--dim)">Balansga sig'adi: ${fmt(mx)} ⭐ (${fmt(starPrice(mx))} so'm)</div>`
          : `<div style="color:var(--dim)">Eng kichik buyurtma ${STAR_MIN} ⭐ — ${fmt(starPrice(STAR_MIN))} so'm</div>`)
      + `<div style="color:var(--dim)">Ko'proq olsangiz 1 ⭐ arzonlashadi: 100 dan 240, 250 dan 230, 1000 dan 220 so'm</div>`;
  }
  syncBuy();
}

const ID_RULES = {
  pubg:     { playerId:[10,12] },
  freefire: { playerId:[8,12] },
  /* Standoff 2 da tekshiruv yo'q — kamida raqam ekanini talab qilamiz,
     aks holda bitta harf yozib ham sotib olish tugmasi ochilardi.
     Chegara ataylab keng: haqiqiy ID to'silib qolmasin. */
  standoff2:{ playerId:[5,15] },
  mlbb:     { playerId:[6,11], serverId:[3,6] }
};
function badFormat(gameId, key, v){
  if(key === 'riot_id'){
    if(v.indexOf('#') < 1 || v.length < 4)
      return "Name#TAG ko'rinishida yozing (masalan Faxriddin#UZ1)";
    return null;
  }
  if(key === 'username'){
    const u = String(v).replace(/^@+/,'');
    if(!/^[A-Za-z0-9_]{5,32}$/.test(u))
      return "faqat lotin harflari, raqam va _ (5-32 belgi)";
    return null;
  }
  const r = ID_RULES[gameId] && ID_RULES[gameId][key];
  if(!r) return null;
  if(!/^\d+$/.test(v)) return "faqat raqam bo'lishi kerak";
  if(v.length < r[0] || v.length > r[1]) return r[0]+'-'+r[1]+" ta raqam bo'lishi kerak";
  return null;
}

async function checkId(){
  const g = curGame; if(!g) return false;
  const vals = {};
  for(const f of curFields()){
    const el = document.getElementById('fld_'+f.key);
    const v = (el && el.value || '').trim();
    if(!v){ notify('error'); toastErr(f.label+' kiriting'); return false; }
    const bad = badFormat(g.id, f.key, v);
    if(bad){ notify('error'); toastErr(f.label+': '+bad); return false; }
    vals[f.key] = v;
  }

  if(!CHECK_GAMES[g.id]){
    if(vals.username != null){
      /* Username'ni HAQIQATAN tekshiramiz. Ilgari bu yerda hech narsa
         tekshirilmasdi — yozilgan matn shunchaki qaytarib ko'rsatilardi,
         ya'ni xato username ham yashil chiqardi va pul boshqa odamga ketardi. */
      const u = String(vals.username).replace(/^@+/,'');
      const own = !!(tgUser && tgUser.username &&
                     u.toLowerCase() === String(tgUser.username).toLowerCase());
      idOk = false; setRes('wait', 'Tekshirilmoqda\u2026'); syncBuy();
      const d = await fetch(VBASE + '/tg/user?u=' + encodeURIComponent(u))
        .then(function(x){ return x.json(); }).catch(function(){ return null; });

      if(d && d.ok && d.found){
        idOk = true; idName = d.name || u; notify('success');
        afterCheckUser(d.name || u, own);
        return true;
      }
      if(d && (d.why === 'not_user' || d.why === 'is_bot' || d.why === 'none')){
        idOk = false; notify('error');
        setRes('err', d.why === 'not_user' ? 'Bu kanal yoki guruh \u2014 foydalanuvchi emas'
                    : d.why === 'is_bot'   ? 'Bu bot \u2014 yuborib bo\'lmaydi'
                    : 'Bunday foydalanuvchi topilmadi');
        syncBuy();
        return false;
      }
      /* Tekshiruv ishlamadi — to'sib qo'ymaymiz, avvalgidek o'tkazamiz */
      idOk = true; notify('success');
      afterCheckUser(u, own);
      return true;
    }
    idOk = true; notify('success');
    if(g.cats && g.cats.length){
      const c    = activeCat() || {};
      const key  = ((c.fields || [])[0] || {}).key;
      const main = key ? String(vals[key] || '') : (Object.values(vals)[0] || '');
      const sel  = (c.fields || []).filter(function(f){ return f.type === 'select'; })
        .map(function(f){
          const v = String(vals[f.key] || '');
          const o = (f.options || []).find(function(x){ return String(x.value) === v; });
          return o ? o.label : v;
        }).filter(Boolean).join(' \u00b7 ');
      const sub = (c.label ? c.label : '') + (sel ? ' \u00b7 ' + sel : '');

      /* Avval haqiqiy tekshiruvni sinaymiz. FazerCards ko'p o'yinda uni
         qo'llab-quvvatlamaydi \u2014 o'shanda format bo'yicha o'tkazamiz. */
      idOk = false; setRes('wait', 'Tekshirilmoqda\u2026'); syncBuy();
      const r = await fetch(VBASE + '/validate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ cat: c.cat, fields: vals })
      }).then(function(x){ return x.json(); }).catch(function(){ return null; });

      if(r && r.ok && r.valid){
        idOk = true; idName = r.name || ''; notify('success');
        afterCheckId(r.name || main, sub + (r.name ? '' : ''));
        return true;
      }
      if(r && !r.ok && (r.reason === 'invalid' || r.reason === 'unconfirmed' || r.reason === 'bad_id')){
        idOk = false; notify('error');
        setRes('bad', "\u274C Bunday akkaunt topilmadi. ID ni tekshiring.");
        syncBuy(); return false;
      }
      /* Tekshiruv javob bermadi (timeout yoki xato) \u2014 ID ni O'TKAZIB YUBORMAYMIZ.
         Aks holda xato ID bilan xarid qilinib, pul begonaga ketardi. */
      if(r && !r.ok && r.reason !== 'unsupported'){
        idOk = false; notify('error');
        setRes('bad', "\u26A0\uFE0F Hozir tekshirib bo'lmadi. Bir daqiqadan keyin qayta urinib ko'ring.");
        syncBuy(); return false;
      }
      /* Bu o'yinda tekshiruv umuman yo'q \u2014 formatga qarab o'tkazamiz */
      idOk = true; notify('success');
      afterCheckId(main, sub);
    } else {
      setRes('ok', "✅ Format to'g'ri");
      syncBuy();
    }
    return true;
  }

  const btns = [].slice.call(document.querySelectorAll('.check-btn'));
  btns.forEach(function(b){ b.disabled = true; b.dataset.t = b.textContent; b.textContent = '…'; });
  setRes('wait', '⏳ Tekshirilmoqda…');

  try{
    const qs = 'game=' + encodeURIComponent(g.id)
             + '&playerId=' + encodeURIComponent(vals.playerId || '')
             + '&zoneId='   + encodeURIComponent(vals.serverId || '');
    const r = await fetch(VBASE + '/validate?' + qs);
    const j = await r.json();
    if(j && j.ok && j.valid){
      idOk = true; idName = j.name || ''; idRegion = j.region || '';
      notify('success');
      afterCheck();
    } else {
      idOk = false; notify('error');
      const m = {
        invalid:     "❌ Bunday ID topilmadi — raqamni tekshiring",
        bad_id:      "❌ ID formati noto'g'ri",
        bad_zone:    "❌ Server ID noto'g'ri",
        unconfirmed: "⚠️ Tasdiqlab bo'lmadi — qo'llab-quvvatlashga yozing",
        busy:        "⏳ Hozir band — bir daqiqadan keyin urinib ko'ring",
        unsupported: "❌ Bu o'yin tekshirilmaydi"
      };
      setRes('bad', m[j && j.reason] || "❌ Tekshirib bo'lmadi");
    }
  }catch(e){
    idOk = false; notify('error');
    setRes('bad', "⚠️ Aloqa yo'q — qaytadan urinib ko'ring");
  }

  btns.forEach(function(b){ b.disabled = false; if(b.dataset.t) b.textContent = b.dataset.t; });
  syncBuy();
  return idOk;
}
var buyBusy = false;
var buyAuthed = false;
function buy(){
  if(bioOn() && !buyAuthed){
    bioAsk(function(){ buyAuthed = true; buy(); });
    return;
  }
  buyAuthed = false;
  const g=curGame;
  const custom = g && g.custom === 'stars';
  const steam  = g && g.custom === 'steam';
  if(steam){
    const c = stmCfg();
    if(!stmN){ notify('error'); toastErr("Summani kiriting (" + c.min + "\u2013" + c.max + " \u0024)"); return; }
    if(stmPrice(stmN) > balance){ notify('error'); toastErr("\u274C Balans yetarli emas \u2014 " + money(balance,false) + " bor"); return; }
  } else if(custom){
    if(!starN){ notify('error'); toastErr("Yulduzlar sonini kiriting ("+STAR_MIN+"–"+fmt(STAR_MAX)+")"); return; }
    if(starPrice(starN) > balance){ notify('error'); toastErr("❌ Balans yetarli emas — "+money(balance,false)+" bor"); return; }
  } else if(selPkg===null){ notify('error'); toastErr('Paketni tanlang'); return; }
  if(steam && !idOk){ notify('error'); toastErr("Avval loginni tekshiring"); return; }
  if(!idOk && !noIdGame()){ notify('error'); toastErr("Avval ID ni tekshiring"); return; }
  const p = custom ? { a:String(starN), c:'⭐', p:starPrice(starN), oid:'' }
          : steam  ? { a:String(stmN), c:'$', p:stmPrice(stmN), oid:'' }
          : activePkgs()[selPkg];
  const details={};
  for(const f of curFields()){ const v=(document.getElementById('fld_'+f.key)?.value||'').trim();
    if(!v){ notify('error'); toastErr(f.label+' kiriting'); return; } details[f.key]=v; }
  if(Object.keys(details).length) saveId(g.id, Object.values(details).join(' '));
  const order={ id:'MT'+Date.now().toString().slice(-8), game:g.name, gameId:g.id, glyph:g.glyph, img:g.img||'',
    package:(p.a+(p.c&&p.c.length<=2?' '+p.c:'')), price:p.p, details, region:g.region?curRegion:null, nick:idName||'', accRegion:idRegion||'',
    cat: (g.cats && g.cats.length) ? (activeCat()||{}).cat : (g.cat||''), oid:p.oid||'',
    qty: custom ? starN : steam ? stmN : 0,
    tgUser: tgUser?{id:tgUser.id,username:tgUser.username,name:tgUser.first_name}:null,
    status:'wait', createdAt:new Date().toISOString() };
  if(buyBusy) return;
  buyBusy = true;
  const _bb = document.getElementById('buyBtn');
  if(_bb) _bb.disabled = true;
  function buyDone(){ buyBusy = false; syncBuy(); }
  fetch(VBASE + '/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order: order, initData: (tg && tg.initData) || '' })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok){
      if(typeof d.balance === 'number') balance = d.balance;
      saveOrder(order); notify('success');
      toastOk('✅ Buyurtma qabul qilindi');
      buyDone();
      setTimeout(function(){ go('history'); }, 700);
    } else if(d && d.error === 'balance'){
      if(typeof d.balance === 'number') balance = d.balance;
      notify('error');
      toastErr('❌ Balans yetarli emas — ' + fmt(d.balance||0) + " so'm bor");
      buyDone();
    } else {
      notify('error');
      toastErr(
        d && d.error === 'login' ? "❌ Bunday Steam login topilmadi. Loginni tekshiring."
      : d && d.error === 'busy'  ? "⚠️ Yetkazib beruvchi javob bermadi. Bir daqiqadan keyin urinib ko'ring."
      : d && d.error === 'qty'   ? "Summa chegaradan chiqdi" + (d.min ? " (" + d.min + "–" + d.max + " $)" : "")
      : d && d.error === 'rate'  ? "⚠️ Bu mahsulot vaqtincha sotuvda yo'q"
      : d && d.error === 'maint' ? "⚠️ Bu o'yinda texnik ish ketyapti"
      : d && d.error === 'fields'? "Ma'lumotlarni to'liq kiriting"
      : "⚠️ Xato: " + ((d && d.error) || 'yuborilmadi'));
      buyDone();
    }
  }).catch(function(){ notify('error'); toastErr("⚠️ Aloqa yo'q"); buyDone(); });
}

function saveOrder(o){ try{ const a=getOrders(); a.unshift(o); localStorage.setItem('mt_orders', JSON.stringify(a.slice(0,60))); }catch(e){} }
var srvOrders = null, srvTopups = null, histTimer = null, histAt = 0;
function getTopups(){ return srvTopups || []; }
/* Bosh sahifa tarixi. NFT bo'limidan berilgan buyurtmalar bu yerga
   TUSHMAYDI — ular o'z bo'limining tarixida ko'rinadi. */
function getOrders(){
  const all = srvOrders ? srvOrders
            : (function(){ try{ return JSON.parse(localStorage.getItem('mt_orders')||'[]'); }
                           catch(e){ return []; } })();
  return all.filter(function(o){ const p = o && o.pay; return !p || p === 'main'; });
}
/* NFT bo'limidan berilgan buyurtmalar */
function getNftOrders(){
  const all = srvOrders || [];
  return all.filter(function(o){ const p = o && o.pay; return p === 'nftsom' || p === 'gram'; });
}
function loadOrders(cb){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid){ if(cb) cb(); return; }
  fetch(VBASE+"/orders?id="+uid+"&t="+Date.now())
   .then(function(r){ return r.json(); })
   .then(function(d){
     if(d && Array.isArray(d.topups)) srvTopups = d.topups;
     if(d && d.ok && Array.isArray(d.orders)){
       let loc = getOrders(); const map = {};
       d.orders.forEach(function(x){ map[x.id] = x; });
       loc.forEach(function(x){
         const sv = map[x.id];
         if(!sv) return;
         x.status = sv.status;
         if(sv.code) x.code = sv.code;        /* sovg'a kartasining kodi */
         if(sv.redeem) x.redeem = sv.redeem;
       });
       const ghostLim = Date.now() - 5*60*1000;
       loc = loc.filter(function(x){
         if(map[x.id]) return true;
         if(x.status !== 'wait') return true;
         const t = Date.parse(x.createdAt || x.at || '');
         return !(t && t < ghostLim);
       });
       d.orders.forEach(function(x){ if(!loc.some(function(y){ return y.id === x.id; })) loc.push(x); });
       loc.sort(function(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); });
       srvOrders = loc;
       try{ localStorage.setItem('mt_orders', JSON.stringify(loc.slice(0,60))); }catch(e){}
     }
     if(cb) cb();
   })
   .catch(function(){ if(cb) cb(); });
}
function histTick(){
  clearTimeout(histTimer);
  if(!document.querySelector('.refresh-btn')) return;
  if(Date.now() - histAt > 2000){
    histAt = Date.now();
    loadOrders(function(){ if(document.querySelector('.refresh-btn')) renderHistory(); });
    return;
  }
  if(!getOrders().some(function(o){ return o.status === 'wait' || o.status === 'sent'; })) return;
  histTimer = setTimeout(function(){ histAt = 0; histTick(); }, 4000);
}

  if(!document.hidden && document.querySelector('.refresh-btn')){ histAt = 0; histTick(); }

function pfStats(){
  const tp = getTopups() || [], od = getOrders() || [];
  let inSum = 0, outSum = 0, cnt = 0, first = 0;
  function seen(ts){ if(ts && (!first || ts < first)) first = ts; }
  tp.forEach(function(t){
    seen(Date.parse(t.at || '') || 0);
    if(t.status === 'done') inSum += Number(t.amount) || 0;
  });
  od.forEach(function(o){
    seen(Date.parse(o.createdAt || o.at || '') || 0);
    if(o.status === 'cancel' || o.status === 'refund') return;
    outSum += Number(o.price) || 0; cnt++;
  });
  return { inSum:inSum, outSum:outSum, cnt:cnt, first:first };
}
function pfNum(v){
  const t = money(Number(v) || 0, false);
  const i = t.lastIndexOf(' ');
  return i > 0 ? t.slice(0, i) + '<small>' + t.slice(i + 1) + '</small>' : t;
}

function bioOn(){ try{ return localStorage.getItem('mt_bio') === '1'; }catch(e){ return false; } }
function bioSet(v){ try{ localStorage.setItem('mt_bio', v ? '1' : '0'); }catch(e){} }
function bioName(){
  const b = bioMgr();
  return (b && b.biometricType === 'finger') ? 'Barmoq izi' : 'Face ID';
}
/* Haqiqiy skanerlash — Face ID / barmoq izi oynasi shu yerda chiqadi */
function bioScan(reason, ok){
  const b = bioMgr();
  if(!b){ ok(); return; }
  try{
    b.authenticate({ reason: reason }, function(success, token){
      if(!success){ notify('error'); toastErr('Tasdiqlanmadi'); return; }
      /* birinchi safar xotirada token bo'lmasligi mumkin — yozib qo'yamiz */
      if(!token && b.updateBiometricToken){
        try{ b.updateBiometricToken('mt-' + Date.now(), function(){}); }catch(e){}
      }
      ok();
    });
  }catch(e){ ok(); }
}
function bioToggle(){
  haptic();
  const b = bioMgr();
  if(!b){ toastErr("Telegram versiyangiz buni qo'llab-quvvatlamaydi"); return; }
  if(!b.isInited){
    try{ b.init(); }catch(e){}
    toastErr('Bir soniyadan keyin qayta bosing');
    return;
  }
  if(!b.isBiometricAvailable){ toastErr('Bu qurilmada biometriya mavjud emas'); return; }

  /* O'chirish uchun ham tasdiq so'raladi. Aks holda telefonni olgan odam
     shunchaki o'chirib qo'yib buyurtma bera oladi — himoya ma'nosini yo'qotadi. */
  if(bioOn()){
    bioScan("Himoyani o'chirish", function(){
      bioSet(false); renderProfile(); toastOk("O'chirildi");
    });
    return;
  }
  const turnOn = function(){
    bioScan(bioName() + ' ni yoqish', function(){
      bioSet(true); renderProfile(); toastOk(bioName() + ' yoqildi');
    });
  };
  if(b.isAccessGranted){ turnOn(); return; }
  if(b.isAccessRequested){
    /* avval so'ralgan va rad etilgan — faqat Telegram sozlamasidan yoqiladi */
    toast("Telegram sozlamasida biometriyani yoqing");
    if(b.openSettings){ try{ b.openSettings(); }catch(e){} }
    return;
  }
  /* bosish ichida chaqiriladi — Telegram shuni talab qiladi */
  b.requestAccess({ reason: "Buyurtma berishda hisobingizni himoyalash uchun" }, function(granted){
    if(!granted){ toastErr('Ruxsat berilmadi'); return; }
    turnOn();
  });
}
/* Buyurtma berishdan oldin chaqiriladi */
function bioAsk(next){
  if(!bioOn()){ next(); return; }
  const b = bioMgr();
  /* qurilma yoki ruxsat yo'q bo'lsa to'sib qo'ymaymiz — odam ilovadan
     butunlay foydalana olmay qolmasin */
  if(!b || !b.isInited || !b.isBiometricAvailable || !b.isAccessGranted){ next(); return; }
  bioScan("Buyurtmani tasdiqlash", next);
}

function pwBad(msg){
  notify('error'); toastErr(msg);
  const b = document.querySelector('.pw-lock .box');
  if(b){ b.classList.add('pw-shake'); setTimeout(function(){ b.classList.remove('pw-shake'); }, 400); }

function pwSubmit(){
  haptic();
  const a = (pwEl('pwIn1').value || '').trim();
  const b = (pwEl('pwIn2').value || '').trim();
  const go = pwEl('pwGo');
  const busy = function(v){ go.disabled = v; };

  if(pwMode === 'unlock'){
    if(!a) return pwBad('Parolni kiriting');
    busy(true);
    pwPost('/pw/check', { pass:a }).then(function(d){
      busy(false);
      if(d && d.ok){ pwHide(); notify('success'); return; }
      if(d && d.why === 'wait') return pwBad('Kuting: ' + d.wait + ' soniya');
      pwBad('Parol noto\'g\'ri');
    }).catch(function(){ busy(false); pwBad('Tarmoq xatosi'); });
    return;
  }
  if(pwMode === 'off'){
    if(!a) return pwBad('Parolni kiriting');
    busy(true);
    pwPost('/pw/off', { pass:a }).then(function(d){
      busy(false);
      if(d && d.ok){ pwHide(); pwCache(false); if(pwInfo) pwInfo.has = false;
                     renderProfile(); toastOk('Parol o\'chirildi'); return; }
      if(d && d.why === 'wait') return pwBad('Kuting: ' + d.wait + ' soniya');
      pwBad('Parol noto\'g\'ri');
    }).catch(function(){ busy(false); pwBad('Tarmoq xatosi'); });
    return;
  }
  /* set | reset | change */
  const neu = (pwMode === 'change') ? b : a;
  const rep = (pwMode === 'change') ? b : b;
  if(pwMode === 'change' && !a) return pwBad('Joriy parolni kiriting');
  if(neu.length < 4) return pwBad('Kamida 4 ta belgi');
  if(pwMode !== 'change' && neu !== rep) return pwBad('Parollar mos kelmadi');
  busy(true);
  pwPost('/pw/set', { pass:neu, old:(pwMode === 'change' ? a : '') }).then(function(d){
    busy(false);
    if(d && d.ok){ pwHide(); pwCache(true); if(pwInfo){ pwInfo.has = true; pwInfo.resetOk = false; }
                   renderProfile(); toastOk('Parol saqlandi'); notify('success'); return; }
    if(d && d.why === 'nogoogle') return pwBad('Avval Google ni ulang');
    if(d && d.why === 'short')    return pwBad('Kamida 4 ta belgi');
    if(d && d.why === 'wait')     return pwBad('Kuting: ' + d.wait + ' soniya');
    pwBad('Joriy parol noto\'g\'ri');
  }).catch(function(){ busy(false); pwBad('Tarmoq xatosi'); });
}

/* Darvoza ovozi - kirishda ham, chiqishda ham. Faylning boshida 332 ms jimlik bor:
   shunda ovozning eng baland nuqtasi eshiklar tutashgan lahzaga (880 ms) aynan tushadi.
   Ovoz darvoza bilan birga, barmoq bosilgan zahoti chalinadi - iPhone ovozni faqat
   bosishga bevosita javob sifatida ruxsat beradi (kechiktirilsa jim qolishi mumkin). */
var drSnd = null;
function drSound(){
  try{
    if(!drSnd){ drSnd = new Audio('/sounds-x2.mp3'); drSnd.preload = 'auto'; }
    drSnd.volume = 0.9;

    if(p && typeof p.catch === 'function') p.catch(function(){});
  }catch(e){}

function nftDoor(next){
  drSound();
  const old = document.getElementById('drWrap');
  if(old) old.remove();
  const w = document.createElement('div');
  w.className = 'dr-wrap'; w.id = 'drWrap';
  /* O'rtadagi to'lqin halqalari va uchqunlar olib tashlandi - faqat logotip qoladi.
     Ularning uslublari .rg / .sp da turibdi, kerak bo'lsa qaytarish oson. */
  w.innerHTML = '<div class="dr t"></div><div class="dr b"></div>' +
    '<div class="dr-stage"><div class="dr-core">' +
      '<div class="dr-logo"><img src="' + IMG('/minato-logo.webp') + '" alt="" ' +
        'onerror="this.closest(\'.dr-logo\').classList.add(\'off\')"><i class="gl"></i></div>' +
    '</div></div>';
  document.body.appendChild(w);

  /* 1. Yopilish */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ w.classList.add('shut'); });
  });
  /* 2. Qanotlar tutashgach o'rtada olmos chiziladi */
  setTimeout(function(){ w.classList.add('act'); haptic(); }, 880);
  /* 3. Ekran parda ortida almashadi */
  setTimeout(function(){ try{ next(); }catch(e){} }, 1650);
  /* 4. Qanotlar ochiladi */
  setTimeout(function(){
    w.classList.remove('shut'); w.classList.remove('act');
    setTimeout(function(){ if(w) w.remove(); }, 1000);
  }, 2150);
}

/* ===== Narx grafigi va sotuvlar tarixi (batafsil sahifa) =====
   Ma'lumot serverdagi sotuvlar jurnalidan: kolleksiya bo'yicha, so'mda.
   Grafik - kunlik o'rtacha sotuv narxi. Tashqi kutubxonasiz, oddiy SVG. */
var slTab = 'chart', slPer = 30, slCache = {};
function slShort(v){
  v = Number(v) || 0;
  if(v >= 1e6) return (Math.round(v / 1e4) / 100) + 'M';
  if(v >= 1e3) return (Math.round(v / 100) / 10) + 'K';
  return String(Math.round(v));
}
function slDate(ms, full){
  const d = new Date(ms), p = function(n){ return String(n).padStart(2, '0'); };
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + (full ? '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) : '');
}
function slLoad(t){
  const c = slCache[t];
  if(c && Date.now() - c.at < 60000){ slDraw(); return; }
  fetch(VBASE + '/nft/sales?t=' + encodeURIComponent(t)).then(function(r){ return r.json(); }).then(function(d){
    slCache[t] = { at: Date.now(), rows: (d && d.ok && Array.isArray(d.rows)) ? d.rows : [] };
    slDraw();
  }).catch(function(){ slCache[t] = { at: Date.now(), rows: [], err: 1 }; slDraw(); });
}
function slSetTab(t){ haptic(); slTab = t; slDraw(); }
function slSetPer(p){ haptic(); slPer = p; slDraw(); }
function slDraw(){
  const box = document.getElementById('ndSales'), n = nftItem;
  if(!box || !n) return;
  const t = nftTitle(n), c = slCache[t];
  const head = '<div class="sl-top"><div class="sl-tabs">' +
    '<button class="' + (slTab === 'chart' ? 'on' : '') + '" onclick="slSetTab(\'chart\')">Grafik</button>' +
    '<button class="' + (slTab === 'list' ? 'on' : '') + '" onclick="slSetTab(\'list\')">Sotuvlar</button></div>' +
    (slTab === 'chart' ? '<div class="sl-per">' + [[7, '7 kun'], [30, '30 kun'], [0, 'Hammasi']].map(function(p){
      return '<button class="' + (slPer === p[0] ? 'on' : '') + '" onclick="slSetPer(' + p[0] + ')">' + p[1] + '</button>'; }).join('') + '</div>' : '') +
    '</div>';
  if(!c){ box.innerHTML = head + '<div class="sl-empty">Yuklanmoqda\u2026</div>'; return; }
  const now = Date.now();
  const rows = c.rows.map(function(r){ return { ms: Date.parse(r.at), som: Number(r.som) || 0, n: r.n, via: r.via, est: r.est }; })
                     .filter(function(r){ return r.ms && r.som > 0; });
  if(!rows.length){
    box.innerHTML = head + '<div class="sl-empty">' + (c.err ? "Ma'lumot yuklanmadi, keyinroq qayta oching."
      : esc(t) + " kolleksiyasida hali sotuv bo'lmagan.<br>Birinchi sotuvlardan keyin grafik shu yerda paydo bo'ladi.") + '</div>';
    return;
  }
  const estNote = rows.some(function(r){ return r.est; })
    ? '<div class="sl-note">\u2248 belgili narxlar GRAM da qilingan eski xaridlar \u2014 bugungi kurs bilan hisoblangan.</div>' : '';
  if(slTab === 'list'){
    box.innerHTML = head + rows.slice(0, 60).map(function(r){
      return '<div class="sl-row"><div><div class="a">' + esc(t) + (r.n ? ' #' + r.n : '') + '</div>' +
        '<div class="b">' + slDate(r.ms, true) + (r.via === 'offer' ? ' \u00b7 taklif orqali' : '') + '</div></div>' +
        '<div class="p">' + (r.est ? '\u2248 ' : '') + money(r.som, false) + '</div></div>';
    }).join('') + estNote;
    return;
  }
  const from = slPer ? now - slPer * 864e5 : Math.min.apply(null, rows.map(function(r){ return r.ms; }));
  const inP = rows.filter(function(r){ return r.ms >= from; });
  if(!inP.length){ box.innerHTML = head + '<div class="sl-empty">Bu davrda sotuv bo\'lmagan \u2014 "Hammasi" ni tanlang.</div>'; return; }
  /* kunlik o'rtacha */
  const day = {};
  inP.forEach(function(r){ const d = new Date(r.ms); const k = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); (day[k] = day[k] || []).push(r.som); });
  const pts = Object.keys(day).map(Number).sort(function(a, b){ return a - b; })
    .map(function(k){ return { x: k, y: day[k].reduce(function(s, v){ return s + v; }, 0) / day[k].length }; });
  const W = 340, H = 170, L = 38, R = 8, T = 10, B = 24;
  const x0 = slPer ? from : pts[0].x, x1 = Math.max(now, pts[pts.length - 1].x + 1);
  let yMin = Math.min.apply(null, pts.map(function(p){ return p.y; })), yMax = Math.max.apply(null, pts.map(function(p){ return p.y; }));
  if(yMax === yMin){ yMax = yMax * 1.1 + 1; yMin = yMin * 0.9; }
  const pad = (yMax - yMin) * 0.12; yMax += pad; yMin = Math.max(0, yMin - pad);
  const X = function(v){ return L + (W - L - R) * (v - x0) / ((x1 - x0) || 1); };
  const Y = function(v){ return T + (H - T - B) * (1 - (v - yMin) / ((yMax - yMin) || 1)); };
  const line = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
  const area = line + ' L' + X(pts[pts.length - 1].x).toFixed(1) + ' ' + (H - B) + ' L' + X(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z';
  const grid = [0, 0.5, 1].map(function(f){
    const v = yMin + (yMax - yMin) * f, y = Y(v);
    return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="currentColor" stroke-opacity=".12"/>' +
           '<text x="' + (L - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".55">' + slShort(v) + '</text>';
  }).join('');
  const xl = [x0, (x0 + x1) / 2, x1].map(function(v, i){
    return '<text x="' + X(v).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === 2 ? 'end' : 'middle') +
           '" font-size="9.5" fill="currentColor" fill-opacity=".55">' + slDate(v) + '</text>';
  }).join('');
  const dots = pts.map(function(p){ return '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.6" fill="#8C9BFF"/>'; }).join('');
  const svg = '<svg class="sl-svg" viewBox="0 0 ' + W + ' ' + H + '" style="color:var(--text)"><defs><linearGradient id="slG" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#6E7CFF" stop-opacity=".35"/><stop offset="1" stop-color="#6E7CFF" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#slG)"/><path d="' + line + '" fill="none" stroke="#8C9BFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + xl + '</svg>';
  const vals = inP.map(function(r){ return r.som; });
  const avg = vals.reduce(function(s, v){ return s + v; }, 0) / vals.length;
  box.innerHTML = head + svg + '<div class="sl-stats">' +
    '<div><b>' + slShort(avg) + '</b><span>O\'rtacha</span></div>' +
    '<div><b>' + slShort(Math.min.apply(null, vals)) + '</b><span>Eng past</span></div>' +
    '<div><b>' + slShort(Math.max.apply(null, vals)) + '</b><span>Eng yuqori</span></div>' +
    '<div><b>' + vals.length + '</b><span>Sotuv</span></div></div>' + estNote;
}

/* ===== Savatcha =====
   Savatcha qurilmada saqlanadi - unda faqat NFT raqamlari bor, pul yo'q.
   Sotib olishda har bir NFT uchun oddiy sotib olish yo'li (/nft/gift/buy)
   alohida chaqiriladi va serverda o'zi tekshiriladi. Oldin Market qayta
   yuklanadi: narx o'zgargan yoki NFT sotilib ketgan bo'lsa - to'xtaymiz. */
var ctSel = null, ctCur = 'som', ctBusy = false;
function ctKey(){ return 'mt_cart_' + (tgUser && tgUser.id ? tgUser.id : '0'); }
function ctGet(){ try{ const a = JSON.parse(localStorage.getItem(ctKey()) || '[]'); return Array.isArray(a) ? a.map(String) : []; }catch(e){ return []; } }
function ctSet(a){ try{ localStorage.setItem(ctKey(), JSON.stringify(a.slice(0, 50))); }catch(e){} ctBadge(); }
function ctHas(id){ return ctGet().indexOf(String(id)) > -1; }
function ctBadge(){
  const el = document.getElementById('ctN'); if(!el) return;
  const n = ctGet().length; el.textContent = n; el.style.display = n ? '' : 'none';
}
function ctMine(n){ return !!(tgUser && String(n.seller) === String(tgUser.id)); }
function ctAdd(id){
  id = String(id || (nftSel && nftSel.id) || '');
  const n = NFT_ITEMS.find(function(x){ return String(x.id) === id; });

function openCart(){ haptic(); ctSel = null; go('nft_cart'); }
function ctItemGram(n){ return gramSomRate > 0 ? Math.ceil((Number(n.price) / gramSomRate) * 1000) / 1000 : 0; }
function ctTotal(list){
  if(ctCur === 'gram') return Math.round(list.reduce(function(s, n){ return s + ctItemGram(n); }, 0) * 1000) / 1000;
  return list.reduce(function(s, n){ return s + (Number(n.price) || 0); }, 0);
}
function ctHave(){ return ctCur === 'gram' ? getGram() : getNftSom(); }
function ctFmt(v){ return ctCur === 'gram' ? fmtGram(v) + ' GRAM' : money(v, false); }
function ctAvail(){
  const ids = ctGet();

}
function ctSelItems(){ return ctAvail().filter(function(n){ return ctSel && ctSel[n.id]; }); }
function renderCart(){

      '<p>Market dagi NFT larni savatchaga qo\'shing va bir yo\'la sotib oling.</p></div>' +

  const rows = ids.map(function(id){

    return '<div class="ct-row' + (mine ? ' gone' : '') + '">' +

      '<div class="im" style="' + nftBgStyle(n) + '">' + (n.img ? '<img src="' + esc(n.img) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '\uD83C\uDF81') + '</div>' +
      '<div class="tx"><div class="nm">' + esc(nftTitle(n)) + '</div><div class="no">#' + esc(String(n.num || '')) + '</div>' +

  }).join('');
  const tot = ctTotal(sel), have = ctHave(), low = tot > have + 1e-9;

function ctBtn(t){ const b = document.getElementById('ctGo'); if(b){ b.disabled = true; b.textContent = t; } }
function ctBuy(){
  if(ctBusy) return;
  haptic('medium');
  const shown = ctTotal(ctSelItems());
  const shownIds = ctSelItems().map(function(n){ return String(n.id); }).join(',');
  ctBusy = true; ctBtn('Tekshirilmoqda\u2026');

  mktLoad(function(){

    const sel = ctSelItems();

    if(sel.map(function(n){ return String(n.id); }).join(',') !== shownIds || Math.abs(now - shown) > 1e-9){
      renderCart(); toast('Narxlar yoki ro\'yxat yangilandi \u2014 qayta tekshiring'); return;
    }
    if(now > ctHave() + 1e-9){ renderCart(); toastErr("Mablag' yetarli emas"); return; }

      bioAsk(function(){ ctRun(sel.slice()); });

function ctRun(list){
  ctBusy = true;
  let ok = 0; const fail = [];
  const E = { gone:'sotilib ketgan', low:"mablag' yetmadi", self:"o'zingizniki", rate:'kurs olinmadi' };
  const step = function(i){
    if(i >= list.length){ ctFinish(ok, fail); return; }
    const n = list[i];
    ctBtn('Olinmoqda ' + (i + 1) + '/' + list.length + '\u2026');
    fetch(VBASE + '/nft/gift/buy', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: (tg && tg.initData) || '', msgId: n.id, cur: ctCur })
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.ok){
        ok++;
        if(typeof d.gram === 'number') setGram(d.gram);
        if(typeof d.som  === 'number') setNftSom(d.som);
        ctSet(ctGet().filter(function(x){ return x !== String(n.id); }));
        step(i + 1);
      } else {
        fail.push(nftTitle(n) + ' #' + n.num + ' \u2014 ' + (E[d && d.error] || 'bajarilmadi'));
        if(d && (d.error === 'low' || d.error === 'rate')){ ctFinish(ok, fail); return; }
        step(i + 1);
      }
    }).catch(function(){ fail.push(nftTitle(n) + ' \u2014 aloqa yo\'q'); ctFinish(ok, fail); });
  };
  step(0);
}
function ctFinish(ok, fail){

  else if(ok){ notify('warning'); toast(ok + ' ta olindi, ' + fail.length + ' tasi olinmadi: ' + fail[0]); }
  else { notify('error'); toastErr('Sotib olinmadi: ' + (fail[0] || '')); }
  try{ mktLoad(); }catch(e){} try{ mgLoad(); }catch(e){} try{ nftHistLoad(); }catch(e){} try{ nftLoad(); }catch(e){}
  if(ok){ mgTab = 'gifts'; mgSeg = 'un'; setTimeout(function(){ go('nft_gifts'); }, 900); }
  else renderCart();
}

/* ---------- Market filtrlari ----------
   NFT yozuvining shakli:
   { id, name, num, price, img, glyph, collection, model, bg, bgColor }
   Ro'yxatlar NFT_ITEMS dan o'zi yig'iladi, ya'ni ma'lumot kelgach o'zi to'ladi. */
let mktQ = '', mktMax = 0, mktRangeOn = false, mktView = 'grid';
let mktSel = { collection:[], model:[], bg:[] };
const MKT_FIELDS = {
  collection: { title:'Kolleksiya', chip:'Kolleksiya' },
  model:      { title:'Model',      chip:'Model' },
  bg:         { title:'Fon',        chip:'Fon' }
};

function mktMaxPrice(){
  let m = 0;
  NFT_ITEMS.forEach(function(n){ if(Number(n.price) > m) m = Number(n.price); });
  return Math.ceil(m) || 100;
}
/* Bitta maydon bo'yicha guruhlar: nomi, nechta, eng arzon narxi */
function mktGroups(field){
  const map = {};
  NFT_ITEMS.forEach(function(n){
    const k = n[field]; if(!k) return;
    if(!map[k]) map[k] = { key:k, n:0, min:null, img:n.img||'', glyph:n.glyph||'', color:n.bgColor||'' };
    map[k].n++;
    const p = Number(n.price) || 0;
    if(p && (map[k].min === null || p < map[k].min)) map[k].min = p;
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return (a.min||1e9) - (b.min||1e9); });
}
/* Barcha filtrlarni qo'llash */
function mktFiltered(){
  const q = mktQ.trim().toLowerCase();
  return NFT_ITEMS.filter(function(n){
    if(q && String(n.name||'').toLowerCase().indexOf(q) === -1) return false;
    if(mktSel.collection.length && mktSel.collection.indexOf(n.collection) === -1) return false;
    if(mktSel.model.length && mktSel.model.indexOf(n.model) === -1) return false;
    if(mktSel.bg.length && mktSel.bg.indexOf(n.bg) === -1) return false;
    if(mktMax > 0 && (Number(n.price) || 0) > mktMax) return false;
    return true;
  });
}

function spPremList(){
  const g = GAMES.find(function(x){ return x.id === 'tgpremium'; });

  return [3,6,12].map(function(m){

        spWhoOk = true; spWhoLast = u;

                       u.toLowerCase() === String(tgUser.username).toLowerCase());

          '<div class="sp-ok">' +
            (av ? '<img src="' + av + '" alt="" onerror="this.style.display=\'none\'">'

            '<div class="tx"><b>' + esc(d.name) + '</b>' +

          '</div>');

        spWhoOk = false; spWhoLast = '';

        spWhoOk = false; spWhoLast = '';

      } else if(d && d.why === 'none'){
        spWhoOk = false; spWhoLast = '';
        spWhoBox('<div class="sp-bad">Bunday foydalanuvchi topilmadi</div>');

        /* Tekshiruv ishlamadi (xizmat vaqtincha yopiq bo'lishi mumkin).
           To'sib qo'ymaymiz — faqat diqqat qilishni so'raymiz. */
        spWhoOk = true; spWhoLast = u;

                 'ishonch hosil qiling. Xato yozilsa pul boshqa odamga ketadi.</div>');

    }).catch(function(){ spWhoBox(''); spSync(); });

let spBusy = false;
function spBuy(){
  if(spBusy) return;
  haptic();
  const u = (document.getElementById('spUser')||{}).value || '';
  const uname = String(u).trim().replace(/^@/, '');
  if(!spWhoOk || uname.toLowerCase() !== spWhoLast.toLowerCase()){
    toast('Avval username tekshirilsin'); return;
  }

  let pkg, som, oid, qty = 0;
  if(spTab === 'stars'){
    const n = parseInt((document.getElementById('spAmt')||{}).value || '0', 10) || 0;
    if(n < SP_MIN){ toast('Eng kami ' + SP_MIN + ' Stars'); return; }
    som = starPrice(n); pkg = n + ' \u2B50'; oid = ''; qty = n;
  } else {
    const o = spPremList().find(function(x){ return x.m === spMonths; });
    if(!o || !o.som){ toast('Narx topilmadi'); return; }
    som = o.som; pkg = o.t; oid = o.oid;
  }

  const gram = spGram ? somToGram(som) : 0;
  if(spGram){
    if(!(gram > 0)){ toast('Kurs olinmadi, qayta urining'); return; }
    if(gram > getGram()){ toast('GRAM yetarli emas'); return; }
  } else {
    if(som > getNftSom()){ toast('Mablag\' yetarli emas'); return; }
  }

  bioAsk(function(){
    spBusy = true;
    const b = document.getElementById('spGo');
    if(b){ b.disabled = true; b.textContent = 'Yuborilmoqda\u2026'; }
    const order = {
      id:'MT'+Date.now().toString().slice(-8),
      game: spTab === 'stars' ? 'TG STARS' : 'TG PREMIUM',
      gameId: spTab === 'stars' ? 'tgstars' : 'tgpremium',
      glyph: spTab === 'stars' ? '\u2B50' : '\uD83D\uDC51',
      package: pkg, price: som, oid: oid, qty: qty,
      details: { username: '@' + uname },
      pay: spGram ? 'gram' : 'nftsom', gram: gram,
      tgUser: tgUser ? { id:tgUser.id, username:tgUser.username, name:tgUser.first_name } : null,
      status:'wait', createdAt:new Date().toISOString()
    };
    fetch(VBASE + '/order', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ order: order, initData: (tg && tg.initData) || '' })
    }).then(function(r){ return r.json(); }).then(function(d){
      spBusy = false;
      if(b){ b.textContent = spTab === 'stars' ? 'Stars sotib olish' : 'Premium sotib olish'; }
      if(d && d.ok){
        if(typeof d.nftSom === 'number') setNftSom(d.nftSom);
        if(typeof d.gram   === 'number') setGram(d.gram);
        notify('success');
        toastOk('\u2705 Buyurtma qabul qilindi');
        nftHistLoad();
        if(typeof loadOrders === 'function') loadOrders();
        mgTab = 'history';
        setTimeout(function(){ go('nft_gifts'); }, 700);
        return;
      }
      if(b) b.disabled = false;
      if(d && d.error === 'balance'){
        notify('error');
        return toastErr('Mablag\' yetarli emas');
      }
      notify('error');
      toastErr('Xato: ' + ((d && d.error) || 'yuborilmadi'));
    }).catch(function(){
      spBusy = false;
      if(b){ b.disabled = false; b.textContent = spTab === 'stars' ? 'Stars sotib olish' : 'Premium sotib olish'; }
      toastErr('Aloqa yo\'q');
    });
  });
}

/* ---------- NFT animatsiyasi ----------
   Fragment har NFT uchun lottie.json beradi. Kutubxona faqat sovg'a
   oynasi ochilganda yuklanadi — ro'yxatlarda statik rasm qoladi,
   shuning uchun ilova sekinlashmaydi. */
let lotLoading = null;
function lotLib(){
  if(window.lottie) return Promise.resolve(true);
  if(lotLoading) return lotLoading;
  lotLoading = new Promise(function(res){
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js';
    s.onload  = function(){ res(!!window.lottie); };
    s.onerror = function(){ res(false); };
    document.head.appendChild(s);
  });
  return lotLoading;
}
function lotUrl(slug){
  return slug ? ('https://nft.fragment.com/gift/' + String(slug).toLowerCase() + '.lottie.json') : '';
}
let lotAnim = null, lotTok = 0;
function lotStop(){
  lotTok++;   /* yo'ldagi yuklanish eskirdi — boshqa oynaga tushib qolmasin */
  if(lotAnim){ try{ lotAnim.destroy(); }catch(e){} lotAnim = null; }
}
/* Oynadagi rasmni animatsiyaga almashtiradi */
function lotPlay(boxId, slug){
  /* Har chaqiruvga raqam: tezda boshqa NFT tanlansa, kechikib kelgan eski
     animatsiya yangi oynaga tushmaydi */
  const tok = ++lotTok;
  const url = lotUrl(slug); if(!url) return;
  lotLib().then(function(ok){
    if(!ok || tok !== lotTok) return;                       /* kutubxona kelmadi — rasm qoladi */
    const box = document.getElementById(boxId);
    if(!box) return;
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      if(tok !== lotTok) return;
      const b = document.getElementById(boxId);
      if(!b) return;
      lotStop();
      b.innerHTML = '';
      lotAnim = window.lottie.loadAnimation({
        container: b, renderer: 'svg', loop: false, autoplay: true, animationData: data
      });
      /* Bosilganda qaytadan o'ynaydi — lekin faqat animatsiya
         TUGAGANDAN keyin. O'ynayotganda bosilsa e'tiborsiz qoladi,
         aks holda u har bosishda boshiga qaytib oxiriga yetmasdi. */
      let lotRun = true;
      lotAnim.addEventListener('complete', function(){ lotRun = false; });
      b.onclick = function(){
        if(!lotAnim || lotRun) return;
        lotRun = true;
        haptic();
        try{ lotAnim.goToAndPlay(0, true); }catch(e){}
      };
    }).catch(function(){});
  });
}

/* ---------- NFT profili ----------
   Bosh sahifadagi profildan MUSTAQIL: bu yerda faqat NFT bo'limining
   raqamlari ko'rinadi. Xavfsizlik (Google, Face ID, parol) esa umumiy —
   bosh sahifada ulangan bo'lsa bu yerda ham ulangan turadi. */

/* NFT bo'limining o'z hisob-kitobi */
function nftStats(){
  let spent = 0, sold = 0, bought = 0, gram = 0, som = 0;
  (nftHist || []).forEach(function(r){
    const cur = r.cur || "so'm";
    if(r.kind === 'nft_buy'){
      if(cur === "so'm"){ spent += Number(r.amount) || 0; som += Number(r.amount) || 0; }
      else gram += Number(r.amount) || 0;
      /* NFT hamyonidan olingan buyurtmalar (Stars, Premium va boshqalar) ham shu
         turda, lekin IZOHSIZ yoziladi. Haqiqiy NFT xaridida izoh bor. */
      if(r.note) bought++;
    }
    if(r.kind === 'nft_sell') sold++;
  });
  /* so'mda qilingan xaridlar bugungi kurs bilan GRAM ga aylantiriladi - shuning uchun "≈" */
  const conv = som > 0 ? somToGram(som) : 0;
  return { orders: getNftOrders().length, sold: sold, spent: Math.round(spent),
           bought: bought, spentGram: Math.round((gram + conv) * 100) / 100, approx: conv > 0 };
}

/* kalitlar: mt_ntf va mt_half - saqlanadi (bildirishnomalar va takliflar ulanganda ishlatiladi),
   mt_vib - haptic() ni o'chiradi, mt_anim - bosh sahifadagi "Animatsiyalarni kamaytirish" bilan umumiy */
function nmSw(k, el){
  haptic();
  const sw = el.querySelector('.switch');
  const on = !(sw && sw.classList.contains('on'));
  if(sw) sw.classList.toggle('on', on);
  try{ localStorage.setItem(k, on ? '1' : '0'); }catch(e){}
  if(k === 'mt_vib'){ _vibOff = !on; if(on) haptic('medium'); }
  if(k === 'mt_anim') document.body.classList.toggle('reduce-motion', !on);
}
function nmHalf(el){
  haptic();
  const on = !el.classList.contains('on');
  el.classList.toggle('on', on);
  try{ localStorage.setItem('mt_half', on ? '1' : '0'); }catch(e){}
}

function nmLang(l){
  haptic();
  if(l === currentLang){ closeSheet(); return; }
  const old = currentLang;
  if(old !== 'uz' && DICT[old]) applyMap(revOf(old));
  currentLang = l;
  try{ localStorage.setItem('mt_lang', l); }catch(e){}
  const back = function(){ closeSheet(); go('nft_profile'); };
  if(!FXR) loadFx(back); else back();
}

let mgList = [], mgFee = 0.4, mgLoaded = false, mgPick = null;
function mgLoad(cb){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid){ if(cb) cb(); return; }
  fetch(VBASE + '/nft/gifts?id=' + encodeURIComponent(uid))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){
        mgList = Array.isArray(d.gifts) ? d.gifts : [];
        if(d.fee) mgFee = Number(d.fee);
        mgLoaded = true;
        if(view === 'nft_gifts') renderNftGifts();
      }
      if(cb) cb();
    }).catch(function(){ if(cb) cb(); });
}

function mgSaleIn(el){

function sgBox(x){ const b = document.getElementById('sgWho'); if(b) b.innerHTML = x; }

function sgIn(){
  const raw = ((document.getElementById('sgUser')||{}).value || '').trim().replace(/^@+/, '');
  sgOk = false; clearTimeout(sgT);
  if(!raw){ sgBox(''); sgLast = ''; sgSync(); return; }
  if(!/^[A-Za-z0-9_]{4,32}$/.test(raw)){
    sgBox('<div class="sp-bad">Username kamida 4 ta belgi, faqat harf, raqam va _</div>');
    sgLast = ''; sgSync(); return;
  }
  sgBox('<div class="sp-wait">Tekshirilmoqda\u2026</div>');
  sgT = setTimeout(function(){ sgGo(raw); }, 550);
  sgSync();
}
function sgGo(u){
  fetch(VBASE + '/tg/user?u=' + encodeURIComponent(u))
    .then(function(r){ return r.json(); })
    .then(function(d){
      const now = ((document.getElementById('sgUser')||{}).value || '').trim().replace(/^@+/, '');
      if(now.toLowerCase() !== u.toLowerCase()) return;
      if(d && d.ok && d.found){
        sgOk = true; sgLast = u;
        const av = d.id ? (VBASE + '/avatar?id=' + encodeURIComponent(d.id)) : '';
        sgBox('<div class="sp-ok">' +
          (av ? '<img src="' + av + '" alt="" onerror="this.style.display=\'none\'">'
              : '<span class="ph">' + esc(d.name.slice(0,1).toUpperCase()) + '</span>') +
          '<div class="tx"><b>' + esc(d.name) + '</b><small>Sovg\'a shu odamga ketadi</small></div></div>');
      } else if(d && (d.why === 'not_user' || d.why === 'is_bot')){
        sgOk = false; sgLast = '';
        sgBox('<div class="sp-bad">Bu foydalanuvchi emas</div>');
      } else if(d && d.why === 'none'){
        sgOk = false; sgLast = '';
        sgBox('<div class="sp-bad">Bunday foydalanuvchi topilmadi</div>');
      } else {
        sgOk = true; sgLast = u;
        sgBox('<div class="sp-warn">Tekshirib bo\'lmadi \u2014 username to\'g\'riligiga ' +
              'ishonch hosil qiling.</div>');
      }
      sgSync();
    }).catch(function(){ sgBox(''); sgSync(); });
}

  if(sgBusy || !mgPick) return;
  haptic();

  if(!sgOk || u.toLowerCase() !== sgLast.toLowerCase()){ toast('Avval username tekshirilsin'); return; }

    sgBusy = true;
    const b = document.getElementById('sgGo');

    fetch(VBASE + '/nft/gift/send', {

    }).then(function(r){ return r.json(); }).then(function(d){

      if(b){ b.disabled = false; b.textContent = 'Yuborish'; }

    strip + info + note + btn;

  const st = document.getElementById('gpStrip');

      if(on) st.scrollLeft = Math.max(0, on.offsetLeft - (st.clientWidth - on.offsetWidth) / 2);
    }
  }
  lotPlay('gpIm', g.slug);
}

/* Chiqarish — sovg'a oynasidagi mgTake bilan aynan bir xil so'rov */
function gpGo(){
  if(gpBusy) return;
  const g = gpSel(); if(!g || String(g.msgId) !== String(gpSelId)) return;
  haptic();
  if(getGram() < mgFee){ toast('GRAM yetarli emas \u2014 ' + fmtGram(mgFee) + ' kerak'); return; }
  bioAsk(function(){
    gpBusy = true;
    const b = document.getElementById('gpBtn');
    if(b){ b.disabled = true; b.textContent = 'Chiqarilmoqda\u2026'; }
    fetch(VBASE + '/nft/gift/out', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg.initData || '', msgId: g.msgId })
    }).then(function(r){ return r.json(); }).then(function(d){
      gpBusy = false;
      if(d && d.ok){
        setGram(d.left);
        notify('success');
        toastOk('\u2705 Hisobingizga yuborildi');
        mgClose(); mgLoad(); nftHistLoad();
        return;
      }
      gpBtnReset();
      notify('error');
      if(d && d.error === 'fee')  return toastErr('GRAM yetarli emas');
      if(d && d.error === 'busy') return toastErr('Allaqachon yuborilmoqda');
      if(d && d.error === 'send') return toastErr('Yuborilmadi, haq qaytarildi');
      toastErr('Bajarilmadi');
    }).catch(function(){
      gpBusy = false;
      gpBtnReset();
      toastErr("Aloqa yo'q");

/* =====================================================================
   Tarix yozuvi oynasi — Sovg'alarim > Tarix, so'm hamyoni va pastki
   menyudagi Tarix qatorlari bosilganda ochiladi: sana, vaqt, tafsilotlar
   va NFT bo'lsa uning animatsiyasi. Ro'yxat chizilganda ko'rsatilgan
   qatorlar shu massivlarga yoziladi, bosilganda tartib raqamidan topiladi.
   ===================================================================== */
var mhShown = [], wlShown = [], nhShown = [];
const HD_MON = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const HD_CP  = '<svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.4"/>' +
               '<path d="M15.5 8.5V6.4a1.9 1.9 0 0 0-1.9-1.9H6.4a1.9 1.9 0 0 0-1.9 1.9v7.2a1.9 1.9 0 0 0 1.9 1.9h2.1"/></svg>';
/* Qatorlar bosilganda ozgina ichkariga kirsin (bindHistTaps pastda) */
function nhBind(){ setTimeout(function(){ try{ bindHistTaps(); }catch(e){} }, 0); }

function hdOpen(src, i){
  const L = src === 'mh' ? mhShown : (src === 'wl' ? wlShown : nhShown);
  const x = L && L[i];
  if(!x) return;
  const o = (src === 'nh') ? null : x.ord;
  const r = (src === 'nh') ? x : x.rec;
  const m = o ? hdFromOrder(o) : (r ? hdFromRec(r) : null);
  if(m) hdShow(m);
}
function hdWhen(at){
  const d = new Date(at || '');
  if(!at || isNaN(d.getTime())) return ['', ''];
  return [d.getDate() + ' ' + HD_MON[d.getMonth()] + ' ' + d.getFullYear(),
          String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')];
}
function hdMoney(n, cur){
  n = Number(n) || 0;
  return cur === 'GRAM' ? (fmtGram(n) + ' GRAM') : (fmt(Math.round(n)) + " so'm");
}
/* [rang, matn]: ok — yashil, wait — sariq, bad — qizil */
function hdSt(s, okTxt, waitTxt){
  if(!s || s === 'done') return ['ok', okTxt || 'Bajarildi'];
  if(s === 'wait' || s === 'sent') return ['wait', waitTxt || 'Kutilmoqda'];
  if(s === 'refund') return ['bad', 'Pul qaytarildi'];
  return ['bad', 'Bekor qilingan'];
}
/* Bosilganda nusxalanadigan qiymat */
function hdCp(v, shown){
  if(!v) return '';
  return '<span class="hd-cp" data-c="' + esc(String(v)) + '" onclick="hdCopy(this)">' +
         esc(String(shown || v)) + HD_CP + '</span>';
}
function hdCopy(el){
  const v = (el && el.dataset) ? el.dataset.c : '';
  if(!v) return;
  haptic();
  const say = function(ok){ toast(ok ? 'Nusxalandi' : 'Nusxalanmadi'); };
  const old = function(){
    let ok = false;
    try{
      const t = document.createElement('textarea');
      t.value = v; t.setAttribute('readonly', '');
      t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(t); t.select();
      try{ t.setSelectionRange(0, v.length); }catch(e){}
      try{ ok = document.execCommand('copy'); }catch(e){}
      t.remove();
    }catch(e){}
    return ok;
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(function(){ say(true); }, function(){ say(old()); });
      return;
    }
  }catch(e){}
  say(old());
}
/* Tarix yozuvida faqat NFT nomi bor. Sovg'a hali biror ro'yxatda bo'lsa
   ma'lumoti o'shandan olinadi, bo'lmasa havola nomi nomdan tiklanadi:
   "Plush Pepe #1234" -> "PlushPepe-1234" (Fragment katta-kichik harfni farqlamaydi). */
function hdGift(name){
  const nm = String(name || '');
  const same = function(x){ return x && String(x.name) === nm; };
  let g = null;
  try{
    g = (mgList || []).find(same) || (NFT_ITEMS || []).find(same) ||
        ((offData && offData.inc) || []).find(same) || ((offData && offData.out) || []).find(same) || null;
  }catch(e){}
  const mt = nm.match(/^(.*?)\s*#(\d+)\s*$/);
  const title = mt ? mt[1] : nm, num = mt ? mt[2] : '';
  const slug = (g && g.slug) || (mt ? title.replace(/[^A-Za-z0-9]/g, '') + '-' + num : '');
  const pic  = (g && (g.pic || g.img)) || (slug ? 'https://nft.fragment.com/gift/' + slug.toLowerCase() + '.medium.jpg' : '');
  return { slug: slug, pic: pic, attrs: (g && g.attrs) || null, title: title, num: num };
}
function hdFromRec(r){
  const k = String(r.kind || ''), note = String(r.note || ''), cur = r.cur || "so'm";
  const amt = Number(r.amount) || 0, offer = /taklif/i.test(note), w = hdWhen(r.at);
  const rows = [['Sana', esc(w[0])], ['Vaqt', esc(w[1])]];
  const m = { nft:false, name:'', glyph:'\uD83D\uDCB0', amt:0, cur:cur, sign:0, st:hdSt(r.status), rows:rows };
  const nft = function(){ m.nft = true; m.name = String(r.item || 'NFT'); m.glyph = '\uD83C\uDF81'; };

  if(k === 'gift_in'){
    nft(); m.st = hdSt(r.status, 'Qabul qilindi');
    const f = note.match(/^@?(\S+) dan keldi/);
    if(f) rows.push(['Kimdan', esc(/^\d+$/.test(f[1]) ? ('ID ' + f[1]) : ('@' + f[1]))]);
    else if(note) rows.push(['Qanday', esc(note)]);
  } else if(k === 'gift_out'){
    nft();
    const t = note.match(/^@?(\S+) ga yuborildi/);
    if(t){ m.st = hdSt(r.status, 'Yuborildi'); rows.push(['Kimga', esc('@' + t[1])]); }
    else { m.st = hdSt(r.status, 'Chiqarildi'); rows.push(['Qayerga', 'Telegram hisobingiz']); }
    if(amt) rows.push(['Xizmat haqi', esc(hdMoney(amt, cur))]);
  } else if(k === 'nft_buy'){
    if(note){ nft(); rows.push(['Qanday', offer ? 'Taklif orqali' : 'Bozordan']); }
    else { m.name = String(r.item || 'Xarid'); m.glyph = '\uD83D\uDED2'; }
    m.st = hdSt(r.status, offer ? 'Taklif orqali olindi' : 'Sotib olindi');
    m.amt = amt; m.sign = -1;
  } else if(k === 'nft_sell'){
    nft(); m.st = hdSt(r.status, offer ? 'Taklif orqali sotildi' : 'Sotildi');
    m.amt = amt; m.sign = 1;
    rows.push(['Qanday', offer ? 'Taklif orqali' : 'Bozorda']);
    const c = note.match(/komissiya\s*([\d.]+)/i);
    if(c) rows.push(['Komissiya', esc(hdMoney(c[1], cur))]);
  } else if(k === 'offer_hold' || k === 'offer_back'){
    nft();
    const back = k === 'offer_back';
    m.st = back ? hdSt(r.status, 'Pul qaytarildi')
         : (r.status && r.status !== 'done') ? hdSt(r.status) : ['wait', 'Pul bloklandi'];
    m.amt = amt; m.sign = back ? 1 : -1;
    rows.push(['Turi', back ? 'Taklif puli qaytdi' : 'Taklif uchun bloklandi']);
  } else if(k === 'som_in' || k === 'gram_in'){
    const gr = k === 'gram_in';
    m.name = gr ? "GRAM to'ldirildi" : "So'm tushdi"; m.glyph = gr ? '\uD83D\uDC8E' : '\uD83D\uDCB3';
    m.st = hdSt(r.status, 'Hisobga tushdi');
    m.amt = amt; m.sign = 1;
    if(note) rows.push([/bekor/i.test(note) ? 'Sabab' : ((!gr && !/qo'llab/i.test(note)) ? "To'lov usuli" : 'Manba'), esc(note)]);
    if(r.ref) rows.push(["To'lov raqami", hdCp(r.ref)]);
  } else if(k === 'som_out'){
    m.name = 'Kartaga yechish'; m.glyph = '\uD83C\uDFE7';
    m.st = hdSt(r.status, "Kartaga o'tkazildi");
    m.amt = amt; m.sign = -1;
    if(r.card) rows.push(['Karta', esc(r.card)]);
    if(r.no) rows.push(['Ariza raqami', hdCp(r.no)]);
    if(note && !r.card) rows.push(['Izoh', esc(note)]);
  } else if(k === 'gram_out'){
    m.name = 'GRAM yechildi'; m.glyph = '\uD83D\uDC8E';
    m.st = hdSt(r.status, 'Bajarildi', 'Yuborilmoqda');
    m.amt = amt; m.sign = -1;
    if(r.to) rows.push(['Hamyon', hdCp(r.to, tcShort(r.to))]);
    if(r.fee) rows.push(['Tarmoq haqi', esc(hdMoney(r.fee, 'GRAM'))]);
    if(note && !r.to) rows.push(['Izoh', esc(note)]);
  } else {
    m.name = String(r.item || note || 'Yozuv');
    if(note && r.item) rows.push(['Izoh', esc(note)]);
    m.amt = amt;
  }
  if(m.nft){
    const G = hdGift(m.name);
    m.slug = G.slug; m.pic = G.pic; m.attrs = G.attrs; m.title = G.title; m.num = G.num;
  }
  if(!m.nft) m.icon = nhIcon(r);
  if(r.id) rows.push(['Yozuv raqami', hdCp(r.id)]);
  return m;
}
/* NFT hamyonidan berilgan buyurtma (Stars, Premium va boshqalar) */
function hdFromOrder(o){
  const w = hdWhen(o.at || o.createdAt);
  const gram = (o.pay === 'gram' && o.gram) ? Number(o.gram) : 0;
  const m = { nft:false, name: String(o.game || o.item || 'Xarid'), glyph: o.glyph || '\u2B50',
              amt: gram || Number(o.price) || 0, cur: gram ? 'GRAM' : "so'm", sign: -1,
              st: hdSt(o.status, 'Bajarildi', 'Yuborilmoqda'),
              rows: [['Sana', esc(w[0])], ['Vaqt', esc(w[1])]] };
  if(o.package) m.rows.push(['Paket', esc(o.package)]);
  if(o.pid) m.rows.push(['Kimga', esc(o.pid)]);
  if(o.id) m.rows.push(['Buyurtma raqami', hdCp(o.id, '#' + o.id)]);
  m.icon = nhOrderIcon(o);
  return m;
}
function hdShow(m){
  const sh = gpShell('hd');
  let hero;
  if(m.nft){
    const A = m.attrs || {};
    const known = !!(A.bg && A.bg.c1);

      '<div class="hd-an" id="hdIm"><span>' + m.glyph + '</span>' +
        (m.pic ? '<img src="' + esc(m.pic) + '" alt="" onerror="this.remove()">' : '') +

  } else {
    hero = '<div class="hd-ic">' + (m.icon || m.glyph) + '</div>';
  }
  const title = m.nft ? (esc(m.title || m.name) + (m.num ? ' <span>#' + esc(m.num) + '</span>' : '')) : esc(m.name);
  const sign  = m.sign > 0 ? '+' : (m.sign < 0 ? '\u2212' : '');
  sh.innerHTML =

    hero +
    '<div class="mg2-nm">' + title + '</div>' +
    '<div class="mg2-st hd-st ' + m.st[0] + '"><i></i>' + esc(m.st[1]) + '</div>' +
    (m.amt ? '<div class="hd-amt' + (m.sign > 0 ? ' plus' : '') + '">' + sign + esc(hdMoney(m.amt, m.cur)) + '</div>' : '') +
    '<div class="sh-box">' + m.rows.map(function(x){ return shRow(x[0], x[1]); }).join('') + '</div>';
  gpShow();
  if(m.nft && m.slug) lotPlay('hdIm', m.slug);
}

/* ---------- NFT oynalarini pastga surib yopish ----------
   "Qo'shish" varag'idagi kabi: barmoq bilan pastga tortilsa oyna birga
   tushadi; yetarlicha tortilsa yoki tez siltansa yopiladi, kam bo'lsa
   joyiga qaytadi. Oyna ichida aylantirish bo'lsa, avval u ishlaydi.
   Yonga surish (sovg'alar tasmasi) ga tegilmaydi. X tugmasi ham ishlayveradi.
   Tinglovchilar faqat oynaning o'ziga ulanadi (document ga emas). */
function gfDragBind(sh){
  if(!sh || sh._drag) return;
  sh._drag = true;
  let y0 = 0, x0 = 0, d = 0, mode = 0, raf = 0, ly = 0, lt = 0, v = 0;
  sh.addEventListener('touchstart', function(e){
    const t = e.touches[0];
    y0 = ly = t.clientY; x0 = t.clientX; lt = Date.now(); d = 0; v = 0;
    mode = e.touches.length > 1 ? -1 : 0;
  }, { passive: true });
  sh.addEventListener('touchmove', function(e){
    if(mode < 0) return;
    const t = e.touches[0], dy = t.clientY - y0, dx = t.clientX - x0, now = Date.now();
    if(now > lt) v = (t.clientY - ly) / (now - lt);
    ly = t.clientY; lt = now;
    if(mode === 0){
      const top = sh.scrollTop <= 0;
      if(Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)){ mode = -1; return; }
      if(dy > 6 && top){ mode = 1; sh.classList.add('drag'); }
      else if(dy < -6 || !top){ mode = -1; return; }
      else { if(dy > 0 && dy >= Math.abs(dx) && top && e.cancelable) e.preventDefault(); return; }
    }
    if(e.cancelable) e.preventDefault();
    d = Math.max(0, dy - 6);
    if(raf) return;
    raf = requestAnimationFrame(function(){ raf = 0; sh.style.transform = 'translateY(' + d + 'px)'; });
  }, { passive: false });
  const end = function(){
    if(mode !== 1){ mode = 0; return; }
    mode = 0;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    sh.classList.remove('drag');
    sh.style.transition = 'transform .36s cubic-bezier(.22,.88,.28,1)';
    sh.style.transform = '';
    setTimeout(function(){ sh.style.transition = ''; }, 400);
    if(d > 90 || (v > 0.55 && d > 24)) mgClose();
  };
  sh.addEventListener('touchend', end, { passive: true });
  sh.addEventListener('touchcancel', end, { passive: true });
}

/* ---------- Tarix qatorlarining rasmlari ----------
   Emoji o'rniga har yozuvning o'z rasmi: karta bilan to'ldirilgan bo'lsa
   o'sha bankning rasmi (CARDS), USDT va Stars — to'ldirish ekranidagi
   rasmlar, GRAM — TON belgisi, NFT — NFT'ning o'zi, Stars/Premium
   xaridlari — o'yinlar ro'yxatidagi rasmi. O'z rasmi yo'q yozuvlar

function nhSv(k, c){ return '<span class="nh-sv ' + (c || '') + '">' + (NH_SV[k] || NH_SV.wallet) + '</span>'; }
function nhImg(src, fit, fb){
  return '<img class="nh-im ' + fit + '" src="' + esc(src) + '" alt="" loading="lazy" onerror="nhImgErr(this,\'' + fb + '\')">';
}
function nhImgErr(el, fb){ try{ el.outerHTML = nhSv(fb); }catch(e){} }
/* To'lov usuli nomidan rasm */
function nhPayIcon(note){
  const n = String(note || '').toLowerCase();
  if(n.indexOf('usdt') > -1) return nhImg(IMG('/ton-x1.webp'), 'fit', 'wallet');
  if(n.indexOf('stars') > -1) return nhImg(IMG('/stars-x7.webp'), 'fill', 'wallet');
  let hit = null;
  try{
    Object.keys(CARDS).forEach(function(k){
      const c = CARDS[k];
      if(!hit && c && c.bank && n.indexOf(String(c.bank).toLowerCase()) > -1) hit = c;
    });
  }catch(e){}
  if(hit && hit.icon && hit.icon.indexOf('/') === 0) return nhImg(IMG(hit.icon), 'fit', 'card');
  return '';
}
function nhIcon(r){
  if(!r) return nhSv('wallet');
  const k = String(r.kind || ''), note = String(r.note || '');
  if(/^(gift_|offer_)/.test(k) || k === 'nft_sell' || (k === 'nft_buy' && note)){
    const G = hdGift(r.item);
    return G.pic ? nhImg(G.pic, 'fill', 'gift') : nhSv('gift');
  }
  if(k === 'nft_buy') return nhOrderIcon({ game: String(r.item || '').split(' \u2014 ')[0] });
  if(k === 'gram_in' || k === 'gram_out') return '<img class="nh-im nh-ton" src="' + TON_IMG + '" alt="">';
  if(/bekor|qaytar/i.test(note)) return nhSv('back', 'g');
  if(/qo'llab|tuzatish/i.test(note)) return nhSv('help', 'a');
  if(k === 'som_in') return nhPayIcon(note) || nhSv('wallet');
  if(k === 'som_out') return nhSv('card');
  return nhSv('wallet');
}
/* NFT hamyonidan berilgan buyurtma (Stars, Premium va boshqalar) */
function nhOrderIcon(o){
  try{
    const g = (GAMES || []).filter(function(x){
      return x && o && (x.id === o.gameId || x.id === o.gid ||
             String(x.name || '').toLowerCase() === String(o.game || '').toLowerCase());
    })[0];
    if(g && (g.img || g.hicon)) return nhImg(IMG(g.img || g.hicon), 'fill', 'wallet');
  }catch(e){}
  return nhSv('wallet');
}
function nhIconW(x){ return x ? (x.ord ? nhOrderIcon(x.ord) : nhIcon(x.rec)) : nhSv('wallet'); }

/* Animatsiyali raketa. Harakat videodagi uchishdan o'lchab olingan 3 soniyalik
   halqa: 0.4 s orqaga tortiladi, 0.5 s oldinga otiladi, keyin suzib turadi,
   oxirida yana kichik tortilish va otilish. Tortilganda burni pastroq,
   otilganda tekisroq (+-4 gradus). Olov otilish paytida kuchayadi, tana
   bo'ylab yaltiroq nur yuradi (raketa o'z o'qi atrofida aylangandek),
   oq va yashil strelkalar raketa orqasidan chiqib uchish tomoniga ketadi,
   yulduzchalar asta yonib-o'chadi. "Harakatni kamaytirish" yoqilgan bo'lsa
   hammasi joyida turadi. */
function szRocket(){
  const L = SZ_RK.layers, box = function(k){ const l = L[k]; return 'left:' + l.x + '%;top:' + l.y + '%;width:' + l.w + '%;height:' + l.h + '%'; };
  const src = function(k){ return 'data:image/webp;base64,' + L[k].b64; };
  const img = function(k, cls){ return '<img class="' + cls + '" src="' + src(k) + '" style="' + box(k) + '" alt="">'; };
  const AR_S = '<svg viewBox="0 0 24 24"><path d="M5 19 19 5M9.5 5H19v9.5"/></svg>';
  const AR_Z = '<svg viewBox="0 0 32 24"><path d="M2 21l8-8 5 5 11-11M18.5 7H26v7.5"/></svg>';
  /* [chap%, tepa%, eni px, kechikish s, dx px, dy px, rang, zigzagmi] */
  const AR = [[12,18,44,0,48,-40,'w',0],[70,56,40,.2,42,-36,'g',0],[48,66,78,.45,50,-40,'w',1],[27,0,36,.9,40,-34,'g',0],
              [0,32,72,1.4,48,-38,'g',1],[78,38,38,2.1,40,-34,'w',0],[44,-6,32,2.55,36,-30,'g',0]];
  const SL = [[62,40,1.9,.3],[74,27,2.2,1.2],[52,22,2,2.1]];
  /* [chap%, tepa%, o'lcham px, kechikish s] — hero bo'ylab tarqalgan */
  const SP = [[6,18,8,0],[17,72,11,1.1],[27,6,7,2.4],[33,90,9,3.3],[70,5,9,.5],[79,86,8,1.8],[89,30,13,2.9],[95,62,8,4.1],[58,96,7,3.8],[3,50,6,4.5],[92,9,6,1.5]];
  const nz = L.flame;
  return '<div class="sz-hero">' +
    SP.map(function(s){ return '<svg class="sz-sp" viewBox="0 0 24 24" style="left:' + s[0] + '%;top:' + s[1] + '%;width:' + s[2] + 'px;height:' + s[2] + 'px;animation-delay:' + s[3] + 's"><path d="M12 1.5c.7 5.9 3.5 9 10.5 10.5-7 1.5-9.8 4.6-10.5 10.5C11.3 16.6 8.5 13.5 1.5 12 8.5 10.5 11.3 7.4 12 1.5z"/></svg>'; }).join('') +
    '<div class="sz-rk" style="aspect-ratio:' + SZ_RK.W + '/' + SZ_RK.H + '"><i class="sz-glow"></i>' +
      img('c2', 'sz-c c2') + img('c3', 'sz-c c3') +
      SL.map(function(s){ return '<i class="sz-sl" style="left:' + s[0] + '%;top:' + s[1] + '%;animation-duration:' + s[2] + 's;animation-delay:' + s[3] + 's"></i>'; }).join('') +
      AR.map(function(a){ return '<span class="sz-ar ' + a[6] + (a[7] ? ' z' : '') + '" style="left:' + a[0] + '%;top:' + a[1] + '%;width:' + a[2] + 'px;height:' + Math.round(a[2] * (a[7] ? .75 : 1)) +
        'px;animation-delay:' + a[3] + 's;--dx:' + a[4] + 'px;--dy:' + a[5] + 'px">' + (a[7] ? AR_Z : AR_S) + '</span>'; }).join('') +
      '<div class="sz-fly">' +
        '<div class="sz-thr" style="' + box('flame') + ';transform-origin:' + nz.ox + '% ' + nz.oy + '%">' +
          '<img class="sz-flame" src="' + src('flame') + '" style="transform-origin:' + nz.ox + '% ' + nz.oy + '%" alt=""></div>' +
        img('body', 'sz-body') +
        '<div class="sz-gl" style="' + box('body') + ';-webkit-mask-image:url(' + src('body') + ');mask-image:url(' + src('body') + ')"><i></i></div>' +
      '</div>' + img('c1', 'sz-c c1') +
    '</div></div>';
}
/* Ochkolar: xarid va sotuv serverdagi tarixdan; so'mdagi summa joriy
   GRAM kursida hisoblanadi. Referal va vazifa ochkolari — server bosqichida. */
function szCalc(){
  const from = (szTab === 'season' && SZ_START) ? Date.parse(SZ_START) : 0;
  const rate = Number(gramSomRate) || 0;
  const gram = function(r){ const a = Number(r.amount) || 0; return r.cur === 'GRAM' ? a : (rate > 0 ? a / rate : 0); };
  const s = { bN:0, bP:0, sN:0, sP:0, rN:szRefN, rP:0, tN:0, tP:0 };
  (nftHist || []).forEach(function(r){
    if(from && (Date.parse(r.at) || 0) < from) return;
    if(r.kind === 'nft_buy' && r.note){ s.bN++; s.bP += gram(r) * SZ_BUY; }
    else if(r.kind === 'nft_sell'){ s.sN++; s.sP += gram(r) * SZ_SELL; }
  });
  s.bP = Math.floor(s.bP); s.sP = Math.floor(s.sP);
  s.total = s.bP + s.sP + s.rP + s.tP;
  return s;
}
function szRow(k, n, ic, p){

}

/* Keyingi yangilanishgacha qolgan vaqt: har kuni Toshkent vaqti bilan 00:00 */
function szLeft(){
  const off = 5 * 3600e3, now = Date.now();
  const next = (Math.floor((now + off) / 864e5) + 1) * 864e5 - off;
  const s = Math.max(0, Math.floor((next - now) / 1000)), p = function(n){ return String(n).padStart(2, '0'); };
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
}

/* ---------- Taklif havolasi va ro'yxat: bosh sahifa / NFT bo'limi ----------
   Bosh sahifadagi havola hech o'zgarmaydi (ref_<id>). NFT bo'limidan olingan
   havolaning oxirida bitta "n" bo'ladi (ref_<id>n) — server kim qaysi
   bo'limdan kelganini shu bilan ajratadi. Ikkalasi ham o'sha botga olib boradi
   va taklif o'sha odamga yoziladi. Server buni tanishi (/refs javobida srcOk)
   bilinmaguncha NFT bo'limi ham oddiy havolani beradi — taklif yo'qolmaydi. */
var refTab = '', refLast = null, refSrcOk = false;
try{ refSrcOk = localStorage.getItem('mt_refsrc') === '1'; }catch(e){}
function refSrcSet(){ if(refSrcOk) return; refSrcOk = true; try{ localStorage.setItem('mt_refsrc', '1'); }catch(e){} }
function refLink(src){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid) return 'https://t.me/' + BOT_USERNAME;
  return 'https://t.me/' + BOT_USERNAME + '?start=ref_' + uid + ((src === 'nft' && refSrcOk) ? 'n' : '');
}
function refRowsHtml(p){
  const L = p.list || [], PL = p.pendList || [], GL = p.leftList || [];
  const av = function(x){ return '<img src="' + VBASE + '/avatar?id=' + encodeURIComponent(x.id) + '" loading="lazy" onerror="this.remove()">'; };
  const rows = L.map(function(x){
    const nm = x.nm || 'Foydalanuvchi';
    const un = x.un ? '@' + x.un : ('id ' + x.id);
    const dt = x.at ? new Date(x.at).toLocaleDateString('ru-RU') : '';
    const click = x.un ? ' onclick="openTg(\'' + esc(x.un) + '\')"' : '';
    return '<div class="ref-row' + (x.un ? ' tap' : '') + '"' + click + '>'
         + '<div class="ref-av"><span>' + esc(nm.charAt(0).toUpperCase()) + '</span>' + av(x) + '</div>'
         + '<div class="ref-nm"><div class="a">' + esc(nm) + '</div>'
         + '<div class="b">' + esc(un) + (dt ? ' \u00B7 ' + dt : '') + '</div></div>'
         + '<div class="ref-c">' + (x.orders || 0) + (x.un ? ' \u203A' : '') + '</div></div>';
  }).join('');
  const dim = function(x){
    const nm = x.nm || 'Foydalanuvchi', un = x.un ? '@' + x.un : ('id ' + x.id);
    return '<div class="ref-row gone"><div class="ref-av"><span>' + esc(nm.charAt(0).toUpperCase()) + '</span>' + av(x) + '</div>'
         + '<div class="ref-nm"><div class="a">' + esc(nm) + '</div><div class="b">' + esc(un) + '</div></div></div>';
  };
  let out = '';
  if(L.length) out += '<div class="ref-head">Taklif qilinganlar <span>' + (p.count || L.length) + '</span></div>' + rows;
  if(PL.length) out += '<div class="ref-head gone-h">Botga Start bosmagan <span>' + (p.pending || PL.length) + '</span></div>' + PL.map(dim).join('');
  if(GL.length) out += '<div class="ref-head gone-h">Botdan chiqib ketganlar <span>' + (p.gone || GL.length) + '</span></div>' + GL.map(dim).join('');
  return out;
}
/* Ikki bo'lim: "Bosh sahifadan" va "NFT bo'limidan". NFT ekranlarida NFT
   bo'limi, bosh sahifada bosh sahifa ochiq turadi — boshqasiga bir bosishda o'tiladi. */
function refTabsDraw(){
  const box = document.getElementById('refBox'), d = refLast;
  if(!box || !d || !d.by) return;
  const M = d.by.main || {}, N = d.by.nft || {};
  const tot = function(p){ return (p.count || 0) + (p.pending || 0) + (p.gone || 0); };
  if(!tot(M) && !tot(N)) return;
  const tab = refTab || (isNftView(view) ? 'nft' : 'main');
  const P = tab === 'nft' ? N : M;
  box.innerHTML = '<div class="ref-seg">' +
      '<button class="' + (tab === 'main' ? 'on' : '') + '" onclick="refSetTab(\'main\')">Bosh sahifadan<b>' + (M.count || 0) + '</b></button>' +
      '<button class="' + (tab === 'nft' ? 'on' : '') + '" onclick="refSetTab(\'nft\')">NFT bo\'limidan<b>' + (N.count || 0) + '</b></button></div>' +
    (tot(P) ? refRowsHtml(P) : '<div class="ref-none">' + (tab === 'nft'
        ? "NFT bo'limidagi havola orqali hali hech kim qo'shilmagan."
        : "Bosh sahifadagi havola orqali hali hech kim qo'shilmagan.") + '</div>');
  box.className = 'ref-list';
}
function refSetTab(t){ haptic(); refTab = t; refTabsDraw(); try{ pf2Clip(); }catch(e){} }
function refCheckLater(d){
  if(d.checking > 0 && document.getElementById('refBox')){
    if(refTimer) clearTimeout(refTimer);
    refTimer = setTimeout(function(){ refTimer = null; loadRefs(true); }, Math.min(20000, 1500 + d.checking * 130));
  }
}
