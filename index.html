/* Tutqichdan pastga surib yopish.
   Barmoq bilan birga silliq harakatlanadi: surish paytida animatsiya
   o'chiriladi (aks holda har harakatda u qarshilik qilib qotardi) va
   yangilanish kadrga bog'lanadi. */
let hwY = -1, hwD = 0, hwRaf = 0, hwGo = false;
function hwDragStart(e){
  const sh = document.getElementById('hwSh'); if(!sh) return;
  hwY = e.touches[0].clientY; hwD = 0; hwGo = false;
  sh.classList.add('drag');
}
function hwDragMove(e){
  if(hwY < 0) return;
  const d  = e.touches[0].clientY - hwY;
  /* Orqadagi sahifa birga surilib ketmasin */
  if(e.cancelable) e.preventDefault();
  const sc = document.querySelector('#hwSh .hw-scroll');
  /* Ichkarida aylantirish ustun: ro'yxat tepasida turib pastga
     tortilgandagina varaqning o'zi harakatlanadi. */
  if(!hwGo){
    if(d > 6 && (!sc || sc.scrollTop <= 0)) hwGo = true;
    else if(d < -6 || (sc && sc.scrollTop > 0)){ hwY = -1; 
      const s0 = document.getElementById('hwSh'); if(s0) s0.classList.remove('drag');
      return; }
    else return;
  }
  hwD = d < 0 ? 0 : d;
  if(hwRaf) return;
  hwRaf = requestAnimationFrame(function(){
    hwRaf = 0;
    const sh = document.getElementById('hwSh');
    if(sh) sh.style.transform = 'translateY(' + hwD + 'px)';
  });
}
function hwDragEnd(){
  const sh = document.getElementById('hwSh');
  if(hwY < 0 || !sh) return;
  hwY = -1;
  if(hwRaf){ cancelAnimationFrame(hwRaf); hwRaf = 0; }
  /* Qaytish yoki yopilish yumshoq bo'lsin — masofaga qarab vaqt beriladi */
  sh.classList.remove('drag');
  sh.style.transition = 'transform .42s cubic-bezier(.22,.88,.28,1)';
  sh.style.transform  = '';
  setTimeout(function(){ if(sh) sh.style.transition = ''; }, 460);
  if(hwD > 90) mgHowClose();
  hwD = 0; hwGo = false;
}
function mgHowClose(){
  const sh = document.getElementById('hwSh'), bg = document.getElementById('hwBg');
  if(sh) sh.classList.remove('on');
  if(bg) bg.classList.remove('on');
  document.body.classList.remove('sheet-lock');

}

   bilan) va serverdagi NFT voqealari (sotib olish, sotish, qabul qilish, yuborish,

var mhQ = '', mhType = 'all', mhSort = 'date', mhPer = 0, mhHistTry = false;
const MH_TYPES = [['all','Hammasi'],['buy','Sotib olingan'],['sell','Sotilgan'],['in','Qabul qilingan'],['out','Yuborilgan'],['offer','Takliflar']];
const MH_SORT  = [['date',"Sana bo'yicha"],['hi','Qimmatdan arzonga'],['lo','Arzondan qimmatga']];

/* Yuqoridagi aylanma bannerlar.
   Rasmlar boshqa papkada tursa faqat BANNER_BASE ni o'zgartiring. */
/* Rasmlar Vercel'da emas, VPS'da turadi. Bu funksiya har qanday
   "/rasm.png" havolasini to'liq manzilga aylantiradi. Havola allaqachon
   to'liq bo'lsa yoki bo'sh bo'lsa — tegilmaydi. */
const IMG_BASE = 'https://api.minatoh.uz/img/';
function IMG(p){
  const s = String(p == null ? '' : p);
  if(!s) return '';
  if(/^(https?:|data:|blob:)/i.test(s)) return s;
  return IMG_BASE + s.replace(/^\/+/, '');
}
const BANNER_BASE = '';
const BANNERS = ['banner-x1.webp','banner-x2.webp','banner-x3.webp','banner-x4.webp'];
let mktTab = 'all';        /* all | cols | stars */
const MKT_GAP  = 10;       /* rasmlar orasidagi bo'shliq, CSS bilan bir xil */
const MKT_MS   = 1150;     /* avtomatik o'tish davomiyligi */
const MKT_WAIT = 3000;     /* rasm qancha turadi */
const MKT_REP  = 9;        /* to'plam necha marta takrorlanadi */
const MKT_MID  = 4;        /* qaysi nusxa "markaz" hisoblanadi */
let mktBanT = null, mktBanHold = 0, mktBusy = false, mktTouch = false, mktSettle = null;

function setMktTab(t){
  haptic();
  mktTab = t;
  const tabs = document.getElementById('mktTabs');
  const box  = document.getElementById('mktBody');
  if(!tabs || !box){ renderNftMarket(); return; }
  /* bannerga tegmaymiz — u o'z ishini davom ettiraveradi */
  [].slice.call(tabs.querySelectorAll('button')).forEach(function(b){
    b.classList.toggle('on', b.dataset.t === t);
  });
  mktBodyDraw();
}
function mktBanFail(){
  const b = document.getElementById('mktBan');
  if(b) b.style.display = 'none';
  clearInterval(mktBanT); mktBanT = null;
}
function mktStepPx(r){
  const f = r.querySelector('img'); if(!f) return 0;
  return f.getBoundingClientRect().width + MKT_GAP;
}
/* Ko'rinayotgan rasmni saqlagan holda tasmani markazga qaytaradi.
   Kasr qismi ham saqlanadi, shuning uchun harakat o'rtasida chaqirilsa ham
   ko'zga hech narsa sezilmaydi — o'sha o'rinda aynan o'sha rasm turadi. */
/* Qaysi rasmda turganini eslab qolamiz — bo'lim qaytadan chizilganda
   karusel boshiga sakramasin. Faqat foydalanuvchi o'zi surganda yoki
   vaqt o'tib o'zi almashganda o'zgaradi. */
let mktIdx = 0;
function mktRemember(r){
  if(!r) return;
  const step = mktStepPx(r); if(!step) return;
  if(r.scrollLeft < 1) return;          /* hali joylashmagan — tegmaymiz */
  const n = BANNERS.length;
  const i = Math.round(r.scrollLeft / step);
  mktIdx = ((i % n) + n) % n;
}
function mktFixNow(r){
  if(mktBusy) return;
  const step = mktStepPx(r); if(!step) return;
  const n = BANNERS.length;
  const f = r.scrollLeft / step;
  const i = Math.floor(f), frac = f - i;
  const cur = ((i % n) + n) % n;
  mktIdx = cur;
  const want = MKT_MID * n + cur;
  if(i !== want) r.scrollLeft = (want + frac) * step;
}
function mktFix(){
  const r = document.getElementById('mktRail');
  if(!r || mktBusy || mktTouch) return;
  mktFixNow(r);
}
/* Avtomatik o'tish — brauzerning "smooth" i keskin to'xtagani uchun o'zimiz yuritamiz */
function mktAnim(r, to, done){
  const from = r.scrollLeft, d = to - from;
  if(Math.abs(d) < 1){ r.scrollLeft = to; if(done) done(); return; }
  const t0 = performance.now();
  r.style.scrollSnapType = 'none';
  const tick = function(now){
    const p = Math.min((now - t0) / MKT_MS, 1);
    const e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
    r.scrollLeft = from + d * e;
    if(p < 1) requestAnimationFrame(tick);
    else { r.scrollLeft = to; if(done) done(); r.style.scrollSnapType = ''; }
  };
  requestAnimationFrame(tick);
}
function mktBanStep(){
  const r = document.getElementById('mktRail');
  if(!r){ clearInterval(mktBanT); mktBanT = null; return; }
  if(mktBusy || mktTouch || Date.now() < mktBanHold) return;
  const step = mktStepPx(r); if(!step) return;
  const i = Math.round(r.scrollLeft / step);
  mktBusy = true;
  mktAnim(r, (i + 1) * step, function(){ mktBusy = false; mktRemember(r); mktFix(); });
}
function mktBanStart(){
  const r = document.getElementById('mktRail');
  if(!r || BANNERS.length < 2){ clearInterval(mktBanT); mktBanT = null; return; }
  /* Karusel allaqachon yurib turgan bo'lsa — tegmaymiz. Aks holda har tugma
     bosilganda taymer noldan boshlanar va tez-tez bosilsa umuman ishlamasdi. */
  if(r.dataset.ban === '1' && mktBanT) return;
  clearInterval(mktBanT); mktBanT = null;
  mktBanHold = 0; mktBusy = false; mktTouch = false;
  const home = MKT_MID * BANNERS.length + mktIdx;   /* eslab qolingan rasmdan davom etamiz */
  const put = function(){ const s = mktStepPx(r); if(s && r.scrollLeft < 1) r.scrollLeft = home * s; };
  put(); setTimeout(put, 80); setTimeout(put, 400);

  const settle = function(){ clearTimeout(mktSettle); mktSettle = setTimeout(mktFix, 130); };
  /* Bu element uchun tinglovchilar allaqachon qo'yilgan bo'lsa takrorlamaymiz —
     aks holda har qayta chizilishda ular to'planib ketadi. */
  if(r.dataset.ban === '1'){ mktBanT = setInterval(mktBanStep, MKT_WAIT + MKT_MS); return; }
  r.dataset.ban = '1';   /* bu element uchun tinglovchilar bir marta qo'yiladi */
  /* Barmoq tekkan lahzada markazga qaytaramiz. Bu paytda inersiya baribir
     to'xtaydi, shuning uchun hech narsa yo'qotilmaydi — har yangi surishda
     ikkala tomonga to'liq zaxira bo'ladi. */
  r.addEventListener('touchstart', function(){
    mktFixNow(r);
    mktTouch = true;
    mktBanHold = Date.now() + 6e5;
  }, {passive:true});
  const off = function(){ mktTouch = false; mktBanHold = Date.now() + MKT_WAIT; settle(); };
  r.addEventListener('touchend', off, {passive:true});
  r.addEventListener('touchcancel', off, {passive:true});
  r.addEventListener('scroll', function(){ if(!mktBusy && !mktTouch) settle(); }, {passive:true});
  mktBanT = setInterval(mktBanStep, MKT_WAIT + MKT_MS);
}
function mktBanner(){
  let list = [];
  for(let k = 0; k < MKT_REP; k++) list = list.concat(BANNERS);
  const slides = list.map(function(f){
    return `<img src="${IMG_BASE}${BANNER_BASE}${f}" alt="" decoding="async" onerror="mktBanFail()">`;
  }).join('');
  return `<div class="mkt-ban" id="mktBan"><div class="rail" id="mktRail">${slides}</div></div>`;
}

function renderNftMarket(){
  /* Bozor doim yangi bo'lsin: boshqa odam sotuvga qo'ygani darrov ko'rinsin */
  setTimeout(function(){ try{ mktLoad(); }catch(e){} }, 0);
  /* Karuselni qayta qurmaymiz — eski elementni saqlab qolib, yangi
     sahifaga o'zini qo'yamiz. Shunda rasm ham, joyi ham, yurishi ham
     buzilmaydi: miltillash va boshiga qaytish bo'lmaydi. */
  const oldBan = document.getElementById('mktBan');
  let keepBan = null, keepSl = 0;
  if(oldBan){
    const rr = document.getElementById('mktRail');
    keepSl = rr ? rr.scrollLeft : 0;
    if(rr) mktRemember(rr);
    keepBan = oldBan;
    oldBan.remove();

/* ---------- NFT tarixi: endi SERVERDA ----------
   Ilgari telefonda turardi — mijoz keshni tozalasa yo'qolardi va
   nizo chiqsa dalil bo'lmasdi. Endi server saqlaydi. */
let nftHist = [], nftHistLoaded = false;
function nftHistLoad(cb){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid){ if(cb) cb(); return; }
  fetch(VBASE + '/nft/hist?id=' + encodeURIComponent(uid))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok && Array.isArray(d.rows)){ nftHist = d.rows; nftHistLoaded = true; }
      if(view === 'nft_hist') renderNft('nft_hist');
      if(cb) cb();
    }).catch(function(){ if(cb) cb(); });
}
/* Bosh sahifadagi refreshStatus() bilan bir xil his: tugma darhol "Tekshirilmoqda"
   ga o'tadi va ikonka aylanadi, kamida 0.6 s turadi, keyin yangilangan ro'yxat.
   Holat bayroqda saqlanadi - ma'lumot kelib sahifa oraliqda qayta chizilsa ham
   tugma vaqtidan oldin "o'chib" qolmaydi. */
var nftRefBusy = false;
function nftRefresh(){
  if(nftRefBusy) return;
  haptic('medium');
  nftRefBusy = true;
  const b = document.querySelector('#app .refresh-btn');
  if(b){
    b.classList.add('busy');
    const t = b.childNodes[b.childNodes.length - 1];
    if(t && t.nodeType === 3) t.nodeValue = tr("Tekshirilmoqda");
  }
  const t0 = Date.now();
  let left = 2, fin = false;
  const end = function(){
    if(fin) return; fin = true;
    setTimeout(function(){
      nftRefBusy = false;
      notify('success');
      if(view === 'nft_hist') renderNft('nft_hist');
    }, Math.max(0, 600 - (Date.now() - t0)));
  };
  const one = function(){ if(--left <= 0) end(); };
  nftHistLoad(one);
  nftLoad(one);
  setTimeout(end, 9000);          /* tarmoq osilsa ham tugma abadiy aylanmasin */
}

function nftMoneyRows(){
  const dt = function(v){ return new Date(v||Date.now()).toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
  const badge = function(status, okTxt){
    const ok  = status === 'done';
    const bad = (status === 'cancel' || status === 'expired');
    const lbl = ok ? okTxt : bad ? 'Bekor qilingan' : 'Kutilmoqda';
    const style = bad ? ' style="color:#FF6B6B;background:rgba(255,107,107,.14)"' : '';
    return `<span class="badge-st ${ok?'done':'wait'}"${style}>${lbl}</span>`;
  };

  /* Kirim va chiqimlarni serverdagi yagona tarixdan ajratamiz */
  /* Bu yerda faqat PUL harakati: to'ldirish va yechish.
     Sotib olishlar "Sovg'alarim" ustidagi tarixda ko'rinadi. */
  const IN  = ['gram_in','som_in','offer_back'];
  const OUT = ['gram_out','som_out','offer_hold'];
  const ICO = { gram_in:'\uD83D\uDC8E', gram_out:'\uD83D\uDC8E', som_in:'\uD83C\uDF81',
                som_out:'\uD83C\uDFE7', nft_buy:'\uD83D\uDED2', nft_sell:'\uD83C\uDF81',
                offer_hold:'\uD83D\uDCE8', offer_back:'\u21A9\uFE0F' };
  const TTL = { gram_in:"GRAM to'ldirildi", gram_out:'GRAM yechildi',
                som_in:"So'm tushdi", som_out:"So'm yechildi",
                nft_buy:'NFT sotib olindi', nft_sell:'NFT sotildi',
                offer_hold:'Taklif uchun bloklandi', offer_back:'Taklif puli qaytdi' };

  if(nftHTab === 'in'){
    const rows = nftHist.filter(function(r){ return IN.indexOf(r.kind) > -1; });
    if(!rows.length) return `<div class="empty"><div class="em">\uD83C\uDF81</div><h3>Hozircha bo'sh</h3><p>Hisobingizga tushgan pul shu yerda ko'rinadi.</p></div>`;
    nhBind(); return (nhShown = rows).map(function(r, i){
      const cur = r.cur || "so'm";
      const amt = cur === 'GRAM' ? fmtGram(r.amount) : fmt(r.amount);
      return `<div class="order" onclick="hdOpen('nh',${i})">
        <div class="top">
          <div class="g"><div class="ic">${nhIcon(r)}</div><div><div class="nm">${esc(r.item || TTL[r.kind] || 'Kirim')}</div><div class="sub">${esc(r.note||'')}</div></div></div>
          <div class="price" style="color:#4FE0A0">+${amt}<small>${cur}</small></div>
        </div>
        <div class="sep"></div>
        <div class="kv"><span class="k">Holat</span>${badge(r.status,'Hisobga tushdi')}</div>
        <div class="date">${dt(r.at)}</div>
      </div>`;
    }).join('');
  }

  const rows = nftHist.filter(function(r){ return OUT.indexOf(r.kind) > -1; });
  if(!rows.length) return `<div class="empty"><div class="em">🏧</div><h3>Hozircha bo'sh</h3><p>Kartangizga yechib olganlaringiz shu yerda ko'rinadi.</p></div>`;
  nhBind(); return (nhShown = rows).map(function(r, i){
    const cur = r.cur || "so'm";
    const amt = cur === 'GRAM' ? fmtGram(r.amount) : fmt(r.amount);
    return `<div class="order" onclick="hdOpen('nh',${i})">
      <div class="top">
        <div class="g"><div class="ic">${nhIcon(r)}</div><div><div class="nm">${esc(r.item || r.card || TTL[r.kind] || 'Chiqim')}</div><div class="sub">${esc(r.note||'')}</div></div></div>
        <div class="price">-${amt}<small>${cur}</small></div>
      </div>
      <div class="sep"></div>
      <div class="kv"><span class="k">Holat</span>${badge(r.status,'Bajarildi')}</div>
      <div class="date">${dt(r.at)}</div>
    </div>`;
  }).join('');
}

/* Miqdorni tozalab yozamiz */
function ocIn(el){
  el.value = String(el.value).replace(/[^0-9.,]/g, '').replace(',', '.');
  ocSync();
}
function ocSet(v){ haptic(); const el = document.getElementById('ocAmt'); if(el){ el.value = String(v); ocSync(); } }
function ocMax(){
  haptic();
  const el = document.getElementById('ocAmt'); if(!el) return;
  const left = Math.max(0, Math.floor((getGram() - 0.01) * 1000) / 1000);
  el.value = String(left);
  ocSync();
}
/* Ulangan hamyon manzilini qo'yamiz */
function ocMine(){
  haptic();
  if(!tcAddr){ toast('Avval hamyonni ulang'); return; }
  const el = document.getElementById('otAddr');
  if(el){ el.value = tcAddr; ocSync(); }
}
/* Tugma faqat hammasi to'g'ri bo'lganda yonadi */
function ocSync(){
  const a = document.getElementById('otAddr');
  const m = document.getElementById('ocAmt');
  const g = document.getElementById('ocGo');
  if(!g) return;
  const addr = a ? String(a.value).trim() : '';
  const amt  = m ? Number(String(m.value).replace(',', '.')) : 0;
  const okA  = /^[A-Za-z0-9_-]{48}$/.test(addr) || /^0:[0-9a-fA-F]{64}$/.test(addr);
  const okM  = amt > 0 && (amt + 0.01) <= getGram();
  g.disabled = !(okA && okM);
}
let ocBusy = false;
function ocSend(){
  if(ocBusy) return;
  haptic();
  const addr = String(document.getElementById('otAddr').value).trim();
  const amt  = Number(String(document.getElementById('ocAmt').value).replace(',', '.'));
  /* Face ID yoqilgan bo'lsa so'raladi */
  bioAsk(function(){
    ocBusy = true;
    const g = document.getElementById('ocGo');
    if(g){ g.disabled = true; g.textContent = 'Yuborilmoqda…'; }
    fetch(VBASE + '/gram/out', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg.initData || '', to: addr, amount: amt })
    }).then(function(r){ return r.json(); }).then(function(d){
      ocBusy = false;
      if(g){ g.textContent = 'Chiqarib olish'; }
      if(d && d.ok){
        setGram(d.left);
        notify('success');
        toast('Yuborildi: ' + fmtGram(d.sent) + ' GRAM');
        nftHistLoad();
        nftLoad();
        go('nft_wallet');
        return;
      }
      if(g) g.disabled = false;
      if(!d) return toast('Aloqa yo\'q');
      if(d.error === 'low')  return toast('Mablag\' yetarli emas');
      if(d.error === 'max')  return toast('Bittada eng ko\'pi ' + d.max + ' GRAM');
      if(d.error === 'day')  return toast('Kunlik chegara: ' + d.day + ' GRAM');
      if(d.error === 'addr') return toast('Manzil noto\'g\'ri');
      if(d.error === 'off')  return toast('Chiqarish vaqtincha yopiq');
      if(d.error === 'wallet' || d.error === 'send'){
        notify('error');
        nftLoad();          /* qaytarilgan pul darrov ko'rinsin */
        return toastErr('Chiqarish amalga oshmadi \u2014 pul qaytarildi. ' +
                        '10 daqiqadan keyin urinib ko\'ring.');
      }
      toast('Bajarilmadi');
    }).catch(function(){
      ocBusy = false;
      if(g){ g.disabled = false; g.textContent = 'Chiqarib olish'; }
      toast('Aloqa yo\'q');
    });
  });
}

/* ---------- Stars: username tekshiruvi ---------- */
let soWhoT = null, soWhoOk = false, soWhoLast = '', soBusy = false;
function soBox(x){ const b = document.getElementById('soWho'); if(b) b.innerHTML = x; }
function soMe(){
  haptic();
  if(!(tgUser && tgUser.username)){ toast('Sizda username yo\'q'); return; }
  const el = document.getElementById('soUser');
  if(el){ el.value = '@' + tgUser.username; soUserIn(); }
}
function soUserIn(){
  const raw = ((document.getElementById('soUser')||{}).value || '').trim().replace(/^@+/, '');
  soWhoOk = false; clearTimeout(soWhoT);
  if(!raw){ soBox(''); soWhoLast = ''; soSync(); return; }
  if(!/^[A-Za-z0-9_]{4,32}$/.test(raw)){
    soBox('<div class="sp-bad">Username kamida 4 ta belgi, faqat harf, raqam va _</div>');
    soWhoLast = ''; soSync(); return;
  }
  soBox('<div class="sp-wait">Tekshirilmoqda\u2026</div>');
  soWhoT = setTimeout(function(){ soWhoGo(raw); }, 550);
  soSync();
}
function soWhoGo(u){
  fetch(VBASE + '/tg/user?u=' + encodeURIComponent(u))
    .then(function(r){ return r.json(); })
    .then(function(d){
      const now = ((document.getElementById('soUser')||{}).value || '').trim().replace(/^@+/, '');
      if(now.toLowerCase() !== u.toLowerCase()) return;
      if(d && d.ok && d.found){
        soWhoOk = true; soWhoLast = u;
        const av  = d.id ? (VBASE + '/avatar?id=' + encodeURIComponent(d.id)) : '';
        const own = !!(tgUser && tgUser.username &&
                       u.toLowerCase() === String(tgUser.username).toLowerCase());
        soBox('<div class="sp-ok">' +
          (av ? '<img src="' + av + '" alt="" onerror="this.style.display=\'none\'">'
              : '<span class="ph">' + esc(d.name.slice(0,1).toUpperCase()) + '</span>') +
          '<div class="tx"><b>' + esc(d.name) + '</b><small>' +
          (own ? 'Sizning akkauntingiz' : 'Shu akkauntga tushadi') + '</small></div></div>');
      } else if(d && d.why === 'not_user'){
        soWhoOk = false; soWhoLast = '';
        soBox('<div class="sp-bad">Bu kanal yoki guruh \u2014 foydalanuvchi emas</div>');
      } else if(d && d.why === 'is_bot'){
        soWhoOk = false; soWhoLast = '';
        soBox('<div class="sp-bad">Bu bot \u2014 Stars yuborib bo\'lmaydi</div>');
      } else if(d && d.why === 'none'){
        soWhoOk = false; soWhoLast = '';
        soBox('<div class="sp-bad">Bunday foydalanuvchi topilmadi</div>');
      } else {
        soWhoOk = true; soWhoLast = u;
        soBox('<div class="sp-warn">Tekshirib bo\'lmadi \u2014 username to\'g\'riligiga ' +
              'ishonch hosil qiling.</div>');

/* Narxni GRAM'da hisoblab ko'rsatamiz */
function soSync(){
  const n = parseInt((document.getElementById('stAmt')||{}).value || '0', 10) || 0;
  const g = document.getElementById('stGo');
  const c = document.getElementById('soCost');
  const gram = n >= SP_MIN ? somToGram(starPrice(n)) : 0;
  if(c){
    c.innerHTML = (n >= SP_MIN && gram)
      ? ('Narxi: <b>' + fmtGram(gram) + ' GRAM</b> \u00b7 balans ' + fmtGram(getGram()) + ' GRAM')
      : ('Mavjud balans: ' + fmtGram(getGram()) + ' GRAM');
  }
  if(g) g.disabled = !(soWhoOk && n >= SP_MIN && gram > 0 && gram <= getGram());
}
function soBuy(){
  if(soBusy) return;
  haptic();
  const n = parseInt((document.getElementById('stAmt')||{}).value || '0', 10) || 0;
  const u = ((document.getElementById('soUser')||{}).value || '').trim().replace(/^@+/, '');
  if(n < SP_MIN){ toast('Eng kami ' + SP_MIN + ' Stars'); return; }
  if(!soWhoOk || u.toLowerCase() !== soWhoLast.toLowerCase()){
    toast('Avval username tekshirilsin'); return;
  }
  const som  = starPrice(n);
  const gram = somToGram(som);
  if(!(gram > 0)){ toast('Kurs olinmadi, qayta urining'); return; }
  if(gram > getGram()){ toast('GRAM yetarli emas'); return; }

  bioAsk(function(){
    soBusy = true;
    const b = document.getElementById('stGo');
    if(b){ b.disabled = true; b.textContent = 'Yuborilmoqda\u2026'; }
    fetch(VBASE + '/order', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: (tg && tg.initData) || '', order: {
        id:'MT'+Date.now().toString().slice(-8),
        game:'TG STARS', gameId:'tgstars', glyph:'\u2B50',
        package: n + ' \u2B50', price: som, oid:'', qty: n,
        details:{ username:'@' + u },
        pay:'gram', gram: gram,
        tgUser: tgUser ? { id:tgUser.id, username:tgUser.username, name:tgUser.first_name } : null,
        status:'wait', createdAt:new Date().toISOString()
      }})
    }).then(function(r){ return r.json(); }).then(function(d){
      soBusy = false;
      if(b) b.textContent = 'Sotib olish';
      if(d && d.ok){
        if(typeof d.gram === 'number') setGram(d.gram);
        notify('success'); toastOk('\u2705 Buyurtma qabul qilindi');
        nftHistLoad();
        if(typeof loadOrders === 'function') loadOrders();
        mgTab = 'history';
        setTimeout(function(){ go('nft_gifts'); }, 700);
        return;
      }
      if(b) b.disabled = false;
      notify('error');
      toastErr((d && d.error === 'balance') ? 'GRAM yetarli emas' : 'Bajarilmadi');
    }).catch(function(){
      soBusy = false;
      if(b){ b.disabled = false; b.textContent = 'Sotib olish'; }
      toastErr('Aloqa yo\'q');
    });
  });
}

/* ===== GRAM hamyoni — so'm hamyonidan BUTUNLAY alohida =====
   So'm karta orqali to'ldiriladi, GRAM esa ulangan kripto hamyon orqali.
   Ikkalasi bir-biriga aylanmaydi, hech qanday bog'liqligi yo'q. */
const GRAM_ICON = '<svg viewBox="0 0 24 24"><path d="M12 2.5 21 9l-9 12.5L3 9z"/></svg>';
let gramFrom = 'nft_market';
/* ---------- NFT hamyonlari: endi SERVERDA ----------
   Ilgari bu qiymatlar telefonda (localStorage) turardi. U yerda ularni
   har kim o'zgartira olardi va telefon tozalansa pul yo'qolardi.
   Endi server saqlaydi, bu yerda faqat oxirgi ko'rsatilgan nusxasi turadi. */
let nftGram = 0, nftSom = 0, nftLoaded = false;
function getGram(){ return nftGram; }
/* NFT bo'limining o'z so'm hamyoni. Bosh sahifadagi balans bilan HECH QANDAY
   aloqasi yo'q — u yerdagi pul u yerda qoladi va chiqarib bo'lmaydi. */
function getNftSom(){ return nftSom; }
/* Yozish endi faqat serverda bo'ladi. Bu ikkovi ko'rsatkichni darrov
   yangilash uchun qoldi — haqiqiy qiymatni server belgilaydi. */
function setNftSom(v){ nftSom = Number(v) || 0; }
function setGram(v){ nftGram = Number(v) || 0; }

/* Serverdan qoldiqni olamiz */
function nftLoad(cb){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid){ if(cb) cb(); return; }
  fetch(VBASE + '/nft/balance?id=' + encodeURIComponent(uid))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){
        nftGram = Number(d.gram) || 0;
        nftSom  = Number(d.som)  || 0;
        if(Number(d.gramSom) > 0) gramSomRate = Number(d.gramSom);
        nftLoaded = true;
        if(isNftView(view)) nftRepaint();
      }
      if(cb) cb();
    }).catch(function(){ if(cb) cb(); });
}
/* Telefonda qolgan eski qoldiqni bir marta serverga ko'chiramiz */
function nftMigrate(){
  let g = 0, s = 0;
  try{
    g = Number(localStorage.getItem('mt_gram'))    || 0;
    s = Number(localStorage.getItem('mt_nft_som')) || 0;
  }catch(e){}
  if(!(g > 0 || s > 0)){ nftLoad(); return; }
  fetch(VBASE + '/nft/migrate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData: tg.initData || '', gram:g, som:s })
  }).then(function(r){ return r.json(); })
    .then(function(d){
      /* Ko'chirilgach telefondagi nusxani olib tashlaymiz — chalkashmasin */
      try{ localStorage.removeItem('mt_gram'); localStorage.removeItem('mt_nft_som'); }catch(e){}
      if(d && d.ok){ nftGram = Number(d.gram)||0; nftSom = Number(d.som)||0; nftLoaded = true;
                     if(isNftView(view)) nftRepaint(); }
      else nftLoad();
    }).catch(function(){ nftLoad(); });
}
/* NFT ekranlarini qayta chizadi */
function nftRepaint(){
  if(view === 'nft_market')      mktBodyDraw();
  else if(view === 'nft_gifts')  renderNftGifts();
  else if(view === 'nft_wallet') renderWallet();
  else if(view === 'nft_gram')   renderGram();
  else if(view === 'nft_hist')   renderNft('nft_hist');
  else if(view === 'nft_profile') renderNftProfile();
}
function fmtGram(v){
  const n = Number(v) || 0;
  return n % 1 === 0 ? String(n) : n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function openGram(){
  haptic();
  gramFrom = isNftView(view) ? view : 'nft_market';
  go('nft_gram');
}
function grSize(el){
  const n = Math.max(1, String(el.value || '0').length);
  el.style.width = n + 'ch';
}
function grIn(el){
  /* raqam va bitta o'nlik belgi. iPhone ning o'nlik klaviaturasi mintaqaga qarab
     nuqta emas VERGUL chiqaradi - uni ham qabul qilib, nuqtaga aylantiramiz */
  let s = String(el.value).replace(/,/g,'.').replace(/[^0-9.]/g,'');
  const i = s.indexOf('.');
  if(i > -1) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g,'');
  if(s.length > 1 && s[0] === '0' && s[1] !== '.') s = s.replace(/^0+/,'') || '0';
  el.value = s;
  grSize(el);
  const go = document.getElementById('grGo');
  if(go) go.disabled = !(parseFloat(s) > 0);
}

/* ---------- GRAM to'ldirish ----------
   Server noyob summa beradi, hamyon aynan shuni yuboradi.
   Pul kelganini faqat server tasdiqlaydi — ilovaning so'ziga ishonilmaydi. */
let grBusy = false;
function grTop(){
  if(grBusy) return;
  haptic();
  const el = document.getElementById('grAmt');
  const v  = el ? Number(String(el.value).replace(',', '.')) : 0;
  if(!(v > 0)){ toast('Miqdorni kiriting'); return; }
  if(!tcAddr || !tcUI){ toast('Avval hamyonni ulang'); wlConnect(); return; }

  /* Face ID yoqilgan bo'lsa avval tasdiqlatamiz */
  bioAsk(function(){
    grBusy = true;
    const g = document.getElementById('grGo');
    if(g){ g.disabled = true; g.textContent = 'Tayyorlanmoqda…'; }
    fetch(VBASE + '/gram/start', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg.initData || '', amount: v })
    }).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok){
        grBusy = false;
        if(g){ g.disabled = false; g.textContent = "To'ldirish"; }
        if(d && d.error === 'min')  return toast('Eng kami ' + d.min + ' GRAM');
        if(d && d.error === 'off')  return toast('To\'ldirish vaqtincha yopiq');
        return toast('Boshlab bo\'lmadi, qayta urining');
      }
      /* Hamyonga to'lov so'rovi — aynan noyob summa bilan */
      return tcUI.sendTransaction({
        validUntil: Math.floor(Date.now()/1000) + 600,
        messages: [{ address: d.addr, amount: String(d.nano) }]
      }).then(function(){
        if(g) g.textContent = 'Kutilmoqda…';
        toast('Yuborildi. Tasdiqni kutamiz…');
        grWatch(0);
      }).catch(function(){
        grBusy = false;
        if(g){ g.disabled = false; g.textContent = "To'ldirish"; }
        toast('Bekor qilindi');
      });
    }).catch(function(){
      grBusy = false;
      if(g){ g.disabled = false; g.textContent = "To'ldirish"; }
      toast('Aloqa yo\'q');
    });
  });
}
/* Qoldiq o'zgarishini kutamiz — server tasdiqlagach o'zi ko'payadi */
function grWatch(n){
  const was = nftGram;
  nftLoad(function(){
    if(nftGram > was){
      grBusy = false;
      notify('success');
      toast('GRAM qo\'shildi');
      nftHistLoad();
      if(view === 'nft_gram') renderGram();
      return;
    }
    if(n < 40) setTimeout(function(){ grWatch(n + 1); }, 4000);
    else{
      grBusy = false;
      const g = document.getElementById('grGo');
      if(g){ g.disabled = false; g.textContent = "To'ldirish"; }
      toast('Hali kelmadi. Kelganda xabar beramiz.');
    }
  });
}

/* ---------- TON Connect: hamyon ulash ----------
   Hamyonlar ro'yxatini (Telegram Wallet, Tonkeeper, MyTonWallet va h.k.)
   kutubxonaning o'zi rasmiy reyestrdan oladi — biz sanab chiqmaymiz. */
const TC_MANIFEST = 'https://www.minatoh.uz/tonconnect-manifest.json';
let tcUI = null, tcAddr = '';
function tcShort(a){
  const s = String(a || '');
  return s.length > 12 ? (s.slice(0, 6) + '…' + s.slice(-4)) : s;
}
let tcTon = 0, tcGram = 0, tcLoaded = false;
/* Ulangan bo'lsa: "Sizning hamyoningiz · Qusjk9…8f2a" va ko'k katakda GRAM */
function tcLabel(def){
  if(!tcAddr) return esc(def);
  return "Sizning hamyoningiz <b class=\"a\">" + esc(tcShort(tcAddr)) + "</b>" +
         "<span class=\"g\">" + fmtGram(tcGram) + " GRAM</span>";
}
function tcPaint(){
  document.querySelectorAll('[data-wal]').forEach(function(el){
    el.innerHTML = tcLabel(el.dataset.wal);
  });
  /* GRAM ekranida faqat manzil ko'rinadi — qo'shimcha yozuvsiz */
  document.querySelectorAll('[data-wal2]').forEach(function(el){
    el.textContent = tcAddr ? tcShort(tcAddr) : el.dataset.wal2;
  });
}
/* Hamyon qoldig'ini serverdan olamiz (kalit u yerda qoladi) */
function tcLoad(){
  if(!tcAddr){ tcTon = 0; tcGram = 0; tcLoaded = false; tcPaint(); return; }
  fetch(VBASE + '/ton/wallet?addr=' + encodeURIComponent(tcAddr))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){ tcTon = Number(d.ton)||0; tcGram = Number(d.gram)||0; tcLoaded = true; }
      tcPaint(); tcSheetFill();
    }).catch(function(){ tcPaint(); });
}
/* Kutubxonani faqat kerak bo'lganda yuklaymiz */
let tcLoading = null;
function tcLib(){
  if(window.TON_CONNECT_UI) return Promise.resolve(true);
  if(tcLoading) return tcLoading;
  tcLoading = new Promise(function(res){
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js';
    s.onload = function(){ res(!!window.TON_CONNECT_UI); };
    s.onerror = function(){ res(false); };
    document.head.appendChild(s);
  });
  return tcLoading;
}
function tcInit(){
  try{
    if(!window.TON_CONNECT_UI || tcUI) return;

/* ---------- Hamyon tarixi ----------
   Hammasi serverdagi yagona ro'yxatdan olinadi (nftHist) va bo'limlarga
   ajratiladi. Har yozuv qaysi tugmaga tegishli ekani "t" bilan belgilanadi. */
function walletLog(){
  const MAP = {
    som_in:   { t:'top',   ic:'\uD83D\uDCB3', sub:"Hisob to'ldirildi", plus:true  },
    som_out:  { t:'out',   ic:'\uD83C\uDFE7', sub:'Kartaga yechildi',  plus:false },
    gram_in:  { t:'top',   ic:'\uD83D\uDC8E', sub:"GRAM to'ldirildi",  plus:true  },
    gram_out: { t:'out',   ic:'\uD83D\uDC8E', sub:'GRAM yechildi',     plus:false },
    nft_sell: { t:'gifts', ic:'\uD83C\uDF81', sub:'Sotildi',           plus:true  },
    nft_buy:  { t:'gifts', ic:'\uD83D\uDED2', sub:'Sotib olindi',      plus:false },
    gift_in:  { t:'gifts', ic:'\uD83C\uDF81', sub:'Qabul qilindi',     plus:true  },
    gift_out: { t:'gifts', ic:'\uD83D\uDCE4', sub:'Yuborildi',         plus:false },
    offer_hold: { t:'gifts', ic:'\uD83D\uDCE8', sub:'Taklif bloklandi', plus:false },
    offer_back: { t:'gifts', ic:'\u21A9\uFE0F', sub:'Taklif qaytdi',    plus:true  }
  };
  const out = [];
  (nftHist || []).forEach(function(r){
    const m = MAP[r.kind];
    if(!m) return;
    /* Stars va Premium xaridlari ham nft_buy deb yoziladi, lekin ular
       "Sovg'alar" emas — o'z bo'limlarida ko'rinishi kerak. Buyurtmalar
       ro'yxatida allaqachon bor, shuning uchun bu yerda o'tkazib yuboramiz. */
    const it = String(r.item || '').toUpperCase();
    if(r.kind === 'nft_buy' && (it.indexOf('TG STARS') > -1 || it.indexOf('TG PREMIUM') > -1)) return;
    out.push({ t:m.t, ic:m.ic, nm: r.item || r.card || r.note || m.sub,
               sub: r.note || m.sub, plus:m.plus,
               amount: Number(r.amount) || 0, cur: r.cur || "so'm",
               status: r.status || 'done', at: r.at, rec: r });
  });
  /* Stars va Premium buyurtmalari — alohida bo'limda */
  getNftOrders().forEach(function(o){
    const isTg = (o.gameId === 'tgstars' || o.gameId === 'tgpremium');
    out.push({ t: isTg ? (o.gameId === 'tgstars' ? 'stars' : 'tg') : 'gifts',
               ic: o.glyph || '\u2B50',
               nm: [o.game, o.package].filter(Boolean).join(' \u2014 '),
               sub: (o.status === 'refund' || o.status === 'cancel') ? 'Bekor qilindi' : 'Sotib olindi',
               plus:false,
               amount: (o.pay === 'gram' && o.gram) ? Number(o.gram) : Number(o.price) || 0,
               cur: (o.pay === 'gram') ? 'GRAM' : "so'm",
               status: o.status || 'done', at: o.at, ord: o });
  });
  return out.sort(function(a,b){ return (Date.parse(b.at)||0) - (Date.parse(a.at)||0); });
}
function walletRows(){
  let rows = walletLog();
  if(wlTab === 'gifts')  rows = rows.filter(function(r){ return r.t === 'gifts'; });
  if(wlTab === 'offers') rows = rows.filter(function(r){ return r.t === 'offer'; });
  if(wlTab === 'tg')     rows = rows.filter(function(r){ return r.t === 'tg'; });
  if(wlTab === 'stars')  rows = rows.filter(function(r){ return r.t === 'stars'; });
  if(!rows.length) return `<div class="empty"><div class="em">🧾</div><h3>Hozircha bo'sh</h3><p>Bu bo'limdagi pul harakati shu yerda ko'rinadi.</p></div>`;
  const M = ['YANVAR','FEVRAL','MART','APREL','MAY','IYUN','IYUL','AVGUST','SENTABR','OKTABR','NOYABR','DEKABR'];
  let out = '', last = '';
  wlShown = rows;
  nhBind();
  rows.forEach(function(r, i){
    const d = new Date(r.at || Date.now());
    const key = d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    if(key !== last){ last = key; out += `<div class="mg-day">${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}</div>`; }
    out += `<div class="mg-row" onclick="hdOpen('wl',${i})">
      <div class="ic">${nhIconW(r)}</div>
      <div class="tx"><div class="nm">${r.nm}</div><div class="sb">${r.sub}</div></div>
      <div class="pv"${r.plus?' style="color:#4FE0A0"':''}>${r.amount
        ? (r.plus?'+':'-') + (r.cur === 'GRAM' ? (fmtGram(r.amount) + ' GRAM') : fmt(r.amount))
        : ''}</div>
    </div>`;
  });
  return out;
}

function loadChat(scroll){
  fetch(VBASE + '/chat/list', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData:(tg&&tg.initData)||'' }) })
   .then(function(r){ return r.json(); })
   .then(function(d){
     if(!d || !d.ok) return;
     const box = document.getElementById('chatBox');
     if(!box) return;
     if(d.msgs.length !== chatLast || scroll){
       chatLast = d.msgs.length;
       box.innerHTML = chatHtml(d.msgs);
       if(scroll) window.scrollTo(0, document.body.scrollHeight);
     }
   }).catch(function(){});
}

function chatSend(){
  const el = document.getElementById('chatInp');
  const btn = document.getElementById('chatBtn');
  const text = ((el&&el.value)||'').trim();
  if(!text){ notify('error'); return; }
  haptic();
  if(btn){ btn.disabled = true; btn.textContent = '...'; }
  fetch(VBASE + '/chat/send', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData:(tg&&tg.initData)||'', text:text }) })
   .then(function(r){ return r.json(); })
   .then(function(d){
     if(btn){ btn.disabled = false; btn.textContent = tr('Yuborish'); }
     if(d && d.ok){
       if(el) el.value='';
       notify('success'); chatLast = -1; loadChat(true);
       setTimeout(function(){ const bar=document.getElementById('chatBar'); if(bar) bar.scrollIntoView({block:'end'}); }, 150);
     }
     else { notify('error'); toastErr(d && d.error==='busy' ? "Biroz kuting" : "Yuborilmadi"); }
   }).catch(function(){
     if(btn){ btn.disabled = false; btn.textContent = tr('Yuborish'); }
     notify('error'); toastErr("Aloqa yo'q");
   });
}

/* ---------- Valyutalar: har bir til uchun ----------
   Kurslar serverdan olinadi (GET /fx), bu yerda QO'LDA yozilgan kurs YO'Q. */
const CUR = {
  uz:{c:'UZS',s:"so'm",p:0,d:0}, ru:{c:'RUB',s:'₽',p:0,d:0},
  en:{c:'USD',s:'$',p:1,d:2},    kk:{c:'KZT',s:'₸',p:0,d:0},
  ky:{c:'KGS',s:'сом',p:0,d:0},  tr:{c:'TRY',s:'₺',p:0,d:0},
  de:{c:'EUR',s:'€',p:0,d:2},    it:{c:'EUR',s:'€',p:0,d:2},
  pt:{c:'BRL',s:'R$',p:1,d:2},   id:{c:'IDR',s:'Rp',p:1,d:0},
  vi:{c:'VND',s:'₫',p:0,d:0},    zh:{c:'CNY',s:'¥',p:1,d:2},
  ja:{c:'JPY',s:'¥',p:1,d:0},    ko:{c:'KRW',s:'₩',p:1,d:0}
};
let FXR = null;                     /* {som, usd:{...}} — serverdan */

function curNow(){ return CUR[currentLang] || CUR.uz; }

/* som -> joriy valyuta.
   up=true  : NARX  — yuqoriga yaxlitlanadi
   up=false : BALANS — pastga yaxlitlanadi
   Shu tartib muhim: aks holda mijoz "balans 13000, narx 13000" ko'rib
   "balans yetarli emas" xatosini olardi. */
function money(som, up){
  const cu = curNow();
  if(cu.c === 'UZS') return fmt(Math.round(som)) + " so'm";
  if(!FXR || !FXR.usd || !FXR.usd[cu.c] || !FXR.som) return fmt(Math.round(som)) + " so'm";
  const v = (Number(som) / FXR.som) * FXR.usd[cu.c];
  const k = Math.pow(10, cu.d);
  const r = (up === false ? Math.floor(v * k) : Math.ceil(v * k)) / k;
  const t = r.toLocaleString('en-US', { minimumFractionDigits: cu.d, maximumFractionDigits: cu.d });
  return cu.p ? (cu.s + t) : (t + ' ' + cu.s);
}
/* So'mdagi asl summa — chet tilda kichik matnda ko'rsatiladi,
   chunki o'zbek kartasi bilan to'laydiganlar uchun aynan shu raqam kerak. */

  return curNow().c === 'UZS' ? '' : fmt(Math.round(som)) + " so'm";

    /* To'lov kurslari — server bozorga qarab yangilab turadi */
    if(d && d.ok && d.rates && d.rates.usd > 0 && d.rates.rubl > 0){
      RATES = { "so'm": 1, usd: d.rates.usd, rubl: d.rates.rubl };

}

/* ---------- Ikki tomonlama kalkulyator ----------
   Ikkalasi ham RATES dan hisoblanadi — ya'ni bu yerda ko'ringan summa
   haqiqatda to'lanadigan summa bilan bir xil bo'ladi. */
function curSym(cur){ return cur === 'rubl' ? '₽' : cur === 'usd' ? '$' : cur; }
function topRateVal(){
  const c = topCard();
  const r = RATES[c.cur] || 1;
  return { cur:c.cur, sym:curSym(c.cur), r:r };
}
function onTopSom(){
  const a = document.getElementById('topAmount'), f = document.getElementById('topForeign');
  if(!a || !f) return;
  const n = Number(String(a.value||'').replace(/\D/g,''));
  const t = topRateVal();
  f.value = n ? (Math.ceil(n / t.r * 100) / 100).toFixed(2) : '';
  showTopRate();
}
function onTopForeign(){
  const a = document.getElementById('topAmount'), f = document.getElementById('topForeign');
  if(!a || !f) return;
  let v = String(f.value||'').replace(/,/g,'.').replace(/[^0-9.]/g,'');
  const p = v.split('.'); if(p.length > 2) v = p[0] + '.' + p.slice(1).join('');
  if(f.value !== v) f.value = v;
  const n = parseFloat(v);
  const t = topRateVal();
  a.value = (n > 0) ? String(Math.floor(n * t.r)) : '';
  showTopRate();
}
function showTopRate(){
  const h = document.getElementById('topRate');
  if(!h) return;
  const t = topRateVal();
  const a = document.getElementById('topAmount');
  const n = a ? Number(String(a.value||'').replace(/\D/g,'')) : 0;
  let line = '1 ' + t.sym + ' = ' + fmt(t.r) + " so'm";
  if(n > 0){
    const pay = (Math.ceil(n / t.r * 100) / 100).toFixed(2);
    line += '<br><span style="color:var(--text)">' + pay + ' ' + t.sym +
            ' \u2192 ' + fmt(n) + " so'm balansga</span>";
    /* Mijozning O'Z tilidagi valyutasi — faqat mo'ljal uchun.
       To'lov baribir karta valyutasida ketadi. */
    const cu = curNow();
    if(cu && cu.c !== 'UZS' && cu.c !== (t.cur === 'rubl' ? 'RUB' : 'USD')){
      const est = money(n, true);
      if(est && est.indexOf("so'm") < 0) line += '<br>\u2248 ' + est;
    }
  }
  h.innerHTML = line;
}

function topClockTick(){
  const el = document.getElementById('topClock');
  if(!el){ clearInterval(topTick); return; }
  let s = Math.round((topEnd - Date.now())/1000);
  if(s <= 0){ el.textContent = "Vaqt tugadi"; el.style.color = "var(--gold)"; clearInterval(topTick); return; }
  const m = Math.floor(s/60); s = s % 60;
  el.textContent = (m<10?'0':'')+m+":"+(s<10?'0':'')+s;
}

/* ---------- Telegram Stars orqali to'ldirish ----------
   Kurs serverdan olinadi (server.js dagi STAR_TOPUP_RATE), shu yerda qattiq
   yozilmaydi — ikkalasi hech qachon bir-biridan ayrilib qolmasligi uchun. */

fetch(VBASE + '/star-rate').then(r=>r.json()).then(function(d){
  if(d && d.ok){ stRate = d.rate; stMin = d.min; stMax = d.max;
    if(topMethod === 'stars') onStTop(); }
}).catch(function(){});

function onStTop(){
  const el = document.getElementById('stTop');
  if(!el) return;
  let v = String(el.value||'').replace(/[^0-9]/g,'').replace(/^0+/,'');
  if(v.length > 6) v = v.slice(0,6);
  if(el.value !== v) el.value = v;
  const n = parseInt(v,10) || 0;
  stN = (n >= stMin && n <= stMax) ? n : 0;

  const s = document.getElementById('stSom');
  if(s) s.value = n ? (fmt(n * stRate) + " so'm") : '—';
  const h = document.getElementById('stHint');
  if(h){
    let warn = '';
    if(n && n < stMin) warn = `<div style="color:var(--gold)">Eng kami ${stMin} ⭐</div>`;
    else if(n > stMax) warn = `<div style="color:var(--gold)">Eng ko'pi ${fmt(stMax)} ⭐</div>`;
    h.innerHTML = warn + `<div>1 ⭐ = ${money(stRate,true)}</div>`
      + `<div>Xohlagan miqdorni kiriting — qancha yulduzingiz bo'lsa shuncha.</div>`;

  const b = document.getElementById('stBtn');
  if(b) b.disabled = !(stN > 0) || stBusy;

  if(b){ b.disabled = true; b.textContent = 'Yuborilmoqda\u2026'; }
  stSay('So\'rov yuborildi\u2026');
  const done = function(){ stBusy = false;
    const x = document.getElementById('stBtn');
    if(x){ x.textContent = "\u2b50 To'lovga o'tish"; x.disabled = false; } };

  fetch(VBASE + '/star-invoice', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ stars: n, initData: (tg && tg.initData) || '' })
  }).then(function(r){ return r.json(); }).then(function(d){
    done();
    if(!d || !d.ok || !d.link){
      const e = (d && d.error) || 'javob yo\'q';
      notify('error');
      stSay(e === 'qty'  ? stMin + '\u2013' + fmt(stMax) + ' \u2b50 oralig\'ida kiriting'
          : e === 'auth' ? 'Telegram tasdiqlamadi \u2014 ilovani qayta oching'
          : 'Server xatosi: ' + e, true);
      return;
    }
    openInvoice(d.link);
  }).catch(function(err){
    done(); notify('error');
    stSay('Aloqa xatosi: ' + (err && err.message ? err.message : '?'), true);
  });
}

/* Telegram SDK jimgina to'xtaganda sababni console.error ga yozadi \u2014
   telefonda uni ko'rib bo'lmagani uchun tutib olamiz. */
const tgErrs = [];
(function(){
  const ce = console.error;
  console.error = function(){
    try{
      const s = Array.prototype.slice.call(arguments).join(' ');
      if(s.indexOf('Telegram') > -1) tgErrs.push(s);
    }catch(e){}
    try{ return ce.apply(console, arguments); }catch(e){}
  };
})();

/* Hisob-fakturani Mini App ICHIDA ochamiz */
function openInvoice(link){
  const ver = (tg && tg.version) || '?';
  const before = tgErrs.length;
  stSay('To\'lov oynasi ochilmoqda\u2026');

  if(!tg || typeof tg.openInvoice !== 'function'){
    stSay('openInvoice yo\'q (Telegram v' + ver + ')', true);
    showSendBtn(); return;
  }
  try{
    tg.openInvoice(link, function(status){
      if(status === 'paid'){
        notify('success');
        stSay('\u2705 To\'lov qabul qilindi \u2014 balans to\'lmoqda');
        toastOk("✅ To'lov qabul qilindi");
        setTimeout(function(){ go('home'); loadBalance(); }, 1500);
      } else if(status === 'failed'){
        notify('error'); stSay('To\'lov o\'tmadi', true); showSendBtn();
      } else if(status === 'cancelled'){
        stSay('To\'lov bekor qilindi', true);
      } else {
        stSay('Holat: ' + status, true);
      }
    });
  }catch(e){
    stSay('openInvoice xato (v' + ver + '): ' + (e && e.message ? e.message : '?'), true);
    showSendBtn(); return;
  }
  /* 3 soniyada oyna ochilmasa \u2014 SDK xatosini ko'rsatamiz va zaxira tugmani beramiz */
  setTimeout(function(){
    const h = document.getElementById('stHint');
    if(!h || h.textContent.indexOf('ochilmoqda') < 0) return;
    const e = tgErrs.length > before ? tgErrs[tgErrs.length-1] : '';
    stSay(e ? ('SDK: ' + e) : ('Oyna ochilmadi (Telegram v' + ver + ')'), true);
    showSendBtn();
  }, 3000);
}

/* Zaxira: hisob-fakturani bot chatiga yuborib, ilovani yopamiz */
function showSendBtn(){
  if(document.getElementById('stSend')) return;
  const h = document.getElementById('stHint');
  if(!h) return;
  const b = document.createElement('button');
  b.id = 'stSend'; b.className = 'check-btn';
  b.style.cssText = 'width:100%;margin-top:10px;padding:12px';
  b.textContent = 'Botga yuborish';

/* ---- Tovush: iPhone "Akkord" va "Sirg'anish" ga yaqin ohanglar ---- */
let _ac = null, sndOn = true;
try{ sndOn = localStorage.getItem('mt_snd') !== '0'; }catch(e){}
function _ctx(){
  try{
    if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if(_ac.state === 'suspended') _ac.resume();
    return _ac;
  }catch(e){ return null; }
}
function tone(freq, dur, vol, delay){
  const c = _ctx(); if(!c) return;
  try{
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
/* Akkord \u2014 uchta nota birga, yumshoq (muvaffaqiyat) */
/* ---- Tayyor ovoz fayli (toast.m4a). Yuklanmasa eski ohangga qaytadi. ---- */
var _sfx = null, _sfxReady = false;
(function(){
  try{
    _sfx = new Audio('/toast.m4a');
    _sfx.preload = 'auto';
    _sfx.volume  = 0.55;
    _sfx.addEventListener('canplaythrough', function(){ _sfxReady = true; });
    /* iOS ruxsatini OCHISH: sizning faylingiz emas, 0.05 soniyalik JIMLIK chalinadi.
       Shuning uchun ilova ochilganda hech qanday ovoz eshitilmaydi. */
    var unlock = function(){
      try{
        var q = new Audio('data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==');
        q.volume = 0; q.muted = true;
        var pr = q.play();
        if(pr && pr.catch) pr.catch(function(){});
      }catch(e){}
      try{ _sfx.load(); _sfxReady = true; }catch(e){}   /* faylni yuklatamiz va tayyor deb belgilaymiz */
      document.removeEventListener('touchstart', unlock);
      document.removeEventListener('click', unlock);
    };
    document.addEventListener('touchstart', unlock, { once:true, passive:true });
    document.addEventListener('click', unlock, { once:true });
  }catch(e){}
})();
function playSfx(fallback){
  if(!sndOn) return false;
  if(!_sfx) return false;
  try{
    _sfx.currentTime = 0;
    var pr = _sfx.play();
    if(pr && pr.catch) pr.catch(function(){ if(fallback) fallback(); });  /* bloklansa eski ohang */
    return true;
  }catch(e){ return false; }
}
function _okTones(){
  tone(523.25, 0.55, 0.050, 0);
  tone(659.25, 0.55, 0.042, 0.035);
  tone(783.99, 0.60, 0.038, 0.070);
}
function sndOk(){
  if(!sndOn) return;
  if(playSfx(_okTones)) return;
  _okTones();
}
/* Sirg'anish \u2014 pastga tushuvchi ohang (xato) */
function _errTone(){
  const c = _ctx(); if(!c) return;
  try{
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(300,t+0.18);
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.22);
  }catch(e){}
}
function sndErr(){
  if(!sndOn) return;
  if(playSfx(_errTone)) return;
  const c = _ctx(); if(!c) return;
  try{
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(760, t);
    o.frequency.exponentialRampToValueAtTime(190, t + 0.30);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.40);
  }catch(e){}
}

/* Har bir bosilishda yengil tebranish */

let _hapT = 0;
const TAP_SEL = '.refresh-btn, .chips .c, .seg button, .order[onclick], .sh-close, .rlk-b, .guide-btn, .check-btn, .mg-row[onclick]';
let _tapEl = null, _tapT = 0, _tapY = 0, _tapX = 0;
function tapDown(e){
  const p = (e.touches && e.touches[0]) || e;
  const t = e.target && e.target.closest && e.target.closest(TAP_SEL);
  if(!t || t.disabled || t.classList.contains('nav-item')) return;
  if(_tapEl) _tapEl.classList.remove('tapped');
  _tapEl = t; _tapT = Date.now();
  _tapY = p ? p.clientY : 0; _tapX = p ? p.clientX : 0;
  t.classList.add('tapped');
}
function tapUp(){
  const el = _tapEl; _tapEl = null;
  if(!el) return;
  const wait = Math.max(0, 120 - (Date.now() - _tapT));
  setTimeout(function(){ el.classList.remove('tapped'); }, wait);
}
function tapMove(e){
  if(!_tapEl) return;
  const p = (e.touches && e.touches[0]) || e;
  if(!p) return;
  if(Math.abs(p.clientY - _tapY) > 10 || Math.abs(p.clientX - _tapX) > 10){
    _tapEl.classList.remove('tapped'); _tapEl = null;
  }
}
/* Tinglovchilar FAQAT tarix elementlariga ulanadi.
   document ga ulansa iOS butun ilovadagi eski :active qoidalarini yoqib yuboradi. */
function bindTap(el){
  if(!el || el._tapBound) return;
  el._tapBound = true;
  el.addEventListener('touchstart', tapDown, {passive:true});
  el.addEventListener('touchmove',  tapMove, {passive:true});
  el.addEventListener('touchend',   tapUp,   {passive:true});
  el.addEventListener('touchcancel',tapUp,   {passive:true});
  el.addEventListener('mousedown',  tapDown);
  el.addEventListener('mouseup',    tapUp);
}
function bindHistTaps(){
  try{ document.querySelectorAll(TAP_SEL).forEach(bindTap); }catch(e){}
}

/* ===== Tortib yangilash (pull to refresh) =====
   iPhone da sahifa eng tepada pastga tortilsa "cho'ziladi" - window.scrollY manfiy
   bo'ladi. Shuni AYLANISH hodisasi orqali kuzatamiz. Hujjatga barmoq tinglovchisi
   ATAYLAB qo'shilmaydi: u iOS da butun ilovadagi eski :active qoidalarini yoqib
   yuboradi (bindTap izohiga qarang). Aylanish tinglovchisi bunga ta'sir qilmaydi.
   - faqat ma'lumot ko'rsatadigan ekranlarda; forma va to'lov ekranlarida emas;
   - tez silkitib tepaga chiqilganda (inersiya) ishga tushmaydi - sahifa kamida
     0.25 s tepada turgan bo'lishi shart;
   - belgi Telegram tugmalari qatorining o'rtasida aylanadi, kontentga tegmaydi;
   - kamida 0.8 s aylanadi (lip etib o'chmasin), ko'pi bilan 6 s.
   Android da sahifa cho'zilmaydi - u yerda bu imkoniyat shunchaki ko'rinmaydi. */
const PTR_VIEWS = { home:1, history:1, settings:1,
                    nft_market:1, nft_gifts:1, nft_wallet:1, nft_profile:1, nft_hist:1 };
const PTR_PULL = 64;                 /* shuncha piksel tortilganda yangilanadi */
let ptrEl = null, ptrSvg = null, ptrAnim = null;
let ptrBusy = false, ptrEnding = false, ptrEp = 0, ptrT0 = 0, ptrCap = 0;
let ptrRestT = (window.scrollY || 0) <= 0 ? Date.now() : 0;

function ptrMake(){
  if(ptrEl) return;
  ptrEl = document.createElement('div');
  ptrEl.id = 'ptr';
  ptrEl.setAttribute('aria-hidden', 'true');
  const s = ptrEl.style;
  s.position = 'fixed'; s.left = '50%'; s.width = '26px'; s.height = '26px'; s.marginLeft = '-13px';
  s.top = 'calc(env(safe-area-inset-top) + (var(--tg-top, 46px) - 36px) / 2)';
  s.zIndex = '150'; s.pointerEvents = 'none'; s.opacity = '0'; s.transition = 'opacity .18s';
  let sp = '';
  for(let i = 0; i < 8; i++){
    sp += '<line x1="12" y1="2.6" x2="12" y2="7.4" stroke="currentColor" stroke-width="2.4" ' +
          'stroke-linecap="round" opacity="' + (1 - i * 0.11).toFixed(2) + '" transform="rotate(' + (-i * 45) + ' 12 12)"/>';
  }
  ptrEl.innerHTML = '<svg viewBox="0 0 24 24" width="26" height="26" style="display:block;color:#8E97A8">' + sp + '</svg>';
  document.body.appendChild(ptrEl);
  ptrSvg = ptrEl.firstChild;
}
function ptrShow(p){                 /* p: 0..1 - qanchalik tortildi */
  ptrMake();
  const q = Math.min(1, Math.max(0, p));
  ptrEl.style.opacity = String(Math.min(1, q * 1.2));
  if(!ptrAnim) ptrSvg.style.transform = 'rotate(' + Math.round(q * 270) + 'deg) scale(' + (0.55 + 0.45 * q).toFixed(3) + ')';
}
function ptrHide(){
  if(ptrEl) ptrEl.style.opacity = '0';
  if(ptrAnim){ try{ ptrAnim.cancel(); }catch(e){} ptrAnim = null; }
  if(ptrSvg) ptrSvg.style.transform = '';
}
function ptrBlocked(){
  if(document.getElementById('shBox') || document.getElementById('drWrap')) return true;
  const lk = document.getElementById('pwLock');
  if(lk && lk.classList.contains('on')) return true;
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
}
function ptrStart(){
  if(ptrBusy) return;
  ptrBusy = true; ptrEnding = false; ptrT0 = Date.now();
  haptic('medium');
  ptrShow(1);
  try{ ptrAnim = ptrSvg.animate([{ transform:'rotate(0deg)' }, { transform:'rotate(360deg)' }],
                                { duration:800, iterations:Infinity, easing:'steps(8)' }); }catch(e){}
  let left = 1;
  const one = function(){ if(--left <= 0) ptrEnd(); };
  const add = function(fn){ left++; try{ fn(one); }catch(e){ one(); } };
  try{ loadBalance(); }catch(e){}
  if(view === 'history')    add(function(cb){ loadOrders(function(){ try{ if(view === 'history') renderHistory(); }catch(e){} cb(); }); });
  if(view === 'settings'){  try{ loadPhone(); }catch(e){} }
  if(isNftView(view))       add(function(cb){ nftLoad(cb); });
  if(view === 'nft_market') add(function(cb){ mktLoad(cb); });
  one();
  clearTimeout(ptrCap);
  ptrCap = setTimeout(ptrEnd, 6000);     /* tarmoq osilsa ham abadiy aylanmasin */
}
function ptrEnd(){
  if(!ptrBusy || ptrEnding) return;
  ptrEnding = true;
  clearTimeout(ptrCap);
  setTimeout(function(){ ptrBusy = false; ptrEnding = false; ptrHide(); },
             Math.max(0, 800 - (Date.now() - ptrT0)));
}
function ptrScroll(){
  const y = window.scrollY || window.pageYOffset || 0;
  if(y > 0){ ptrRestT = 0; ptrEp = 0; if(!ptrBusy) ptrHide(); return; }
  if(!ptrRestT) ptrRestT = Date.now();             /* tepaga hozir keldi */
  if(y === 0){ ptrEp = 0; if(!ptrBusy) ptrHide(); return; }
  /* y < 0: sahifa cho'zilyapti. Bu tortish to'g'rimi yoki inersiyami - bir marta hal qilinadi */
  if(ptrEp === 0) ptrEp = (PTR_VIEWS[view] && Date.now() - ptrRestT >= 250 && !ptrBlocked()) ? 1 : 2;
  if(ptrEp !== 1 || ptrBusy) return;
  ptrShow(-y / PTR_PULL);
  if(-y >= PTR_PULL) ptrStart();
}
window.addEventListener('scroll', ptrScroll, { passive:true });
