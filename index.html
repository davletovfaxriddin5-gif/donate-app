<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>minatoh</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
/* =========================================================
   minatoh — dizayn tokenlari (navy + ko'k) — ixcham o'lcham
   ========================================================= */
:root{
  --bg:#0B1120;
  --bg-2:#0D1626;
  --card:#141D31;
  --card-2:#18223A;
  --stroke:rgba(255,255,255,.06);
  --stroke-2:rgba(255,255,255,.12);
  --text:#EEF2FB;
  --dim:#8B94AC;
  --faint:#5C6580;
  --blue:#3B4DF0;
  --blue-grad:linear-gradient(135deg,#3F55F6 0%,#5A43F2 100%);
  --blue-soft:rgba(63,85,246,.16);
  --gold:#F0A93C;
  --green:#2FB574;
  --green-soft:rgba(47,181,116,.15);
  --nav-h:66px;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{ overflow-x:hidden; max-width:100%;
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
}
.reduce-motion *{animation:none!important;transition:none!important}
.wrap{max-width:460px;margin:0 auto;position:relative;min-height:100dvh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::-webkit-scrollbar{display:none}

.profile{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.profile .who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--blue-grad);
  display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.who .nm{font-weight:800;font-size:15px;font-style:italic;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .un{color:var(--dim);font-size:12px;margin-top:1px}
.coin{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--stroke);
  padding:6px 12px;border-radius:999px;font-weight:700;font-size:13.5px}
.coin .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE07A,#F0B429)}

.balance{background:var(--blue-grad);border-radius:20px;padding:17px 18px 15px;margin-bottom:20px;
  box-shadow:0 12px 32px -12px rgba(63,85,246,.55);position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.08)}
.balance .lbl{font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600}
.balance .amt{font-weight:800;font-size:33px;letter-spacing:-1px;line-height:1;margin:3px 0 15px;color:#fff}
.balance .amt small{font-size:15px;font-weight:600;color:rgba(255,255,255,.72);margin-left:5px;letter-spacing:0}
.bal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;position:relative;z-index:1}
.bal-btn{background:rgba(255,255,255,.14);border-radius:13px;padding:12px 6px;display:flex;flex-direction:column;
  align-items:center;gap:6px;font-size:11px;font-weight:600;color:#fff;line-height:1.25;text-align:center;transition:.15s}
.bal-btn:active{transform:scale(.96);background:rgba(255,255,255,.22)}
.bal-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.sec-lbl{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;margin:18px 2px 10px}

.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game{position:relative;min-width:0}
.game .tile{position:relative;width:100%;aspect-ratio:1;border-radius:15px;overflow:hidden;
  background:var(--card);display:grid;place-items:center;transition:transform .12s}
.game:active .tile{transform:scale(.95)}
.game .tile img{width:100%;height:100%;object-fit:cover}
.game .glyph{font-size:26px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.game .star{position:absolute;top:0;left:0;width:25px;height:25px;border-radius:15px 0 12px 0;
  display:grid;place-items:center;font-size:11px;z-index:2}
.game .star.on{background:var(--gold)}
.game .star.off{background:#4A5266}
.game .badge{position:absolute;top:6px;right:6px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;
  padding:2px 6px;border-radius:7px;z-index:2;letter-spacing:.2px}
.game .maint{position:absolute;inset:0;background:rgba(8,12,22,.55);display:grid;place-items:center;z-index:1}
.game .maint span{background:var(--gold);color:#1a1200;font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:8px}
.game .nm{text-align:center;font-size:10.5px;font-weight:600;color:var(--dim);margin-top:7px;
  letter-spacing:.2px;text-transform:uppercase;line-height:1.25;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.back-row{display:flex;align-items:center;margin-bottom:14px}
.back-btn{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--stroke);
  padding:9px 13px 9px 10px;border-radius:12px;font-weight:700;font-size:13.5px}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.gd-head{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--stroke);
  border-radius:var(--radius);padding:14px;margin-bottom:16px}
.gd-head .ic{width:60px;height:60px;border-radius:15px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;
  background:var(--card-2);font-size:28px}
.gd-head .ic img{width:100%;height:100%;object-fit:cover}
.gd-head .nm{font-weight:800;font-size:19px;letter-spacing:-.4px;line-height:1.1;text-transform:uppercase}
.gd-head .cur{font-size:17px;margin-top:3px}
.saved-ids{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;margin-bottom:16px}
.saved-ids .chip{background:var(--card);border:1px solid var(--stroke);border-radius:12px;padding:10px 14px;
  white-space:nowrap;font-size:12.5px;color:var(--dim);flex-shrink:0}
.form-card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:15px;margin-bottom:18px}
.form-card .lbl{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.inp-wrap{position:relative;margin-bottom:14px}
.inp-wrap:last-child{margin-bottom:0}
.inp{width:100%;background:var(--bg-2);border:1px solid var(--stroke-2);border-radius:12px;
  padding:13px 46px 13px 15px;color:var(--text);font-size:13.5px}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--blue)}
.info-i{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
  background:var(--blue-soft);color:#7E93FF;display:grid;place-items:center;font-size:11.5px;font-weight:700;font-style:italic}
.row-inp{display:flex;gap:10px;align-items:stretch}
.row-inp .inp-wrap{flex:1;margin-bottom:0}
.check-btn{background:var(--blue-grad);border-radius:12px;padding:0 18px;font-weight:700;font-size:13.5px;color:#fff;
  white-space:nowrap;box-shadow:0 8px 20px -8px rgba(63,85,246,.6)}
.check-btn:active{transform:scale(.98)}
.region-tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.region-tabs .rt{background:var(--card);border:1px solid var(--stroke);border-radius:12px;padding:10px 14px;
/* === Ixchamroq: region tablari, saqlangan ID, ID formasi === */
.region-tabs{ gap:7px; margin-bottom:13px }
.region-tabs .rt{ padding:7px 13px; font-size:11px; border-radius:999px }
.saved-ids{ gap:7px; margin-bottom:13px }
.saved-ids .chip{ padding:4px 10px; font-size:11px; border-radius:999px }
.region-tabs .rt{ padding:4px 10px !important; font-size:11px !important; line-height:1.1 !important }
.saved-ids .chip{ padding:4px 10px !important; font-size:11px !important; line-height:1.1 !important }
.form-card{ padding:13px }
...
  font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--dim);transition:.15s}
.region-tabs .rt.on{background:var(--blue);color:#fff;border-color:transparent}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:8px}
.pkg{position:relative;background:var(--card);border:1.5px solid rgba(240,169,60,.45);border-radius:14px;
  padding:13px 11px;display:flex;align-items:center;gap:10px;transition:.14s;text-align:left;overflow:hidden}
.pkg:active{transform:scale(.98)}
.pkg.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 26px -12px rgba(240,169,60,.5)}
.pkg .pic{position:relative;flex-shrink:0}
.pkg .pic .em{font-size:24px}
.pkg .pic .x2{position:absolute;top:-7px;left:-6px;background:var(--gold);color:#1a1200;font-size:9px;
  font-weight:800;padding:1px 5px;border-radius:6px;font-style:italic}
.pkg .info .a{font-weight:800;font-size:15.5px;letter-spacing:-.3px}
.pkg .info .p{color:var(--gold);font-weight:700;font-size:12.5px;margin-top:3px}
.pkg .hit{position:absolute;top:9px;right:9px;background:var(--gold);color:#1a1200;font-size:9px;font-weight:800;
  padding:2px 7px;border-radius:7px;letter-spacing:.3px}
.pkg .info .a.small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:105px}

.buy-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
  width:calc(100% - 28px);max-width:432px;z-index:60}
.buy-btn{width:100%;background:var(--blue-grad);border-radius:15px;padding:15px;font-weight:800;font-size:15px;
  color:#fff;box-shadow:0 14px 34px -10px rgba(63,85,246,.7)}
.buy-btn:active{transform:scale(.99)}
.buy-btn:disabled{opacity:.5;box-shadow:none}

.page-title{font-weight:800;font-size:23px;letter-spacing:-.6px;margin:4px 2px 14px}

.seg{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:15px;padding:5px;margin-bottom:14px}
.seg button{flex:1;padding:11px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim);transition:.15s}
.seg button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chips .c{background:var(--card);border:1px solid var(--stroke);border-radius:999px;padding:9px 16px;
  font-weight:700;font-size:13.5px;color:var(--dim);white-space:nowrap;transition:.15s}
.chips .c.on{background:var(--blue);color:#fff;border-color:transparent}
.refresh-btn{width:100%;background:var(--blue-soft);border:1px solid rgba(63,85,246,.3);border-radius:14px;
  padding:13px;font-weight:700;font-size:14px;color:#9CA9FF;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:16px}
.refresh-btn:active{transform:scale(.99)}
.refresh-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.order{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.order .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.order .g{display:flex;align-items:center;gap:10px}
.order .g .ic{width:46px;height:46px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;
  font-size:20px;flex-shrink:0;overflow:hidden}
.order .g .ic img{width:100%;height:100%;object-fit:cover}
.order .g .nm{font-weight:800;font-size:15px}
.order .g .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
.order .price{font-weight:800;font-size:16.5px;white-space:nowrap}
.order .price small{color:var(--dim);font-weight:600;font-size:12px;margin-left:3px}
.order .sep{height:1px;background:var(--stroke);margin:12px 0}
.order .kv{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}
.order .kv:last-of-type{margin-bottom:0}
.order .kv .k{color:var(--dim)}
.order .kv .v{font-weight:600}
.badge-st{font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px}
.badge-st.done{color:#4FE0A0;background:var(--green-soft)}
.badge-st.wait{color:var(--gold);background:rgba(240,169,60,.14)}
.order .date{color:var(--faint);font-size:12px;margin-top:10px}

.empty{text-align:center;padding:50px 24px;color:var(--dim)}
.empty .em{font-size:40px;margin-bottom:14px}
.empty h3{font-weight:800;font-size:16px;color:var(--text);margin:0 0 6px}
.empty p{font-size:12.5px;margin:0}

.set-profile{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:15px;margin-bottom:18px}
.set-profile .top{display:flex;align-items:center;gap:12px}
.set-profile .nm{font-weight:800;font-size:16.5px;font-style:italic}
.set-profile .un{color:#7E93FF;font-size:12.5px;margin-top:1px}
.id-chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg-2);border:1px solid var(--stroke);
  border-radius:10px;padding:5px 11px;margin-top:8px;font-size:12.5px;color:var(--dim);font-weight:600}
.id-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg-2);border:1px solid var(--stroke);border-radius:14px;padding:12px 14px}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.stat .v{font-weight:800;font-size:18px;margin-top:4px}
.stat .v.gold{color:var(--gold)}
.stat .v small{font-size:12px;font-weight:600;color:var(--dim);margin-left:4px}
.big-btn{width:100%;background:var(--blue-soft);border:1px solid rgba(63,85,246,.35);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;margin-bottom:8px;transition:.15s}
.big-btn:active{transform:scale(.99)}
.big-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;flex-shrink:0}
.big-btn .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lang-toggle{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:15px;padding:5px;margin-bottom:8px}
.lang-toggle button{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim);transition:.15s}
.lang-toggle button.on{background:var(--blue);color:#fff}
.svc-list{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);overflow:hidden}
.svc{display:flex;align-items:center;gap:12px;padding:14px 16px;transition:.12s;width:100%;text-align:left}
.svc:active{background:rgba(255,255,255,.03)}
.svc + .svc{border-top:1px solid var(--stroke)}
.svc .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.svc .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.svc .t{font-weight:700;font-size:14px}
.svc .s{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.4}
.svc .arw{color:var(--faint);font-size:20px;margin-left:auto;flex-shrink:0}
.svc .txt{min-width:0}
.switch{width:44px;height:26px;border-radius:999px;background:var(--stroke-2);margin-left:auto;flex-shrink:0;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--blue)}
.switch.on::after{left:21px}

.guide-btn{width:100%;background:var(--blue-soft);border:1px solid rgba(63,85,246,.35);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:18px;transition:.15s}
.guide-btn:active{transform:scale(.99)}
.guide-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.guide-btn .t{font-weight:700;font-size:15px;color:#9CA9FF}
.guide-btn .r{margin-left:auto;color:#7E93FF;font-size:13px;font-weight:600}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.check-btn:disabled{opacity:.45}
.pay{background:#fff;border-radius:13px;padding:11px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.14s}
.pay:active{transform:scale(.96)}
.pay .box{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.pay .nm{font-size:12.5px;font-weight:700;color:#1a2236;text-align:center}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:70;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);
  display:flex;align-items:center;gap:8px}
.nav-inner{flex:1;display:flex;background:rgba(15,22,38,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--stroke);border-radius:18px;padding:7px 4px;height:54px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--faint);font-size:10.5px;font-weight:600;border-radius:14px;transition:.15s}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.on{background:var(--blue);color:#fff}
.rent{width:58px;height:54px;border-radius:18px;border:1px solid var(--stroke);background:rgba(15,22,38,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;flex-shrink:0;color:var(--gold);font-size:10px;font-weight:700}
.rent:active{transform:scale(.95)}
.rent .g{display:flex;align-items:center;gap:4px}
.rent .g svg{width:18px;height:18px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%) translateY(-20px);
  background:var(--card-2);border:1px solid var(--stroke-2);color:#fff;padding:12px 18px;border-radius:13px;
  font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.5);
  pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
 /* === Tipografiya sayqali === */
body{ font-size:13px; font-weight:400; letter-spacing:-.1px }
.coin{ font-size:12.5px; font-weight:500 }
.who .nm{ font-size:14.5px; font-weight:600 }
.who .un{ font-weight:400 }
.balance .lbl{ font-weight:400 }
.balance .amt{ font-size:29px; font-weight:600; letter-spacing:-1.2px }
.balance .amt small{ font-weight:400 }
.bal-btn{ font-size:10.5px; font-weight:500 }
.sec-lbl{ font-size:10.5px; font-weight:500; letter-spacing:.9px }
.game .nm{ font-size:10px; font-weight:400; letter-spacing:.1px }
.game .badge{ font-weight:500 }
.game .star.on, .game .maint span{ font-weight:600 }
.page-title{ font-size:21px; font-weight:600; letter-spacing:-.5px }
.gd-head .nm{ font-size:17px; font-weight:600 }
.inp{ font-size:13px; font-weight:400 }
.form-card .lbl{ font-weight:500 }
.check-btn{ font-size:13px; font-weight:500 }
.region-tabs .rt{ font-size:12.5px; font-weight:500 }

.pkg{ padding:12px 10px; gap:8px }
.pkg .pic .pim{ width:36px; height:36px; object-fit:contain; display:block }
.pkg .info{ display:flex; flex-direction:column; min-width:0 }

/* ---------- TG Stars: ixtiyoriy miqdor ----------
   Narx bosqichli. Bu jadval server.js dagi STARS_TIERS bilan AYNAN bir xil
   bo'lishi shart — aks holda mijoz bir narx ko'rib, boshqasini to'laydi. */
const STAR_MIN = 50, STAR_MAX = 10000;
function starRate(n){ return n<=99 ? 250 : n<=249 ? 240 : n<=999 ? 230 : 220; }
function starPrice(n){ return n * starRate(n); }
/* balansga qancha yulduz sig'adi (bosqichlar tufayli oddiy bo'lish ishlamaydi) */
function maxStars(bal){
  const T = [[50,99,250],[100,249,240],[250,999,230],[1000,STAR_MAX,220]];
  let best = 0;
  T.forEach(function(t){
    const n = Math.min(t[1], Math.floor(bal / t[2]));
    if(n >= t[0] && n > best) best = n;
  });
  return best;
}

function paintTabs(only){
  const tabs = document.querySelectorAll('.region-tabs .rt');
  if(!tabs.length) return;
  let shown = 0;
  tabs.forEach(function(b){
    const mine = only ? (b.dataset.r === only) : true;
    b.style.display = mine ? '' : 'none';
    b.classList.toggle('on', only ? mine : (b.dataset.r === curRegion));
    if(mine) shown++;
  });
  if(only && !shown) tabs.forEach(function(b){ b.style.display=''; b.classList.toggle('on', b.dataset.r===curRegion); });
}

function mlRegion(region){
  const r = String(region||'').toLowerCase();
  if(r.indexOf('russ') > -1 || r === 'ru') return 'ru';
  if(r.indexOf('indonesi') > -1) return 'indonesia';
  if(r.indexOf('malays') > -1) return 'malaysia';
  if(r.indexOf('philippin') > -1 || r.indexOf('filipin') > -1) return 'philippines';
  if(r.indexOf('singapor') > -1) return 'singapore';
  if(r.indexOf('turk') > -1 || r.indexOf('t\u00fcrk') > -1) return 'turkey';
  if(r.indexOf('united states') > -1 || r === 'usa' || r === 'us') return 'united_states';
  if(r.indexOf('brazil') > -1 || r.indexOf('brasil') > -1) return 'brazil';
  return 'global';
}
function regionPkgs(g, region){
  if(g.id === 'mlbb' && g.pkgByRegion){
    const k = mlRegion(region);
    if(g.pkgByRegion[k]) return g.pkgByRegion[k];
  }
  return g.packages;
}

const NAV = (function(){
  const inner=document.querySelector('.nav-inner');
  if(!inner) return { sync:function(){} };
  const goo=inner.querySelector('.nav-goo');
  const blob=inner.querySelector('.nav-blob');
  const tail=inner.querySelector('.nav-tail');
  const rim=inner.querySelector('.nav-pill');
  const items=[].slice.call(inner.querySelectorAll('.nav-item'));
  if(!goo||!blob||!tail||!rim||!items.length) return { sync:function(){} };

  let w=0, minX=0, maxX=0, ir=null;
  let x=0, tx=0, v=0, targetX=0;
  let dragging=false, raf=0, startItem=null, target=null, ready=false;
  let pressed=false, moving=false, sx0=0, offs=0;

  function slow(){ return document.body.classList.contains('reduce-motion'); }
  function measure(){
    if(getComputedStyle(inner.parentNode).display==='none') return false;
    ir=inner.getBoundingClientRect(); if(!ir.width) return false;
    const r0=items[0].getBoundingClientRect(), rl=items[items.length-1].getBoundingClientRect();
    if(!r0.width) return false;
    w=r0.width; minX=r0.left-ir.left; maxX=rl.left-ir.left;
    blob.style.width=w+'px'; tail.style.width=w+'px'; rim.style.width=w+'px';
    return true;
  }
  function xOf(el){ return el.getBoundingClientRect().left-ir.left; }
  function clamp(px){ return Math.max(minX, Math.min(maxX, px)); }
  function paint(){
    const d=x-tx, st=Math.min(Math.abs(d)/Math.max(w,1), 1);
    const tf='translateX('+x.toFixed(1)+'px) scaleX('+(1+st*0.24).toFixed(3)+') scaleY('+(1-st*0.13).toFixed(3)+')';
    blob.style.transform=tf;
    rim.style.transform=tf;
    rim.style.backgroundPosition=(50-d*1.8).toFixed(1)+'% 0%';
    goo.style.opacity='1'; rim.style.opacity='1';
  }
  function loop(){
    raf=0;
    if(!dragging){
      v+=(targetX-x)*0.17; v*=0.76; x+=v;
      if(Math.abs(v)<0.12 && Math.abs(targetX-x)<0.4){ x=targetX; v=0; }
    }
    tx+=(x-tx)*0.30;
    paint();
    if(!dragging && v===0 && Math.abs(x-tx)<0.4){ tx=x; paint(); return; }
    raf=requestAnimationFrame(loop);
  }
  function kick(){ if(!raf) raf=requestAnimationFrame(loop); }
  function nearest(cx){
    let b=items[0], bd=1e9;
    items.forEach(function(n){ const r=n.getBoundingClientRect(); const dd=Math.abs(r.left+r.width/2-cx); if(dd<bd){ bd=dd; b=n; } });
    return b;
  }
  function mark(el){ if(el===target) return; target=el; haptic(); items.forEach(function(n){ n.classList.toggle('on', n===el); }); }

  function sync(animate){
    if(!measure()) return;
    const on=document.querySelector('.nav-item.on'); if(!on) return;
    target=on; targetX=xOf(on);
    if(animate===false || !ready || slow()){ x=targetX; tx=targetX; v=0; ready=true; paint(); return; }
    ready=true; kick();
  }

  inner.addEventListener('touchstart', function(e){
    if(!measure()) return;
    const t=e.touches[0];
    pressed=true; moving=false; dragging=false; sx0=t.clientX;
    startItem=nearest(t.clientX); target=null; mark(startItem);
    targetX=xOf(startItem); v=0; kick();
  }, {passive:true});

  inner.addEventListener('touchmove', function(e){
    if(!pressed) return;
    const t=e.touches[0];
    if(!moving){
      if(Math.abs(t.clientX-sx0) < 8) return;
      moving=true; dragging=true;
      offs = x - (t.clientX-ir.left-w/2);
    }
    x=clamp(t.clientX-ir.left-w/2+offs);
    mark(nearest(x+ir.left+w/2));
    kick();
    if(e.cancelable) e.preventDefault();
  }, {passive:false});

  function end(){
    if(!pressed) return;
    pressed=false;
    const wasDrag=moving;
    moving=false; dragging=false;
    if(target) targetX=xOf(target);
    v=0; kick();
    if(wasDrag && target && target!==startItem){
      navDragged=true; go(target.dataset.tab);
      setTimeout(function(){ navDragged=false; }, 480);
    }
  }
  inner.addEventListener('touchend', end);
  inner.addEventListener('touchcancel', end);
  window.addEventListener('resize', function(){ sync(false); });
  return { sync:sync };
})();

function liquidFx(host){
  if(!host || host._fx) return;
  const btns=[].slice.call(host.querySelectorAll('button'));
  if(btns.length<2) return;
  host.classList.add('fx-host');
  [].slice.call(host.querySelectorAll('.fx-goo, .fx-rim')).forEach(function(n){ n.parentNode.removeChild(n); });
  const goo=document.createElement('span'); goo.className='fx-goo';
  goo.innerHTML='<i class="fx-blob"></i><i class="fx-tail"></i>';
  const rim=document.createElement('span'); rim.className='fx-rim';
  host.insertBefore(rim, host.firstChild);
  host.insertBefore(goo, host.firstChild);
  const blob=goo.firstElementChild, tail=goo.lastElementChild;

  let w=0, minX=0, maxX=0, ir=null;
  let x=0, tx=0, v=0, targetX=0;
  let dragging=false, raf=0, origin=null, target=null, ready=false;
  let pressed=false, moving=false, sx0=0, offs=0;

  function slow(){ return document.body.classList.contains('reduce-motion'); }
  function measure(){
    if(!host.offsetWidth) return false;
    ir=host.getBoundingClientRect();
    const r0=btns[0].getBoundingClientRect(), rl=btns[btns.length-1].getBoundingClientRect();
    if(!r0.width) return false;
    w=r0.width; minX=r0.left-ir.left; maxX=rl.left-ir.left;
    blob.style.width=w+'px'; tail.style.width=w+'px'; rim.style.width=w+'px';
    return true;
  }
  function xOf(el){ return el.getBoundingClientRect().left-ir.left; }
  function clamp(px){ return Math.max(minX, Math.min(maxX, px)); }
  function paint(){
    const d=x-tx, st=Math.min(Math.abs(d)/Math.max(w,1), 1);
    const tf='translateX('+x.toFixed(1)+'px) scaleX('+(1+st*0.22).toFixed(3)+') scaleY('+(1-st*0.12).toFixed(3)+')';
    blob.style.transform=tf;
    rim.style.transform=tf;
    rim.style.backgroundPosition=(50-d*1.8).toFixed(1)+'% 0%';
    goo.style.opacity='1'; rim.style.opacity='1';
  }
  function loop(){
    raf=0;
    if(!dragging){
      v+=(targetX-x)*0.17; v*=0.76; x+=v;
      if(Math.abs(v)<0.12 && Math.abs(targetX-x)<0.4){ x=targetX; v=0; }
    }
    tx+=(x-tx)*0.30;
    paint();
    if(!dragging && v===0 && Math.abs(x-tx)<0.4){ tx=x; paint(); return; }
    raf=requestAnimationFrame(loop);
  }
  function kick(){ if(!raf) raf=requestAnimationFrame(loop); }
  function nearest(cx){
    let b=btns[0], bd=1e9;
    btns.forEach(function(n){ const r=n.getBoundingClientRect(); const dd=Math.abs(r.left+r.width/2-cx); if(dd<bd){ bd=dd; b=n; } });
    return b;
  }
  function mark(el){ if(el===target) return; target=el; haptic(); btns.forEach(function(n){ n.classList.toggle('on', n===el); }); }
  function sync(animate){
    if(!measure()) return;
    const on=host.querySelector('button.on'); if(!on) return;
    target=on; targetX=xOf(on);
    if(animate===false || !ready || slow()){ x=targetX; tx=targetX; v=0; ready=true; paint(); return; }
    ready=true; kick();
  }

  host.addEventListener('touchstart', function(e){
    if(!measure()) return;
    const t=e.touches[0];
    origin=host.querySelector('button.on');
    pressed=true; moving=false; dragging=false; sx0=t.clientX;
    target=null; mark(nearest(t.clientX));
    targetX=xOf(target); v=0; kick();
  }, {passive:true});

  host.addEventListener('touchmove', function(e){
    if(!pressed) return;
    const t=e.touches[0];
    if(!moving){
      if(Math.abs(t.clientX-sx0) < 8) return;
      moving=true; dragging=true;
      offs = x - (t.clientX-ir.left-w/2);
    }
    x=clamp(t.clientX-ir.left-w/2+offs);
    mark(nearest(x+ir.left+w/2));
    kick();
    if(e.cancelable) e.preventDefault();
  }, {passive:false});

  function end(e){
    if(!pressed) return;
    pressed=false; moving=false; dragging=false;
    if(target) targetX=xOf(target);
    v=0; kick();
    if(e && e.cancelable) e.preventDefault();
    if(target && target!==origin){
      const t=target;
      setTimeout(function(){ t.click(); setTimeout(function(){ sync(true); }, 40); }, 320);
    }
  }
  host.addEventListener('touchend', end);
  host.addEventListener('touchcancel', end);

  host._fx={ sync:sync };
  sync(false);
}

async function checkId(){
  const g = curGame; if(!g) return false;
  const vals = {};
  for(const f of curFields()){
    const el = document.getElementById('fld_'+f.key);
    const v = (el && el.value || '').trim();
    if(!v){ notify('error'); toastErr(f.label+' kiriting'); return false; }
    const bad = badFormat(g.id, f.key, v);
    if(bad){ notify('error'); toastErr(f.label+': '+bad); return false; }
    vals[f.key] = v;
  }

  if(!CHECK_GAMES[g.id]){
    idOk = true; notify('success');
    if(vals.username != null){
      const u   = String(vals.username).replace(/^@+/,'');
      const own = !!(tgUser && tgUser.username &&
                     u.toLowerCase() === String(tgUser.username).toLowerCase());
      afterCheckUser(u, own);
    } else if(g.cats && g.cats.length){
      const c    = activeCat() || {};
      const key  = ((c.fields || [])[0] || {}).key;
      const main = key ? String(vals[key] || '') : (Object.values(vals)[0] || '');
      const sel  = (c.fields || []).filter(function(f){ return f.type === 'select'; })
        .map(function(f){
          const v = String(vals[f.key] || '');
          const o = (f.options || []).find(function(x){ return String(x.value) === v; });
          return o ? o.label : v;
        }).filter(Boolean).join(' \u00b7 ');
      const sub = (c.label ? c.label : '') + (sel ? ' \u00b7 ' + sel : '');

      /* Avval haqiqiy tekshiruvni sinaymiz. FazerCards ko'p o'yinda uni
         qo'llab-quvvatlamaydi \u2014 o'shanda format bo'yicha o'tkazamiz. */
      idOk = false; setRes('wait', 'Tekshirilmoqda\u2026'); syncBuy();
      const r = await fetch(VBASE + '/validate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ cat: c.cat, fields: vals })
      }).then(function(x){ return x.json(); }).catch(function(){ return null; });

      if(r && r.ok && r.valid){
        idOk = true; idName = r.name || ''; notify('success');
        afterCheckId(r.name || main, sub + (r.name ? '' : ''));
        return true;
      }
      if(r && !r.ok && (r.reason === 'invalid' || r.reason === 'unconfirmed' || r.reason === 'bad_id')){
        idOk = false; notify('error');
        setRes('bad', "\u274C Bunday akkaunt topilmadi. ID ni tekshiring.");
        syncBuy(); return false;
      }
      /* tekshiruv yo'q yoki API javob bermadi */
      idOk = true; notify('success');
      afterCheckId(main, sub);
    } else {
      setRes('ok', "✅ Format to'g'ri");
      syncBuy();
    }
    return true;
  }

  const btns = [].slice.call(document.querySelectorAll('.check-btn'));
  btns.forEach(function(b){ b.disabled = true; b.dataset.t = b.textContent; b.textContent = '…'; });
  setRes('wait', '⏳ Tekshirilmoqda…');

  try{
    const qs = 'game=' + encodeURIComponent(g.id)
             + '&playerId=' + encodeURIComponent(vals.playerId || '')
             + '&zoneId='   + encodeURIComponent(vals.serverId || '');
    const r = await fetch(VBASE + '/validate?' + qs);
    const j = await r.json();
    if(j && j.ok && j.valid){
      idOk = true; idName = j.name || ''; idRegion = j.region || '';
      notify('success');
      afterCheck();
    } else {
      idOk = false; notify('error');
      const m = {
        invalid:     "❌ Bunday ID topilmadi — raqamni tekshiring",
        bad_id:      "❌ ID formati noto'g'ri",
        bad_zone:    "❌ Server ID noto'g'ri",
        unconfirmed: "⚠️ Tasdiqlab bo'lmadi — qo'llab-quvvatlashga yozing",
        busy:        "⏳ Hozir band — bir daqiqadan keyin urinib ko'ring",
        unsupported: "❌ Bu o'yin tekshirilmaydi"
      };
      setRes('bad', m[j && j.reason] || "❌ Tekshirib bo'lmadi");
    }
  }catch(e){
    idOk = false; notify('error');
    setRes('bad', "⚠️ Aloqa yo'q — qaytadan urinib ko'ring");
  }

  btns.forEach(function(b){ b.disabled = false; if(b.dataset.t) b.textContent = b.dataset.t; });
  syncBuy();
  return idOk;
}
function buy(){
  const g=curGame;
  const custom = g && g.custom === 'stars';
  if(custom){
    if(!starN){ notify('error'); toastErr("Yulduzlar sonini kiriting ("+STAR_MIN+"–"+fmt(STAR_MAX)+")"); return; }
    if(starPrice(starN) > balance){ notify('error'); toastErr("❌ Balans yetarli emas — "+fmt(balance)+" so'm bor"); return; }
  } else if(selPkg===null){ notify('error'); toastErr('Paketni tanlang'); return; }
  if(!idOk){ notify('error'); toastErr("Avval ID ni tekshiring"); return; }
  const p = custom ? { a:String(starN), c:'⭐', p:starPrice(starN), oid:'' } : activePkgs()[selPkg];
  const details={};
  for(const f of curFields()){ const v=(document.getElementById('fld_'+f.key)?.value||'').trim();
    if(!v){ notify('error'); toastErr(f.label+' kiriting'); return; } details[f.key]=v; }
  saveId(g.id, Object.values(details).join(' '));
  const order={ id:'MT'+Date.now().toString().slice(-8), game:g.name, gameId:g.id, glyph:g.glyph, img:g.img||'',
    package:(p.a+(p.c&&p.c.length<=2?' '+p.c:'')), price:p.p, details, region:g.region?curRegion:null, nick:idName||'', accRegion:idRegion||'',
    cat: (g.cats && g.cats.length) ? (activeCat()||{}).cat : (g.cat||''), oid:p.oid||'',
    qty: custom ? starN : 0,
    tgUser: tgUser?{id:tgUser.id,username:tgUser.username,name:tgUser.first_name}:null,
    status:'wait', createdAt:new Date().toISOString() };
  saveOrder(order); notify('success');
fetch(VBASE + '/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order: order, initData: (tg && tg.initData) || '' })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok){
      if(typeof d.balance === 'number') balance = d.balance;
      toastOk('✅ Buyurtma qabul qilindi');
      setTimeout(function(){ go('history'); }, 700);
    } else if(d && d.error === 'balance'){
      if(typeof d.balance === 'number') balance = d.balance;
      notify('error');
      toastErr('❌ Balans yetarli emas — ' + fmt(d.balance||0) + " so'm bor");
    } else {
      notify('error'); toastErr("⚠️ Xato: " + ((d && d.error) || 'yuborilmadi'));
    }
  }).catch(function(){ notify('error'); toastErr("⚠️ Aloqa yo'q"); });  
}

function saveOrder(o){ try{ const a=getOrders(); a.unshift(o); localStorage.setItem('mt_orders', JSON.stringify(a.slice(0,60))); }catch(e){} }
var srvOrders = null, srvTopups = null, histTimer = null, histAt = 0;
function getTopups(){ return srvTopups || []; }
function getOrders(){ if(srvOrders) return srvOrders; try{ return JSON.parse(localStorage.getItem('mt_orders')||'[]'); }catch(e){ return []; } }
function loadOrders(cb){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid){ if(cb) cb(); return; }
  fetch(VBASE+"/orders?id="+uid+"&t="+Date.now())
   .then(function(r){ return r.json(); })
   .then(function(d){
     if(d && Array.isArray(d.topups)) srvTopups = d.topups;
     if(d && d.ok && Array.isArray(d.orders)){
       const loc = getOrders(), map = {};
       d.orders.forEach(function(x){ map[x.id] = x; });
       loc.forEach(function(x){ if(map[x.id]) x.status = map[x.id].status; });
       d.orders.forEach(function(x){ if(!loc.some(function(y){ return y.id === x.id; })) loc.push(x); });
       loc.sort(function(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); });
       srvOrders = loc;
       try{ localStorage.setItem('mt_orders', JSON.stringify(loc.slice(0,60))); }catch(e){}
     }
     if(cb) cb();
   })
   .catch(function(){ if(cb) cb(); });
}
function histTick(){
  clearTimeout(histTimer);
  if(!document.querySelector('.refresh-btn')) return;
  if(Date.now() - histAt > 3000){
    histAt = Date.now();
    loadOrders(function(){ if(document.querySelector('.refresh-btn')) renderHistory(); });
    return;
  }
  if(!getOrders().some(function(o){ return o.status === 'wait' || o.status === 'sent'; })) return;
  histTimer = setTimeout(function(){ histAt = 0; histTick(); }, 8000);
}
function renderHistory(){
  histTick();
  const fin = histTab==='finance';
  let rows;
  if(fin){
    const lim = Date.now() - 21*24*3600*1000;
    rows = getTopups().filter(function(t){
      const dead = (t.status==='cancel' || t.status==='expired');
      return !(dead && new Date(t.at).getTime() < lim);
    });
    if(histFilter==='done') rows=rows.filter(t=>t.status==='done');
    if(histFilter==='wait') rows=rows.filter(t=>t.status==='wait');
    if(histFilter==='cancel') rows=rows.filter(t=>t.status==='cancel'||t.status==='expired');
  } else {
    rows = getOrders();
    if(histFilter==='done') rows=rows.filter(o=>o.status==='done');
    if(histFilter==='wait') rows=rows.filter(o=>o.status==='wait'||o.status==='sent');
    if(histFilter==='cancel') rows=rows.filter(o=>o.status==='cancel'||o.status==='refund');
  }
  app.innerHTML = profileRow() + `
  <div class="page-title">Tarix</div>
  <div class="seg">
    <button class="${histTab==='orders'?'on':''}" onclick="setHistTab('orders')">Buyurtmalar</button>

  <div id="histList"></div>`;
  const list=document.getElementById('histList');
  if(!rows.length){
    list.innerHTML=`<div class="empty"><div class="em">🧾</div><h3>Hozircha bo'sh</h3><p>${fin?"To'lovlaringiz shu yerda ko'rinadi.":"Buyurtma bergach bu yerda ko'rinadi."}</p></div>`;
    return;
  }
  if(fin){
    list.innerHTML = rows.map(function(t){
      const ok = t.status==='done';
      const bad = (t.status==='cancel'||t.status==='expired');
      const lbl = ok ? "Tasdiqlandi" : bad ? "Bekor qilingan" : "Kutilmoqda";
      const style = bad ? ' style="color:#FF6B6B;background:rgba(255,107,107,.14)"' : '';

      const date = new Date(t.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<div class="order">
        <div class="top">
          <div class="g"><div class="ic">${ic}</div><div><div class="nm">${t.method||'Karta'}</div><div class="sub">Hisob to'ldirish</div></div></div>
          <div class="price"${ok?' style="color:#4FE0A0"':''}>+${fmt(t.amount)}<small>so'm</small></div>
        </div>
        <div class="sep"></div>
        <div class="kv"><span class="k">Holat</span><span class="badge-st ${ok?'done':'wait'}"${style}>${lbl}</span></div>
        <div class="date">${date}</div>
      </div>`;
    }).join('');
    return;
  }
  list.innerHTML = rows.map(o=>{
    const st = o.status==='done'?['done','Bajarildi'] : o.status==='cancel'?['wait','Bekor qilingan'] : o.status==='refund'?['wait','Pul qaytarildi'] : o.status==='sent'?['wait','Yuborilmoqda'] : ['wait','Kutilmoqda'];
    const idVal = o.details ? Object.values(o.details)[0] : '';
    const date = new Date(o.createdAt||o.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="order">
      <div class="top">
        <div class="g"><div class="ic">${o.img?`<img src="${o.img}">`:(o.glyph||'🎮')}</div>
        <div><div class="nm">${o.game}</div><div class="sub">${o.package}</div></div></div>
        <div class="price">-${fmt(o.price)}<small>so'm</small></div>
      </div>

      <div class="kv"><span class="k">O'yinchi ID</span><span class="v">${idVal}</span></div>
      <div class="kv"><span class="k">Holat</span><span class="badge-st ${st[0]}">${st[1]}</span></div>
      <div class="date">${date}</div>
    </div>`;
  }).join('');

function loadDynGames(){
  fetch(VBASE + '/games').then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.ok || !Array.isArray(d.games)) return;
    const add = d.games.filter(function(g){
      return g && g.id && g.cats && g.cats.length && !GAMES.some(function(x){ return x.id === g.id; });
    }).map(function(g){
      return { id:g.id, name:g.name, glyph:g.glyph || '\uD83C\uDFAE', img:g.img || '',
               cur:'', region:false, star:'', badge:'AVTO',
               cats:g.cats, idFields:[], packages:[] };
    });
    if(!add.length) return;
    GAMES.push.apply(GAMES, add);
    if(view === 'home') renderHome();
  }).catch(function(){});
}

function loadBalance(){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid) return;
  fetch(VBASE + '/balance?id=' + uid).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok && typeof d.balance === 'number' && d.balance !== balance){
      balance = d.balance;
      if(view === 'home') renderHome();
      else if(view === 'settings'){ renderSettings(); loadPhone(); }
    }
  }).catch(function(){});
}
function loadPhone(){
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid) return;
  if(phoneCache) setPhoneText(phoneCache);
  else if(!phoneLoaded) hidePhoneSection(true);
  fetch("https://api.minatoh.uz/phone?id=" + uid)
    .then(function(r){ return r.json(); })
    .then(function(d){
      phoneLoaded = true;
      if(d && d.phone){ phoneCache = d.phone; setPhoneText(d.phone); }
      else hidePhoneSection(false);
    })
    .catch(function(){ phoneLoaded = true; hidePhoneSection(false); });
}
function sharePhone(){
  haptic();
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid){ notify('error'); toastErr('Telegram orqali oching'); return; }

  /* Yangi usul: raqam ILOVA ICHIDA so'raladi, botga o'tish shart emas */
  try{
    if(tg && typeof tg.requestContact === 'function' &&
       (!tg.isVersionAtLeast || tg.isVersionAtLeast('6.9'))){
      tg.requestContact(function(ok){
        if(ok){
          toastOk("Raqamingiz saqlandi");
          setTimeout(function(){ phoneCache = null; phoneLoaded = false; loadPhone(); }, 1400);
        } else {
          toastErr("Telefon raqami yuborilmadi");
        }
      });
      return;
    }
  }catch(e){}

  /* Eski Telegram uchun zaxira: botga o'tkazamiz */
  toast("📱 Botga o'tilmoqda...");
  fetch("https://api.minatoh.uz/ask-phone",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:(tg&&tg.initData)||""})})
   .then(function(r){ return r.json(); })
   .then(function(d){
     if(d && d.already){ setPhoneText(d.phone); toastOk("Raqamingiz allaqachon saqlangan"); return; }
     if(!d || !d.ok){ toastErr("Xatolik, qayta urining"); return; }

   })
   .catch(function(){ toastErr("Xatolik, qayta urining"); });
}

}

/* ---------- Telegram Stars orqali to'ldirish ----------
   Kurs serverdan olinadi (server.js dagi STAR_TOPUP_RATE), shu yerda qattiq
   yozilmaydi — ikkalasi hech qachon bir-biridan ayrilib qolmasligi uchun. */
let stN = 0, stRate = 140, stMin = 10, stMax = 100000, stBusy = false, stConfirm = 0;
fetch(VBASE + '/star-rate').then(r=>r.json()).then(function(d){
  if(d && d.ok){ stRate = d.rate; stMin = d.min; stMax = d.max;
    if(topMethod === 'stars') onStTop(); }
}).catch(function(){});

function onStTop(){
  const el = document.getElementById('stTop');
  if(!el) return;
  let v = String(el.value||'').replace(/[^0-9]/g,'').replace(/^0+/,'');
  if(v.length > 6) v = v.slice(0,6);
  if(el.value !== v) el.value = v;
  const n = parseInt(v,10) || 0;
  stN = (n >= stMin && n <= stMax) ? n : 0;

  const s = document.getElementById('stSom');
  if(s) s.value = n ? (fmt(n * stRate) + " so'm") : '—';
  const h = document.getElementById('stHint');
  if(h){
    let warn = '';
    if(n && n < stMin) warn = `<div style="color:var(--gold)">Eng kami ${stMin} ⭐</div>`;
    else if(n > stMax) warn = `<div style="color:var(--gold)">Eng ko'pi ${fmt(stMax)} ⭐</div>`;
    h.innerHTML = warn + `<div>1 ⭐ = ${fmt(stRate)} so'm</div>`
      + `<div>Xohlagan miqdorni kiriting — qancha yulduzingiz bo'lsa shuncha.</div>`;
  }
  const b = document.getElementById('stBtn');
  if(b) b.disabled = !(stN > 0) || stBusy;
}

}
function stBack(){ haptic(); stConfirm = 0; stBusy = false; renderTopup(); }

function payStars(){
  const n = stConfirm || stN;
  const b = document.getElementById('stBtn');
  if(!n){ stSay('Miqdor kiritilmagan', true); return; }
  if(stBusy){ stBusy = false; if(b) b.disabled = false; }
  haptic();
  stBusy = true;
  if(b){ b.disabled = true; b.textContent = 'Yuborilmoqda\u2026'; }
  stSay('So\'rov yuborildi\u2026');
  const done = function(){ stBusy = false;
    const x = document.getElementById('stBtn');
    if(x){ x.textContent = "\u2b50 To'lovga o'tish"; x.disabled = false; } };

  fetch(VBASE + '/star-invoice', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ stars: n, initData: (tg && tg.initData) || '' })
  }).then(function(r){ return r.json(); }).then(function(d){
    done();
    if(!d || !d.ok || !d.link){
      const e = (d && d.error) || 'javob yo\'q';
      notify('error');
      stSay(e === 'qty'  ? stMin + '\u2013' + fmt(stMax) + ' \u2b50 oralig\'ida kiriting'
          : e === 'auth' ? 'Telegram tasdiqlamadi \u2014 ilovani qayta oching'
          : 'Server xatosi: ' + e, true);
      return;
    }
    openInvoice(d.link);
  }).catch(function(err){
    done(); notify('error');
    stSay('Aloqa xatosi: ' + (err && err.message ? err.message : '?'), true);
  });
}

/* Telegram SDK jimgina to'xtaganda sababni console.error ga yozadi \u2014
   telefonda uni ko'rib bo'lmagani uchun tutib olamiz. */
const tgErrs = [];
(function(){
  const ce = console.error;
  console.error = function(){
    try{
      const s = Array.prototype.slice.call(arguments).join(' ');
      if(s.indexOf('Telegram') > -1) tgErrs.push(s);
    }catch(e){}
    try{ return ce.apply(console, arguments); }catch(e){}
  };
})();

/* Hisob-fakturani Mini App ICHIDA ochamiz */
function openInvoice(link){
  const ver = (tg && tg.version) || '?';
  const before = tgErrs.length;
  stSay('To\'lov oynasi ochilmoqda\u2026');

  if(!tg || typeof tg.openInvoice !== 'function'){
    stSay('openInvoice yo\'q (Telegram v' + ver + ')', true);
    showSendBtn(); return;
  }
  try{
    tg.openInvoice(link, function(status){
      if(status === 'paid'){
        notify('success');
        stSay('\u2705 To\'lov qabul qilindi \u2014 balans to\'lmoqda');
        toastOk("✅ To'lov qabul qilindi");
        setTimeout(function(){ go('home'); loadBalance(); }, 1500);
      } else if(status === 'failed'){
        notify('error'); stSay('To\'lov o\'tmadi', true); showSendBtn();
      } else if(status === 'cancelled'){
        stSay('To\'lov bekor qilindi', true);
      } else {
        stSay('Holat: ' + status, true);
      }
    });
  }catch(e){
    stSay('openInvoice xato (v' + ver + '): ' + (e && e.message ? e.message : '?'), true);
    showSendBtn(); return;
  }
  /* 3 soniyada oyna ochilmasa \u2014 SDK xatosini ko'rsatamiz va zaxira tugmani beramiz */
  setTimeout(function(){
    const h = document.getElementById('stHint');
    if(!h || h.textContent.indexOf('ochilmoqda') < 0) return;
    const e = tgErrs.length > before ? tgErrs[tgErrs.length-1] : '';
    stSay(e ? ('SDK: ' + e) : ('Oyna ochilmadi (Telegram v' + ver + ')'), true);
    showSendBtn();
  }, 3000);
}

/* Zaxira: hisob-fakturani bot chatiga yuborib, ilovani yopamiz */
function showSendBtn(){
  if(document.getElementById('stSend')) return;
  const h = document.getElementById('stHint');
  if(!h) return;
  const b = document.createElement('button');
  b.id = 'stSend'; b.className = 'check-btn';
  b.style.cssText = 'width:100%;margin-top:10px;padding:12px';
  b.textContent = 'Botga yuborish';
  b.onclick = function(){
    b.disabled = true; b.textContent = 'Yuborilmoqda\u2026';
    fetch(VBASE + '/star-invoice', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ stars: (stConfirm || stN), send: true, initData: (tg && tg.initData) || '' })
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.ok){
        stSay('\u2705 To\'lov tugmasi botga yuborildi');
        setTimeout(function(){ if(tg && tg.close){ try{ tg.close(); }catch(e){} } }, 800);
      } else {
        b.disabled = false; b.textContent = 'Botga yuborish';
        stSay('Yuborilmadi: ' + ((d && d.error) || '?'), true);
      }
    }).catch(function(){ b.disabled = false; b.textContent = 'Botga yuborish'; });
  };
  h.parentNode.insertBefore(b, h.nextSibling);
}

/* To'lovdan keyin balans o'zgarishini kutamiz: 3 soniyada bir, 90 soniya davomida */
let balWatch = null;
function watchBalance(){
  clearInterval(balWatch);
  const uid = tgUser && tgUser.id ? tgUser.id : '';
  if(!uid) return;
  const was = balance;
  let n = 0;
  balWatch = setInterval(function(){
    n++;
    if(n > 30){ clearInterval(balWatch); return; }
    fetch(VBASE + '/balance?id=' + uid + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok && typeof d.balance === 'number' && d.balance > was){
          clearInterval(balWatch);
          balance = d.balance;
          notify('success');
          toastOk("✅ Balans to'ldi: " + fmt(balance) + " so'm");
          go('home');
        }
      }).catch(function(){});
  }, 3000);
}

function pickPay(m){ haptic(); topMethod=m; stConfirm=0; stBusy=false; renderTopup(); }
function copyCard(n){ haptic(); try{ navigator.clipboard.writeText(String(n).replace(/\s/g,'')); }catch(e){} notify('success'); toastOk('Nusxalandi'); }

function topPaid(){
  haptic('medium'); notify('success');
  topPend=null; clearInterval(topTick);
  toastOk("Qabul qilindi — admin tekshiradi");

}

function topCancel(){
  haptic();
  const id = topPend ? topPend.id : '';
  topPend=null; clearInterval(topTick);
  if(id) fetch(VBASE + '/topup-cancel', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id:id, initData:(tg&&tg.initData)||'' }) }).catch(function(){});

function sendTopup(){
  const el=document.getElementById('topAmount');
  const amt=Number(((el&&el.value)||'').replace(/\D/g,''));
  if(!amt || amt<1000){ notify('error'); toastErr("Kamida 1000 kiriting"); return; }
  const bank = (CARDS[topMethod] || CARDS.uz).bank;
  const btn = document.getElementById('topBtn');
  const box = document.getElementById('payBox');
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  if(box){ box.className='id-res wait'; box.textContent=tr('⏳ Tayyorlanmoqda…'); }
  fetch(VBASE + '/topup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ amount: amt, method: bank, initData: (tg && tg.initData) || '' })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(btn){ btn.disabled = false; btn.textContent = tr('Davom etish'); }
    if(d && d.ok){
      notify('success');
      topPend = { id: d.id, pay: d.pay, base: amt, m: topMethod, until: Date.now() + 600000 };
      renderTopup();
    } else {
      notify('error');
      const m = { amount:"Summa noto'g'ri", pending:"Sizda 3 ta kutilayotgan so'rov bor",
                  auth:"Telegram orqali oching", busy:"Hozir band, keyinroq urinib ko'ring" };
      if(box){ box.className='id-res bad'; box.textContent = "❌ " + (m[d && d.error] || "Yuborilmadi"); }
    }
  }).catch(function(){
        if(btn){ btn.disabled = false; btn.textContent = tr('Davom etish'); }
    notify('error');
    if(box){ box.className='id-res bad'; box.textContent = "⚠️ Aloqa yo'q"; }
  });
}
function payMethod(m){ haptic('medium'); toast(m+' — tez orada ulanadi 💳'); }

let tt;
function toast(msg, kind){
  const el = document.getElementById('toast');
  if(!el) return;
  const k = kind || 'info';
  el.className = 'toast t-' + k;
  el.textContent = tr(msg);
  void el.offsetWidth;
  el.classList.add('show');
  if(k === 'ok'){ notify('success'); sndOk(); }
  else if(k === 'err'){ notify('error'); sndErr(); }
  else { haptic('light'); }
  clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}
function toastOk(m){ toast(m, 'ok'); }
function toastErr(m){ toast(m, 'err'); }

/* ---- Tovush: iPhone "Akkord" va "Sirg'anish" ga yaqin ohanglar ---- */
let _ac = null, sndOn = true;
try{ sndOn = localStorage.getItem('mt_snd') !== '0'; }catch(e){}
function _ctx(){
  try{
    if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if(_ac.state === 'suspended') _ac.resume();
    return _ac;
  }catch(e){ return null; }
}
function tone(freq, dur, vol, delay){
  const c = _ctx(); if(!c) return;
  try{
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
/* Akkord \u2014 uchta nota birga, yumshoq (muvaffaqiyat) */
function sndOk(){
  if(!sndOn) return;
  tone(523.25, 0.55, 0.050, 0);
  tone(659.25, 0.55, 0.042, 0.035);
  tone(783.99, 0.60, 0.038, 0.070);
}
/* Sirg'anish \u2014 pastga tushuvchi ohang (xato) */
function sndErr(){
  if(!sndOn) return;
  const c = _ctx(); if(!c) return;
  try{
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(760, t);
    o.frequency.exponentialRampToValueAtTime(190, t + 0.30);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.40);
  }catch(e){}
}
